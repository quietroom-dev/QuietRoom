<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>誰かわからん通話 プロフィール編集</title>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script> <!-- ★ 追加 -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

<style>
body{
  margin:0;
  background:#f5f7fa;
  color:#334155;
  font-family:Inter,"Helvetica Neue",Arial,sans-serif;
  padding:20px;
}

.page{
  max-width:700px;
  margin:0 auto;
}

.card{
  background:#fff;
  border-radius:16px;
  padding:24px;
  box-shadow:0 6px 24px rgba(15,23,42,.08);
}

h2{
  margin:0 0 24px;
  color:#344054;
  font-size:28px;
}

label{
  display:block;
  margin-top:14px;
  margin-bottom:6px;
  font-size:14px;
  font-weight:600;
  color:#475467;
}

input,
select,
textarea{
  width:100%;
  box-sizing:border-box;
  padding:12px;
  border-radius:10px;
  border:1px solid #d7dde5;
  background:#fff;
  color:#334155;
  font-size:16px; /* iPhone拡大防止 */
}

textarea{
  min-height:100px;
  resize:vertical;
}

.button-row{
  display:flex;
  gap:12px;
  margin-top:20px;
  flex-wrap:wrap;
}

.primary-btn{
  background:#5d7087;
  color:#fff;
  border:none;
  padding:12px 18px;
  border-radius:12px;
  cursor:pointer;
  font-size:16px;
  font-weight:600;
}

.secondary-btn{
  background:#fff;
  color:#5d7087;
  border:1px solid #d7dde5;
  padding:12px 18px;
  border-radius:12px;
  cursor:pointer;
  font-size:16px;
  font-weight:600;
}

.primary-btn:hover,
.secondary-btn:hover{
  opacity:.9;
}

#incomingCall{
  position:fixed;
  inset:0;
  background:rgba(15,23,42,.75);
  backdrop-filter:blur(6px);
  display:none;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  z-index:999;
  padding:24px;
  text-align:center;
}

#incomingCall h2{
  background:#fff;
  color:#344054;
  padding:24px;
  border-radius:16px 16px 0 0;
  margin:0;
  width:min(500px,100%);
}

#callerProfile{
  background:#fff;
  color:#667085;
  width:min(500px,100%);
  padding:20px;
}

#incomingCall button{
  width:250px;
  margin-top:12px;
  border:none;
  border-radius:12px;
  padding:12px;
  font-size:16px;
  cursor:pointer;
}

#incomingCall button:first-of-type{
  background:#5d7087;
  color:#fff;
}

#incomingCall button:last-of-type{
  background:#fff;
  color:#475467;
  border:1px solid #d7dde5;
}

@media(max-width:700px){

  body{
    padding:16px;
  }

  .button-row{
    flex-direction:column;
  }

  .button-row button{
    width:100%;
  }

  h2{
    font-size:24px;
  }
}
</style>
</head>

<body>

<div class="page">
  <div class="card">

    <h2>プロフィール編集</h2>
  <label>ニックネーム</label>
  <input id="nickname">

  <label>性別</label>
  <select id="gender">
    <option value="男性">男性</option>
    <option value="女性">女性</option>
    <option value="その他">その他</option>
  </select>

  <label>年齢</label>
  <input id="age" type="number">

  <label>都道府県</label>
  <input id="prefecture">

  <label>ひとこと</label>
  <textarea id="comment"></textarea>

  <div class="button-row">
  <button id="saveBtn" class="primary-btn">
    保存する
  </button>

  <button
    class="secondary-btn"
    onclick="location.href='profiles.html'">
    一覧へ戻る
  </button>
</div>

  </div>
</div>

<!-- ▼ 着信UI ▼ -->
<div id="incomingCall">
  <h2>📞 通話リクエストがきています。</h2>
  <div id="callerProfile"></div>
  <button onclick="acceptCall()">出る</button>
  <button onclick="declineCall()">出ない</button>
</div>

<script>
/* =========================================
   Firebase
========================================= */
const firebaseConfig = {
  apiKey: "AIzaSyDXSKJaknyhXGtrFQCzYhmA6r7VQR0K_GM",
  authDomain: "roomvideo.firebaseapp.com",
  projectId: "roomvideo",
  storageBucket: "roomvideo.firebasestorage.app",
  messagingSenderId: "1030429439546",
  appId: "1:1030429439546:web:1481670cb78deb35e2a703"
};
firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();          // ★ 追加
const db = firebase.firestore();

/* =========================================
   匿名ログイン（必須）
========================================= */
auth.signInAnonymously().catch(err => {
  console.error("匿名ログイン失敗:", err);
});

/* =========================================
   ログイン完了後に処理開始
========================================= */
auth.onAuthStateChanged(async user => {
  if (!user) return;

  const myUid = localStorage.getItem("myUid");
  if (!myUid) {
    alert("エラー：UID がありません。再ログインしてください。");
    location.href = "index.html";
    return;
  }

  /* =========================================
     プロフィール読み込み
  ========================================== */
  const snap = await db.collection("user").doc(myUid).get();
  const d = snap.data();
  nickname.value = d.nickname;
  gender.value = d.gender;
  age.value = d.age;
  prefecture.value = d.prefecture;
  comment.value = d.comment;

  /* =========================================
     保存
  ========================================== */
  document.getElementById("saveBtn").onclick = async () => {
    await db.collection("user").doc(myUid).update({
      nickname: nickname.value,
      gender: gender.value,
      age: age.value,
      prefecture: prefecture.value,
      comment: comment.value
    });
    alert("プロフィールを保存しました");
  };

  /* =========================================
     ▼▼ 着信リスナー ▼▼
  ========================================== */
  db.collection("calls").doc(myUid).onSnapshot(async (snap) => {
    const data = snap.data();
    if (!data) return;

    if (data.offer && data.from) {
      showIncomingCall(data.from);
    }
  });
});

/* =========================================
   着信UI
========================================= */
async function showIncomingCall(fromUid) {
  const prof = await db.collection("user").doc(fromUid).get();
  const d = prof.data();

  callerProfile.innerHTML = `
    <p>名前：${d.nickname}</p>
    <p>性別：${d.gender}</p>
    <p>都道府県：${d.prefecture}</p>
    <p>ひとこと：${d.comment}</p>
  `;

  window._incomingFrom = fromUid;
  incomingCall.style.display = "flex";
}

function acceptCall() {
  window.location.href = `video.html?target=${window._incomingFrom}`;
}

function declineCall() {
  const myUid = localStorage.getItem("myUid");
  db.collection("calls").doc(myUid).delete();
  incomingCall.style.display = "none";
}
</script>

</body>
</html>
