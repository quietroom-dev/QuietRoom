<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>誰かわからん通話 プロフィール一覧</title>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

<style>
body{
  margin:0;
  background:#f5f7fa;
  color:#334155;
  font-family:Inter,"Helvetica Neue",Arial,sans-serif;
  padding:20px;
}

.top-actions{
  display:flex;
  gap:10px;
  margin-bottom:20px;
  flex-wrap:wrap;
}

button{
  border:none;
  cursor:pointer;
  font-size:15px;
  border-radius:12px;
  padding:12px 16px;
  transition:.2s;
}

button:hover{
  opacity:.9;
}

.action-btn{
  background:#5d7087;
  color:#fff;
}

.edit-btn{
  background:#fff;
  color:#5d7087;
  border:1px solid #d7dde5;
}

h2{
  margin:0 0 20px;
  color:#344054;
  font-size:28px;
}

.user-card{
  background:#fff;
  padding:18px;
  margin-bottom:16px;
  border-radius:16px;
  box-shadow:0 4px 16px rgba(15,23,42,.08);
  border:1px solid #eef2f6;
}

.user-card h3{
  margin:0 0 12px;
  color:#344054;
  font-size:20px;
}

.user-card p{
  margin:6px 0;
  color:#667085;
  line-height:1.5;
}

.user-card button{
  margin-top:10px;
  margin-right:8px;
}

.user-card button:nth-of-type(1){
  background:#5d7087;
  color:#fff;
}

.user-card button:nth-of-type(2){
  background:#fff3cd;
  color:#8a6d3b;
  border:1px solid #ffe69c;
}

.user-card button:nth-of-type(3){
  background:#ffe5e5;
  color:#c62828;
  border:1px solid #ffcaca;
}

#incomingCall{
  position:fixed;
  inset:0;
  background:rgba(15,23,42,.75);
  backdrop-filter:blur(6px);
  display:none;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  z-index:999;
  padding:24px;
  text-align:center;
}

#incomingCall h2{
  background:#fff;
  color:#344054;
  padding:24px;
  border-radius:16px 16px 0 0;
  margin:0;
  width:min(500px,100%);
}

#callerProfile{
  background:#fff;
  color:#667085;
  width:min(500px,100%);
  padding:20px;
}

#incomingCall button{
  width:250px;
  margin-top:12px;
}

#incomingCall button:first-of-type{
  background:#5d7087;
  color:#fff;
}

#incomingCall button:last-of-type{
  background:#fff;
  color:#475467;
  border:1px solid #d7dde5;
}

@media(max-width:700px){

  body{
    padding:16px;
  }

  h2{
    font-size:24px;
  }

  .user-card{
    padding:16px;
  }

  .user-card button{
    width:100%;
    margin-right:0;
    margin-bottom:8px;
  }
}
</style>
</head>

<body>

<div class="top-actions">

    <button class="action-btn"
            onclick="location.href='profiles.html'">
        ← プロフィール一覧へ戻る
    </button>

</div>

<h2>📝 伝言板</h2>

<div class="user-card">

    <h3>メッセージを投稿</h3>

    <textarea
        id="message"
        placeholder="みんなへのメッセージを書いてください。"
        style="
            width:100%;
            height:120px;
            border:1px solid #d7dde5;
            border-radius:12px;
            padding:12px;
            box-sizing:border-box;
            resize:none;
            font-size:15px;
        ">
    </textarea>

    <button
        id="postBtn"
        class="action-btn"
        style="margin-top:15px;">
        投稿する
    </button>

</div>

<h2 style="margin-top:30px;">
投稿一覧
</h2>

<div id="messageList">

</div>

  
<script>
// Firebase初期化
firebase.initializeApp({
  apiKey: "AIzaSyDXSKJaknyhXGtrFQCzYhmA6r7VQR0K_GM",
  authDomain: "roomvideo.firebaseapp.com",
  projectId: "roomvideo",
  storageBucket: "roomvideo.firebasestorage.app",
  messagingSenderId: "1030429439546",
  appId: "1:1030429439546:web:1481670cb78deb35e2a703"
});

const auth = firebase.auth();
const db = firebase.firestore();

let myUid = "";
let myNickname = "";

auth.onAuthStateChanged(async (user) => {

    if (!user) {
        await auth.signInAnonymously();
        return;
    }

    myUid = user.uid;

    const profile = await db.collection("user")
        .doc(myUid)
        .get();

    if (!profile.exists) {

        alert("プロフィールがありません。");

        location.href = "index.html";

        return;

    }

    myNickname = profile.data().nickname || "";

    if (myNickname == "") {

        alert("ニックネーム登録後に投稿できます。");

    }

});
document.getElementById("postBtn").addEventListener("click", async () => {

    if (myNickname == "") {

        alert("ニックネーム登録後に投稿できます。");

        return;

    }

    const message =
        document.getElementById("message").value.trim();

    if (message == "") {

        alert("メッセージを入力してください。");

        return;

    }

    const deleteAt = new Date();
deleteAt.setDate(deleteAt.getDate() + 7);

await db.collection("messageBoard").add({

    uid: myUid,

    nickname: myNickname,

    message: message,

    createdAt:
        firebase.firestore.FieldValue.serverTimestamp(),

    deleteAt:
        firebase.firestore.Timestamp.fromDate(deleteAt)

});

    document.getElementById("message").value = "";

});
db.collection("messageBoard")
.orderBy("createdAt", "desc")
.limit(50)
.onSnapshot((snapshot) => {

    const list =
        document.getElementById("messageList");

    list.innerHTML = "";

    snapshot.forEach((doc) => {

    const data = doc.data();
const id = doc.id;

// 作成日時がある場合は7日経過を確認
if (data.createdAt) {

    const created =
        data.createdAt.toDate();

    const now = new Date();

    const days =
        (now - created) / 1000 / 60 / 60 / 24;

    if (days >= 7) {

        db.collection("messageBoard")
          .doc(id)
          .delete();

        return;

    }

}

const card = document.createElement("div");

        card.className = "user-card";

        const date = data.createdAt
    ? data.createdAt.toDate().toLocaleString("ja-JP")
    : "投稿直後";

card.innerHTML = `
    <h3>${data.nickname}</h3>

    <p style="font-size:13px;color:#888;">
        ${date}
    </p>

    <p style="
    white-space:pre-wrap;
    word-break:break-word;
    line-height:1.6;
">
${data.message}
</p>

    ${
        data.uid == myUid
        ? `<button class="edit-btn" onclick="deleteMessage('${id}')">
              🗑 削除
           </button>`
        : ""
    }
`;

        list.appendChild(card);

    });

});
async function deleteMessage(id){

    if(!confirm("この投稿を削除しますか？")){
        return;
    }

    await db.collection("messageBoard")
        .doc(id)
        .delete();

}
</script>

</body>
</html>
