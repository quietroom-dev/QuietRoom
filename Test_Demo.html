<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>誰かわからん通話（デモ）</title>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

<style>
html, body { margin:0; padding:0; overflow:hidden; background:#000; font-family:sans-serif; }

#mainCanvas { position:fixed; inset:0; width:100vw; height:100vh; z-index:1; pointer-events:none; }

/* 自分の映像は実際のカメラ比率を維持し、上部UIと重ならない位置に置く */
#selfVideo, #selfCanvas {
  position:fixed; top:78px; right:16px; height:24vh; width:auto;
  max-width:34vw; max-height:34vh; object-fit:contain; background:#000;
  border-radius:12px;
}
#selfVideo { z-index:10; box-shadow:0 0 12px rgba(0,0,0,0.5); }
#selfCanvas { z-index:11; pointer-events:none; }

/* 内カメラの自分の映像だけ鏡表示 */
body.self-mirrored #selfVideo,
body.self-mirrored #selfCanvas { transform:scaleX(-1); }

/* 最上段：入力欄・送信・終了 */
#messageForm {
  position:fixed; top:12px; left:12px; right:12px; z-index:50;
  display:flex; align-items:center; gap:8px; padding-right:0;
}
#messageInput {
  flex:1; min-width:0; height:44px; box-sizing:border-box;
  border:1px solid rgba(255,255,255,0.65); border-radius:10px;
  background:transparent; color:#fff; padding:0 12px; font-size:16px; outline:none;
}
#messageInput::placeholder { color:rgba(255,255,255,0.8); }
.action-btn {
  box-sizing:border-box; height:44px; padding:0 14px; border:0; border-radius:10px;
  color:#fff; font-size:14px; font-weight:600; white-space:nowrap; cursor:pointer;
}
#sendMessage { background:#4388f5; }
#endBtn { background:#d93030; }

/* 相手メッセージは枠なし・文字だけ */
#floatingMessage {
  position:fixed; top:66px; left:12px; right:calc(34vw + 28px); z-index:35;
  color:#fff; font-size:18px; line-height:1.45; overflow-wrap:anywhere;
  text-shadow:0 1px 4px #000, 0 0 8px #000; pointer-events:none;
  opacity:0; visibility:hidden;
}
#floatingMessage.show { visibility:visible; animation:messageInOut 4s ease forwards; }
@keyframes messageInOut {
  0% { opacity:0; transform:translateY(8px); }
  12% { opacity:1; transform:translateY(0); }
  82% { opacity:1; transform:translateY(0); }
  100% { opacity:0; transform:translateY(-6px); }
}

/* カメラ切替は自分の映像の真下中央 */
#switchCamera {
  position:fixed; z-index:45; height:40px; padding:0 12px; border:0; border-radius:10px;
  background:rgba(0,0,0,0.72); color:#fff; font-size:14px; font-weight:600;
  white-space:nowrap; cursor:pointer;
}

/* モザイク強度バーは右端。上部から少し下げて配置 */
.mosaic-meter {
  position:fixed; right:12px; top:calc(78px + 24vh + 82px); z-index:40;
  display:flex; flex-direction:column; align-items:center; color:#fff;
}
.meter-bar { width:38px; height:24vh; display:flex; flex-direction:column-reverse; gap:4px; }
.meter-block { flex:1; width:100%; box-sizing:border-box; border-radius:8px; border:2px solid rgba(255,255,255,0.7); background:rgba(255,255,255,0.2); transition:0.15s; }
.meter-block.active { background:rgba(255,255,255,1); }
.meter-top, .meter-bottom { margin:6px 0; padding:6px 8px; border-radius:8px; background:rgba(0,0,0,0.65); cursor:pointer; user-select:none; font-size:12px; white-space:nowrap; }
body.camera-switching #selfVideo, body.camera-switching #selfCanvas { visibility:hidden; }

@media (max-width:520px) {
  #messageForm { top:8px; left:8px; right:8px; gap:5px; }
  #messageInput { height:42px; padding:0 9px; }
  .action-btn { height:42px; padding:0 10px; font-size:13px; }
  #selfVideo, #selfCanvas { top:68px; height:21vh; max-width:38vw; max-height:28vh; right:10px; }
  #floatingMessage { top:58px; left:8px; right:calc(38vw + 18px); font-size:16px; }
  .mosaic-meter { right:8px; top:calc(68px + 21vh + 74px); }
  .meter-bar { height:20vh; width:32px; }
  .meter-top, .meter-bottom { padding:5px 6px; font-size:11px; }
  #switchCamera { height:36px; font-size:12px; padding:0 9px; }
}
</style>
</head>

<body>
<canvas id="mainCanvas"></canvas>
<video id="selfVideo" autoplay muted playsinline></video>
<canvas id="selfCanvas"></canvas>

<form id="messageForm">
  <input id="messageInput" type="text" maxlength="80" placeholder="メッセージを入力" autocomplete="off" />
  <button class="action-btn" id="sendMessage" type="submit">送信</button>
  <button class="action-btn" id="endBtn" type="button">終了</button>
</form>
<div id="floatingMessage" aria-live="polite"></div>
<button id="switchCamera" type="button">カメラ切替</button>

<div class="mosaic-meter">
  <div class="meter-top" id="meterUp">▲ モザイク</div>
  <div class="meter-bar" id="meterBar"></div>
  <div class="meter-bottom" id="meterDown">▼ クリア</div>
</div>

<script>
/* Firebase */
firebase.initializeApp({
  apiKey: "AIzaSyDXSKJaknyhXgtrGFQCzYhmA6r7VQR0K_GM",
  authDomain: "roomvideo.firebaseapp.com",
  projectId: "roomvideo",
  storageBucket: "roomvideo.firebasestorage.app",
  messagingSenderId: "1030429439546",
  appId: "1:1030429439546:web:1481670cb78deb35e2a703"
});
const auth = firebase.auth();
const db = firebase.firestore();

/* 管理者用 adminCalls */
let adminPc = null;
let adminCallDoc = null;
let adminOfferCandidates = null;
let adminAnswerCandidates = null;

/* モザイク（自分） */
let myMosaicLevel = 5;
let myMosaicSize = 40;
const mosaicSizes = [1, 12, 16, 22, 30, 40];
let currentFacing = "user";
let localStream = null;
let isSwitchingCamera = false;
let cameraStarted = false;
let adminMonitorStarted = false;
let messageTimer = null;

function updateSelfMirror() {
  document.body.classList.toggle("self-mirrored", currentFacing === "user");
}

/* 相手映像（固定画像） */
const mainCanvas = document.getElementById("mainCanvas");
const mainCtx = mainCanvas.getContext("2d");
const partnerImg = new Image();
partnerImg.src = "IMG_5885.png";
partnerImg.onload = () => drawMosaic();

/* 自分映像 */
const selfVideo = document.getElementById("selfVideo");
const selfCanvas = document.getElementById("selfCanvas");
const selfCtx = selfCanvas.getContext("2d");
const switchCameraButton = document.getElementById("switchCamera");

/* カメラ枠・切替ボタン位置を映像の実寸に合わせる */
function positionSelfControls() {
  const rect = selfVideo.getBoundingClientRect();
  if (!rect.width || !rect.height) return;
  selfCanvas.style.left = `${rect.left}px`;
  selfCanvas.style.top = `${rect.top}px`;
  selfCanvas.style.width = `${rect.width}px`;
  selfCanvas.style.height = `${rect.height}px`;
  selfCanvas.style.right = "auto";
  selfCanvas.style.bottom = "auto";
  switchCameraButton.style.left = `${rect.left + rect.width / 2}px`;
  switchCameraButton.style.top = `${rect.bottom + 8}px`;
  switchCameraButton.style.transform = "translateX(-50%)";
}
selfVideo.addEventListener("loadedmetadata", () => requestAnimationFrame(positionSelfControls));
selfVideo.addEventListener("loadeddata", () => requestAnimationFrame(positionSelfControls));
selfVideo.addEventListener("resize", () => requestAnimationFrame(positionSelfControls));
window.addEventListener("resize", () => requestAnimationFrame(positionSelfControls));

/* カメラ開始 */
auth.onAuthStateChanged(async user => {
  // カメラ映像はFirebaseのログイン状態に関係なく起動する。
  if (!cameraStarted) {
    cameraStarted = true;
    try {
      await startCamera();
    } catch (err) {
      cameraStarted = false;
      console.error("カメラを開始できません:", err);
      const detail = err && (err.name || err.message) ? `\n(${err.name || err.message})` : "";
      alert("カメラを開始できませんでした。HTTPSで開いているか、ブラウザのカメラ使用許可を確認してください。" + detail);
    }
  }
  // 管理者用WebRTC接続はログイン済みの場合だけ開始する。
  if (user && localStream && !adminMonitorStarted) {
    adminMonitorStarted = true;
    try {
      await setupAdminMonitor();
    } catch (err) {
      adminMonitorStarted = false;
      console.error("管理者モニターの接続に失敗しました:", err);
    }
  }
});

async function startCamera() {
  selfVideo.style.opacity = "0";
  localStream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: { ideal: currentFacing } },
    audio: true
  });
  selfVideo.srcObject = localStream;
  updateSelfMirror();
  await selfVideo.play();
  await waitForVideoReady(selfVideo);
  selfCanvas.width = selfVideo.videoWidth || 300;
  selfCanvas.height = selfVideo.videoHeight || 150;
  positionSelfControls();
  selfVideo.style.opacity = "1";
}

function waitForVideoReady(video) {
  if (video.readyState >= 2 && video.videoWidth > 0) return Promise.resolve();
  return new Promise((resolve, reject) => {
    let timeout = setTimeout(() => {
      cleanup();
      if (video.videoWidth > 0) resolve();
      else reject(new Error("映像の準備がタイムアウトしました"));
    }, 8000);
    const onReady = () => {
      if (video.videoWidth > 0) {
        cleanup();
        resolve();
      }
    };
    const cleanup = () => {
      clearTimeout(timeout);
      video.removeEventListener("loadedmetadata", onReady);
      video.removeEventListener("loadeddata", onReady);
      video.removeEventListener("canplay", onReady);
    };
    video.addEventListener("loadedmetadata", onReady);
    video.addEventListener("loadeddata", onReady);
    video.addEventListener("canplay", onReady);
  });
}

/* 管理者画面用 WebRTC */
async function setupAdminMonitor() {
  adminPc = new RTCPeerConnection({
    iceServers: [{ urls: "stun:stun.l.google.com:19302" }]
  });
  localStream.getTracks().forEach(t => adminPc.addTrack(t, localStream));
  adminCallDoc = db.collection("adminCalls").doc(auth.currentUser.uid);
  adminOfferCandidates = adminCallDoc.collection("offerCandidates");
  adminAnswerCandidates = adminCallDoc.collection("answerCandidates");
  adminPc.onicecandidate = e => {
    if (e.candidate) adminOfferCandidates.add(e.candidate.toJSON());
  };
  const offer = await adminPc.createOffer();
  await adminPc.setLocalDescription(offer);
  await adminCallDoc.set({ uid: auth.currentUser.uid, offer, createdAt: Date.now(), ended: false }, { merge:true });
  adminAnswerCandidates.onSnapshot(s => {
    s.docChanges().forEach(c => {
      if (c.type === "added") {
        adminPc.addIceCandidate(new RTCIceCandidate(c.doc.data())).catch(console.error);
      }
    });
  });
  adminCallDoc.onSnapshot(async s => {
    const d = s.data();
    if (d && d.answer && !adminPc.currentRemoteDescription) {
      await adminPc.setRemoteDescription(new RTCSessionDescription(d.answer));
    }
  });
}

/* モザイク描画 */
function drawMosaic() {
  requestAnimationFrame(drawMosaic);
  const w = mainCanvas.width = window.innerWidth;
  const h = mainCanvas.height = window.innerHeight;
  mainCtx.imageSmoothingEnabled = false;
  if (partnerImg.complete && partnerImg.naturalWidth) mainCtx.drawImage(partnerImg, 0, 0, w, h);
  else { mainCtx.fillStyle = "#111"; mainCtx.fillRect(0, 0, w, h); }
  mainCtx.textAlign = "center";
  mainCtx.fillStyle = "rgba(255,255,255,0.95)";
  mainCtx.strokeStyle = "rgba(0,0,0,0.8)";
  mainCtx.font = "bold 64px sans-serif";
  mainCtx.lineWidth = 6;
  mainCtx.strokeText("DEMO", w / 2, h / 2 - 40);
  mainCtx.fillText("DEMO", w / 2, h / 2 - 40);
  mainCtx.font = "bold 28px sans-serif";
  mainCtx.lineWidth = 4;
  mainCtx.strokeText("サンプル画像です", w / 2, h / 2 + 20);
  mainCtx.fillText("サンプル画像です", w / 2, h / 2 + 20);
  mainCtx.font = "10px sans-serif";
  mainCtx.lineWidth = 3;
  ["相手とは接続されていないので、", "操作感をお試しください。"].forEach((line, i) => {
    const y = h / 2 + 65 + i * 35;
    mainCtx.strokeText(line, w / 2, y);
    mainCtx.fillText(line, w / 2, y);
  });
  const sw = selfVideo.videoWidth;
  const sh = selfVideo.videoHeight;
  if (sw && sh && selfVideo.readyState >= 2) {
    if (selfCanvas.width !== sw) selfCanvas.width = sw;
    if (selfCanvas.height !== sh) selfCanvas.height = sh;
    const s = myMosaicSize;
    selfCtx.imageSmoothingEnabled = false;
    selfCtx.clearRect(0, 0, sw, sh);
    selfCtx.drawImage(selfVideo, 0, 0, sw / s, sh / s);
    selfCtx.drawImage(selfCanvas, 0, 0, sw / s, sh / s, 0, 0, sw, sh);
  }
}

/* モザイクメーター */
const meterBar = document.getElementById("meterBar");
for (let i = 0; i < 5; i++) {
  const block = document.createElement("div");
  block.className = "meter-block";
  meterBar.appendChild(block);
}
updateMeterUI();
function updateMeterUI() {
  [...meterBar.children].forEach((b, i) => b.classList.toggle("active", i < myMosaicLevel));
}
document.getElementById("meterUp").onclick = () => {
  if (myMosaicLevel < mosaicSizes.length - 1) { myMosaicLevel++; myMosaicSize = mosaicSizes[myMosaicLevel]; updateMeterUI(); }
};
document.getElementById("meterDown").onclick = () => {
  if (myMosaicLevel > 0) { myMosaicLevel--; myMosaicSize = mosaicSizes[myMosaicLevel]; updateMeterUI(); }
};

/* チュートリアルのメッセージ：Firestoreは使わず、自分の入力を一時表示 */
document.getElementById("messageForm").addEventListener("submit", e => {
  e.preventDefault();
  const input = document.getElementById("messageInput");
  const text = input.value.trim();
  if (!text) return;
  showFloatingMessage(text);
  input.value = "";
});
function showFloatingMessage(text) {
  const el = document.getElementById("floatingMessage");
  el.textContent = text;
  el.classList.remove("show");
  void el.offsetWidth;
  el.classList.add("show");
  clearTimeout(messageTimer);
  messageTimer = setTimeout(() => el.classList.remove("show"), 4000);
}

/* カメラ切替：古い端末向けに deviceId に依存せず facingMode も利用 */
switchCameraButton.onclick = switchCamera;
async function switchCamera() {
  if (isSwitchingCamera || !localStream) return;
  isSwitchingCamera = true;
  document.body.classList.add("camera-switching");
  switchCameraButton.disabled = true;
  const oldStream = localStream;
  const oldFacing = currentFacing;
  const targetFacing = currentFacing === "user" ? "environment" : "user";
  const oldVideoTrack = oldStream.getVideoTracks()[0];
  let newStream = null;
  let stoppedOldTrack = false;
  selfVideo.style.opacity = "0";
  try {
    // 先に試す。対応端末なら既存カメラを止めずに取得できる。
    try {
      newStream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: targetFacing } }, audio: false
      });
    } catch (firstError) {
      // 古い端末など、カメラを同時に開けない場合は旧ビデオトラックを停止して再試行。
      oldVideoTrack?.stop();
      stoppedOldTrack = true;
      newStream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: targetFacing }, audio: false
      });
    }
    const newVideoTrack = newStream.getVideoTracks()[0];
    if (!newVideoTrack) throw new Error("切り替え先のカメラ映像を取得できませんでした");
    const sender = adminPc?.getSenders().find(s => s.track && s.track.kind === "video");
    if (sender) await sender.replaceTrack(newVideoTrack);
    const audioTracks = oldStream.getAudioTracks();
    localStream = new MediaStream([...audioTracks, newVideoTrack]);
    selfVideo.srcObject = localStream;
    currentFacing = targetFacing;
    updateSelfMirror();
    await selfVideo.play();
    await waitForVideoReady(selfVideo);
    selfCanvas.width = selfVideo.videoWidth || selfCanvas.width;
    selfCanvas.height = selfVideo.videoHeight || selfCanvas.height;
    oldStream.getVideoTracks().forEach(t => { if (t !== newVideoTrack) t.stop(); });
    // getUserMedia(audio:false) のため、newStream内のビデオだけがlocalStreamに使われる。
    newStream.getTracks().forEach(t => { if (t !== newVideoTrack) t.stop(); });
    positionSelfControls();
  } catch (err) {
    console.error("カメラ切替に失敗しました:", err);
    if (newStream) newStream.getTracks().forEach(t => t.stop());
    currentFacing = oldFacing;
    updateSelfMirror();
    // 旧カメラを止めてしまった場合は、元の向きで再取得して復旧を試す。
    if (stoppedOldTrack) {
      try {
        const restoredVideoStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: oldFacing } }, audio: false
        });
        const restoredTrack = restoredVideoStream.getVideoTracks()[0];
        const sender = adminPc?.getSenders().find(s => s.track && s.track.kind === "video");
        if (sender && restoredTrack) await sender.replaceTrack(restoredTrack);
        const audioTracks = oldStream.getAudioTracks();
        localStream = new MediaStream([...audioTracks, restoredTrack]);
        selfVideo.srcObject = localStream;
        await selfVideo.play();
        await waitForVideoReady(selfVideo);
        selfCanvas.width = selfVideo.videoWidth || selfCanvas.width;
        selfCanvas.height = selfVideo.videoHeight || selfCanvas.height;
        positionSelfControls();
      } catch (restoreError) {
        console.error("元のカメラを復旧できませんでした:", restoreError);
      }
    } else {
      selfVideo.srcObject = oldStream;
      try { await selfVideo.play(); } catch (_) {}
    }
  } finally {
    selfVideo.style.opacity = "1";
    document.body.classList.remove("camera-switching");
    switchCameraButton.disabled = false;
    isSwitchingCamera = false;
    requestAnimationFrame(positionSelfControls);
  }
}

async function deleteCollection(collectionRef) {
  if (!collectionRef) return;
  const snapshot = await collectionRef.get();
  await Promise.all(snapshot.docs.map(doc => doc.ref.delete()));
}

/* 終了ボタン */
document.getElementById("endBtn").onclick = async () => {
  document.getElementById("endBtn").disabled = true;
  try {
    if (adminPc) {
      if (adminCallDoc) {
        await adminCallDoc.set({ ended:true }, { merge:true });
        await deleteCollection(adminOfferCandidates);
        await deleteCollection(adminAnswerCandidates);
        await adminCallDoc.delete();
      }
      adminPc.close();
    }
  } catch (err) {
    console.error("デモ終了処理でエラー:", err);
  }
  localStream?.getTracks().forEach(track => track.stop());
  location.href = "index.html";
};
</script>
</body>
</html>、
