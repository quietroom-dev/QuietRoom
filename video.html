<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Quiet Room</title>
<!-- ▼▼ WebRTC に必要な Firebase 読み込み（追加） ▼▼ -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<style>
v2.1.1
/* =========================
   全体
========================= */
html,
body {
  margin: 0;
  padding: 0;
  overflow: hidden;
  background: #000;
  font-family: sans-serif;
}
/* =========================
   相手映像（全画面）
========================= */
#mainVideo {
  position: fixed;
  inset: 0;
  width: 100vw;
  height: 100vh;
  object-fit: contain;
  background: #000;
  z-index: 1;
}
/* モザイク表示 */
#selfCanvas {
  position: fixed;
  top: 16px;
  right: 16px;
  width: 24vw;
  height: 24vh;
  min-width: 180px;
  min-height: 130px;
  z-index: 11;
  pointer-events: none;
}

#mainCanvas {
  position: fixed;
  inset: 0;
  width: 100vw;
  height: 100vh;
  z-index: 2;
  pointer-events: none;
}
/* =========================
   自分映像（右上）
========================= */
#selfVideo {
  position: fixed;
  top: 16px;
  right: 16px;
  width: 24vw;
  height: 24vh;
  min-width: 180px;
  min-height: 130px;
  object-fit: contain;
  background: #000;
  border-radius: 12px;
  z-index: 10;
  box-shadow: 0 0 12px rgba(0,0,0,0.5);
}
<canvas id="selfCanvas"></canvas>
/* =========================
   右上ボタン群
========================= */
.top-ui {
  position: fixed;
  top: 16px;
  left: 16px;
  display: flex;
  gap: 10px;
  z-index: 30;
}
/* シンプル丸ボタン */
.icon-btn {
  width: 52px;
  height: 52px;
  border: none;
  border-radius: 50%;
  background: rgba(0,0,0,0.55);
  color: #fff;
  font-size: 22px;
  backdrop-filter: blur(6px);
  cursor: pointer;
}
/* =========================
   モザイクメーター
========================= */
.mosaic-meter {
  position: fixed;
  right: 12px;
  top: 50%;
  transform: translateY(-50%);
  display: flex;
  flex-direction: column;
  align-items: center;
  z-index: 40;
  color: #fff;
}
.meter-bar {
  width: 42px;
  height: 34vh;
  display: flex;
  flex-direction: column-reverse;
  gap: 4px;
}
.meter-block {
  flex: 1;
  width: 100%;
  border-radius: 8px;
  border: 2px solid rgba(255,255,255,0.7);
  background: rgba(255,255,255,0.2);
  transition: 0.15s;
}
.meter-block.active {
  background: rgba(255,255,255,1);
}
.meter-top,
.meter-bottom {
  margin: 8px 0;
  padding: 6px 10px;
  border-radius: 8px;
  background: rgba(0,0,0,0.55);
  cursor: pointer;
  user-select: none;
}
</style>
</head>
<body>
<!-- 相手映像 -->
<video
  id="mainVideo"
  autoplay
  playsinline
></video>
<!-- モザイク -->
<canvas id="mainCanvas"></canvas>
<!-- 自分映像 -->
<video
  id="selfVideo"
  autoplay
  muted
  playsinline
></video>
<!-- 左上UI -->
<div class="top-ui">
  <!-- カメラ切替 -->
  <button
    class="icon-btn"
    id="switchCamera"
    title="カメラ切替"
  >
    🔄
  </button>
  <!-- 終了 -->
  <button
    class="icon-btn"
    id="endBtn"
    title="終了"
  >
    ✕
  </button>
</div>
<!-- メーター -->
<div class="mosaic-meter">
  <div
    class="meter-top"
    id="meterUp"
  >
    ▲モザイク
  </div>
  <div
    class="meter-bar"
    id="meterBar"
  ></div>
  <div
    class="meter-bottom"
    id="meterDown"
  >
    ▼クリア
  </div>
</div>
<script type="module">
/* =========================================
   ▼▼ Firebase 初期化（追加） ▼▼
========================================= */
const firebaseConfig = {
  apiKey: "AIzaSyDXSKJaknyhXGtrFQCzYhmA6r7VQR0K_GM",
  authDomain: "roomvideo.firebaseapp.com",
  projectId: "roomvideo",
  storageBucket: "roomvideo.firebasestorage.app",
  messagingSenderId: "1030429439546",
  appId: "1:1030429439546:web:1481670cb78deb35e2a703"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
/* =========================================
   ▼▼ URL から相手 UID を取得（追加） ▼▼
========================================= */
const params = new URLSearchParams(window.location.search);
const targetUid = params.get("target");
/* =========================================
   ▼▼ WebRTC PeerConnection（追加） ▼▼
========================================= */
let pc = new RTCPeerConnection({
  iceServers: [
    { urls: "stun:stun.l.google.com:19302" }
  ]
});
   /* =========================================
   相手のモザイク強度を受信（STEP6）
========================================= */

db.collection("calls").doc(targetUid).onSnapshot(doc => {
  const data = doc.data();
  if (data?.mosaic) {
    remoteMosaicLevel = data.mosaic;
  }
});
/* =========================================
   状態
========================================= */
let localStream = null;
let currentCamera = "user";
let myMosaicLevel = 5;        // 自分のモザイク
let remoteMosaicLevel = 5;    // 相手のモザイク
/* モザイク粒度 */
const mosaicSizes = [
  0,
  1,
  4,
  8,
  12,
  16,
  20,
  28,
  36,
  48
];
/* =========================================
   要素
========================================= */
const selfVideo =
  document.getElementById("selfVideo");
const mainVideo =
  document.getElementById("mainVideo");
const mainCanvas =
  document.getElementById("mainCanvas");
const mainCtx =
  mainCanvas.getContext("2d");
const meterBar =
  document.getElementById("meterBar");
/* =========================================
   Offscreen
========================================= */
const offCanvas =
  document.createElement("canvas");
const offCtx =
  offCanvas.getContext("2d");
/* =========================================
   カメラ開始
========================================= */
async function startCamera() {
  try {
    localStream =
      await navigator.mediaDevices.getUserMedia({
        video: {
          facingMode: currentCamera
        },
        audio: false
      });
    /*  自分映像  */
    selfVideo.srcObject = localStream;
    /* ▼▼ WebRTC に自分の映像を追加（追加） ▼▼ */
    localStream.getTracks().forEach(track => {
      pc.addTrack(track, localStream);
    });
    setTimeout(
      resizeCanvas,
      200
    );
  } catch (err) {
    console.error(err);
  }
}
/* =========================================
   ▼▼ 相手映像を受信（追加） ▼▼
========================================= */
pc.ontrack = (event) => {
  mainVideo.srcObject = event.streams[0];
};
/* =========================================
   ▼▼ ICE candidate を Firestore に保存（追加） ▼▼
========================================= */
const callDoc = db.collection("calls").doc(targetUid);
const offerCandidates = callDoc.collection("offerCandidates");
const answerCandidates = callDoc.collection("answerCandidates");
pc.onicecandidate = (event) => {
  if (event.candidate) {
    offerCandidates.add(event.candidate.toJSON());
  }
};
/* =========================================
   ▼▼ Offer を作成して Firestore に送信（追加） ▼▼
========================================= */
async function startCall() {
  const offer = await pc.createOffer();
  await pc.setLocalDescription(offer);
  await callDoc.set({ offer });
  callDoc.onSnapshot(async (snapshot) => {
    const data = snapshot.data();
    if (!pc.currentRemoteDescription && data?.answer) {
      await pc.setRemoteDescription(new RTCSessionDescription(data.answer));
    }
  });
  answerCandidates.onSnapshot(snapshot => {
    snapshot.docChanges().forEach(change => {
      if (change.type === "added") {
        const candidate = new RTCIceCandidate(change.doc.data());
        pc.addIceCandidate(candidate);
      }
    });
  });
}
   /* =========================================
   ▼▼ 相手からの着信を受信（重要） ▼▼
========================================= */
const myUid = localStorage.getItem("myUid");

db.collection("calls").doc(myUid).onSnapshot(async (snap) => {
  const data = snap.data();
  if (!data) return;

  if (data.offer && !pc.currentRemoteDescription) {
    await pc.setRemoteDescription(new RTCSessionDescription(data.offer));

    const answer = await pc.createAnswer();
    await pc.setLocalDescription(answer);

    await db.collection("calls").doc(myUid).update({ answer });
  }
});
/* =========================================
   カメラ停止
========================================= */
function stopCamera() {
  if (!localStream) return;
  localStream
    .getTracks()
    .forEach(track => {
      track.stop();
    });
  localStream = null;
}
/* =========================================
   カメラ切替
========================================= */
document
  .getElementById("switchCamera")
  .addEventListener("click", async () => {
    stopCamera();
    currentCamera =
      currentCamera === "user"
        ? "environment"
        : "user";
    await startCamera();
  });
/* =========================================
   終了
========================================= */
document
  .getElementById("endBtn")
  .addEventListener("click", () => {
    stopCamera();
    mainCtx.clearRect(
      0,
      0,
      mainCanvas.width,
      mainCanvas.height
    );
    selfVideo.srcObject = null;
    mainVideo.srcObject = null;
  });
/* =========================================
   Canvasサイズ
========================================= */
function resizeCanvas() {
  const dpr =
    window.devicePixelRatio || 1;
  mainCanvas.width =
    window.innerWidth * dpr;
  mainCanvas.height =
    window.innerHeight * dpr;
  mainCanvas.style.width =
    window.innerWidth + "px";
  mainCanvas.style.height =
    window.innerHeight + "px";
  mainCtx.setTransform(
    dpr,
    0,
    0,
    dpr,
    0,
    0
  );
}
window.addEventListener(
  "resize",
  resizeCanvas
);
/* =========================================
   相手映像モザイク
========================================= */
function drawRemoteMosaic() {
  if (
    mainVideo.readyState < 2
  ) {
    return;
  }
  const w =
    mainCanvas.clientWidth;
  const h =
    mainCanvas.clientHeight;
  const size =
    mosaicSizes[
      Math.max(
        0,
        Math.min(
          9,
          remoteMosaicLevel - 1
        )
      )
    ];
  /*
    小さく描画
  */
  offCanvas.width = size;
  offCanvas.height =
    Math.max(
      1,
      Math.round(size * (h / w))
    );
  offCtx.imageSmoothingEnabled = false;
  offCtx.clearRect(
    0,
    0,
    offCanvas.width,
    offCanvas.height
  );
  offCtx.drawImage(
    mainVideo,
    0,
    0,
    offCanvas.width,
    offCanvas.height
  );
  /*
    拡大描画
  */
  mainCtx.imageSmoothingEnabled = false;
  mainCtx.clearRect(
    0,
    0,
    mainCanvas.width,
    mainCanvas.height
  );
  mainCtx.drawImage(
    offCanvas,
    0,
    0,
    offCanvas.width,
    offCanvas.height,
    0,
    0,
    mainCanvas.width,
    mainCanvas.height
  );
}
/* 描画ループ */
setInterval(drawRemoteMosaic, 120);
setInterval(drawSelfMosaic, 120);
/* =========================================
   自分映像モザイク（追加）
========================================= */
const selfCanvas = document.getElementById("selfCanvas");
const selfCtx = selfCanvas.getContext("2d");
function drawSelfMosaic() {
  if (!selfVideo.srcObject) return;
  const w = selfCanvas.clientWidth;
  const h = selfCanvas.clientHeight;
  const size = mosaicSizes[myMosaicLevel - 1];
  offCanvas.width = size;
  offCanvas.height = Math.max(1, Math.round(size * (h / w)));
  offCtx.imageSmoothingEnabled = false;
  offCtx.clearRect(0, 0, offCanvas.width, offCanvas.height);
  offCtx.drawImage(selfVideo, 0, 0, offCanvas.width, offCanvas.height);
  selfCanvas.width = w;
  selfCanvas.height = h;
  selfCtx.imageSmoothingEnabled = false;
  selfCtx.clearRect(0, 0, w, h);
  selfCtx.drawImage(offCanvas, 0, 0, offCanvas.width, offCanvas.height, 0, 0, w, h);
}

/* =========================================
   メーター初期化
========================================= */
function initMeter() {
  meterBar.innerHTML = "";
  for (let i = 0; i < 10; i++) {
    const block =
      document.createElement("div");
    block.className =
      "meter-block";
    meterBar.appendChild(block);
  }
  updateMeter();
}
/* =========================================
   メーター更新
========================================= */
function updateMeter() {
  const blocks =
    document.querySelectorAll(
      ".meter-block"
    );
  blocks.forEach((block, index) => {
    block.classList.toggle(
      "active",
       index < myMosaicLevel
    );
  });
}
/* =========================================
   モザイク変更
========================================= */
function changeMosaic(delta) {
  myMosaicLevel += delta;
  if (myMosaicLevel < 1) myMosaicLevel = 1;
  if (myMosaicLevel > 10) myMosaicLevel = 10;
  updateMeter();
   db.collection("calls").doc(myUid).update({
  mosaic: myMosaicLevel
});
   db.collection("calls").doc(myUid).update({
  mosaic: myMosaicLevel
});
}
/* =========================================
   メーター操作
========================================= */
document
  .getElementById("meterUp")
  .addEventListener("click", () => {
    changeMosaic(-1);
  });
document
  .getElementById("meterDown")
  .addEventListener("click", () => {
    changeMosaic(1);
  });
/* =========================================
   初期化
========================================= */
initMeter();
resizeCanvas();
startCamera();
startCall();
</script>
</body>
</html>
