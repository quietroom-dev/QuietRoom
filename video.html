<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Quiet Room</title>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

<style>
html, body { margin:0; padding:0; overflow:hidden; background:#000; font-family:sans-serif; }

#mainVideo { position:fixed; inset:0; width:100vw; height:100vh; object-fit:contain; background:#000; z-index:1; }
#mainCanvas { position:fixed; inset:0; width:100vw; height:100vh; z-index:2; pointer-events:none; }

#selfVideo { position:fixed; top:16px; right:16px; height:24vh; width:auto;
  min-width:120px; min-height:120px; object-fit:contain; background:#000;
  border-radius:12px; z-index:10; box-shadow:0 0 12px rgba(0,0,0,0.5); }

#selfCanvas { position:fixed; top:16px; right:16px; height:24vh; width:auto;
  min-width:120px; min-height:120px; z-index:11; pointer-events:none; border-radius:12px; }

.top-ui { position:fixed; top:16px; left:16px; display:flex; gap:10px; z-index:30; }
.icon-btn { width:52px; height:52px; border:none; border-radius:50%; background:rgba(0,0,0,0.55); color:#fff;
  font-size:22px; backdrop-filter:blur(6px); cursor:pointer; }

.mosaic-meter { position:fixed; right:12px; top:50%; transform:translateY(-50%); display:flex; flex-direction:column;
  align-items:center; z-index:40; color:#fff; }
.meter-bar { width:42px; height:28vh; display:flex; flex-direction:column-reverse; gap:4px; }
.meter-block { flex:1; width:100%; border-radius:8px; border:2px solid rgba(255,255,255,0.7);
  background:rgba(255,255,255,0.2); transition:0.15s; }
.meter-block.active { background:rgba(255,255,255,1); }
.meter-top, .meter-bottom { margin:8px 0; padding:6px 10px; border-radius:8px; background:rgba(0,0,0,0.55);
  cursor:pointer; user-select:none; }

#patrolMsg {
  position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
  background:rgba(0,0,0,0.6); color:#fff; padding:10px 16px;
  border-radius:8px; font-size:14px; display:none; z-index:50;
}

/* 終了ポップアップ */
#endPopupBg {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.65);
  display: none;
  justify-content: center;
  align-items: center;
  z-index: 9999;
}
#endPopupBox {
  background: #222;
  padding: 20px 26px;
  border-radius: 12px;
  text-align: center;
  color: #fff;
  width: 260px;
  box-shadow: 0 0 12px rgba(0,0,0,0.5);
}
#endPopupBox p {
  margin-bottom: 18px;
  font-size: 16px;
}
.main-btn {
  width: 100%;
  padding: 12px 0;
  background: #4a8cff;
  border: none;
  border-radius: 8px;
  color: #fff;
  font-size: 16px;
  margin-bottom: 14px;
  cursor: pointer;
}
.sub-btns {
  display: flex;
  justify-content: space-between;
}
.sub-btn {
  width: 48%;
  padding: 8px 0;
  background: #444;
  border: none;
  border-radius: 6px;
  color: #fff;
  font-size: 14px;
  cursor: pointer;
}
</style>
</head>

<body>

<video id="mainVideo" autoplay playsinline></video>
<canvas id="mainCanvas"></canvas>

<video id="selfVideo" autoplay muted playsinline></video>
<canvas id="selfCanvas"></canvas>

<div class="top-ui">
  <button class="icon-btn" id="switchCamera">📷🔄</button>
  <button class="icon-btn" id="endBtn">✕</button>
</div>

<div class="mosaic-meter">
  <div class="meter-top" id="meterUp">▲モザイク</div>
  <div class="meter-bar" id="meterBar"></div>
  <div class="meter-bottom" id="meterDown">▼クリア</div>
</div>

<div id="patrolMsg">v3.0管理人がパトロールすることがあります。安全に使ってね。</div>

<script>
/* 役割フラグ */
const isCaller = localStorage.getItem("isCaller") === "1";

/* Firebase */
firebase.initializeApp({
  apiKey: "AIzaSyDXSKJaknyhXGtrFQCzYhmA6r7VQR0K_GM",
  authDomain: "roomvideo.firebaseapp.com",
  projectId: "roomvideo",
  storageBucket: "roomvideo.firebasestorage.app",
  messagingSenderId: "1030429439546",
  appId: "1:1030429439546:web:1481670cb78deb35e2a703"
});
const db = firebase.firestore();

/* UID / パラメータ */
const myUid = localStorage.getItem("myUid");
const targetUid = new URLSearchParams(location.search).get("target");

/* callerUid（★ここだけ修正） */
let callerUid = isCaller ? targetUid : myUid;

/* --- トップレベルで参照を一貫させる変数 --- */
let callDoc = null;
let offerCandidates = null;
let answerCandidates = null;
let unsubCallDoc = null;
let unsubOfferCandidates = null;
let unsubAnswerCandidates = null;
let unsubRemoteMosaic = null;

/* モザイク同期 */
let myMosaicLevel = 5;
let myMosaicSize = 25;
let remoteMosaicSize = 25;
const mosaicSizes = [1, 10, 13, 16, 19, 25];

const mosaicDoc = db.collection("mosaic").doc(myUid);

function saveMyMosaic() {
  try {
    mosaicDoc.set({ size: myMosaicSize });
  } catch (e) {}
}

/* WebRTC */
let pc = new RTCPeerConnection({
  iceServers: [{ urls: "stun:stun.l.google.com:19302" }]
});
let localStream = null;

/* カメラ開始（安全化） */
let currentFacing = "user";

async function startCamera() {
  // 既存ストリームがあれば停止してクリア
  if (localStream) {
    try { localStream.getTracks().forEach(t => t.stop()); } catch(e) {}
    localStream = null;
  }

  localStream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: currentFacing },
    audio: false
  });

  selfVideo.srcObject = localStream;

  // video トラックを既存 sender に置き換えるか addTrack
  const videoTrack = localStream.getVideoTracks()[0];
  const sender = pc.getSenders().find(s => s.track && s.track.kind === "video");
  if (sender) {
    try { await sender.replaceTrack(videoTrack); } catch (e) { pc.addTrack(videoTrack, localStream); }
  } else {
    pc.addTrack(videoTrack, localStream);
  }

  // 自分のモザイク設定を確実に保存（初期化）
  saveMyMosaic();
}

/* カメラ切替＋再ネゴシエーション */
async function renegotiate() {
  if (!callDoc) return;
  try {
    const offer = await pc.createOffer({ iceRestart: false });
    await pc.setLocalDescription(offer);
    await callDoc.update({ offer });
  } catch (e) {}
}

async function switchCameraFunc() {
  currentFacing = currentFacing === "user" ? "environment" : "user";

  if (localStream) localStream.getTracks().forEach(t => t.stop());

  // 小窓を一瞬隠す
  selfVideo.style.visibility = "hidden";
  selfCanvas.style.visibility = "hidden";

  localStream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: currentFacing },
    audio: false
  });

  selfVideo.srcObject = localStream;

  selfVideo.onloadedmetadata = () => {
    drawMosaicSelf();
    selfVideo.style.visibility = "visible";
    selfCanvas.style.visibility = "visible";
  };

  const sender = pc.getSenders().find(s => s.track && s.track.kind === "video");
  if (sender) {
    try { await sender.replaceTrack(localStream.getVideoTracks()[0]); } catch (e) { /* ignore */ }
  } else {
    pc.addTrack(localStream.getVideoTracks()[0], localStream);
  }

  await renegotiate();
}

document.getElementById("switchCamera").onclick = switchCameraFunc;

/* 相手映像 */
const mainVideo = document.getElementById("mainVideo");
const mainCanvas = document.getElementById("mainCanvas");
const mainCtx = mainCanvas.getContext("2d");

const selfVideo = document.getElementById("selfVideo");
const selfCanvas = document.getElementById("selfCanvas");
const selfCtx = selfCanvas.getContext("2d");

pc.ontrack = e => {
  mainVideo.srcObject = e.streams[0];
};

/* モザイク描画 */
function drawMosaic() {
  const w = mainVideo.videoWidth;
  const h = mainVideo.videoHeight;

  if (w && h) {
    mainCanvas.width = w;
    mainCanvas.height = h;
    mainCtx.imageSmoothingEnabled = false;
    mainCtx.drawImage(mainVideo, 0, 0, w / remoteMosaicSize, h / remoteMosaicSize);
    mainCtx.drawImage(mainCanvas, 0, 0, w / remoteMosaicSize, h / remoteMosaicSize, 0, 0, w, h);
  }

  const vw = selfVideo.videoWidth;
  const vh = selfVideo.videoHeight;

  if (vw && vh) {
    selfCanvas.width = vw;
    selfCanvas.height = vh;

    myMosaicSize = mosaicSizes[myMosaicLevel];

    selfCtx.imageSmoothingEnabled = false;
    selfCtx.drawImage(selfVideo, 0, 0, vw / myMosaicSize, vh / myMosaicSize);
    selfCtx.drawImage(selfCanvas, 0, 0, vw / myMosaicSize, vh / myMosaicSize, 0, 0, vw, vh);
  }

  requestAnimationFrame(drawMosaic);
}
function drawMosaicSelf() {}
requestAnimationFrame(drawMosaic);

/* 発信側 */
async function runCaller(callDocParam, offerCandidatesParam, answerCandidatesParam) {
  // callDocParam をトップレベルの callDoc に反映
  callDoc = callDocParam;
  offerCandidates = offerCandidatesParam;
  answerCandidates = answerCandidatesParam;

  await db.collection("calls").doc(myUid).set({ createdAt: Date.now() }, { merge: true });
  await startCamera();

  pc.onicecandidate = e => {
    if (e.candidate) {
      try { offerCandidates.add(e.candidate.toJSON()); } catch (err) {}
    }
  };

  try {
    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);
    await callDoc.set({ offer, from: myUid });
  } catch (e) {}

  // 発信側の declined と answer を一元監視（戻り値を保存）
  if (unsubCallDoc) { unsubCallDoc(); unsubCallDoc = null; }
  unsubCallDoc = callDoc.onSnapshot(async snap => {
    const d = snap.data();
    if (!d) return;
    if (d?.declined) {
      alert("相手が出ませんでした。\nめげずに頑張ってね");
      location.href = "profiles.html";
    }
    if (d?.answer && !pc.remoteDescription) {
      try { await pc.setRemoteDescription(new RTCSessionDescription(d.answer)); } catch (e) {}
    }
  });

  // answerCandidates の監視（保存）
  if (unsubAnswerCandidates) { unsubAnswerCandidates(); unsubAnswerCandidates = null; }
  unsubAnswerCandidates = answerCandidates.onSnapshot(snap => {
    snap.docChanges().forEach(c => {
      if (c.type === "added") {
        try { pc.addIceCandidate(new RTCIceCandidate(c.doc.data())); } catch (e) {}
      }
    });
  });
}

/* 受信側（修正版） */
async function runCallee(callDocParam, offerCandidatesParam, answerCandidatesParam) {
  // callDocParam をトップレベルの callDoc に反映
  callDoc = callDocParam;
  offerCandidates = offerCandidatesParam;
  answerCandidates = answerCandidatesParam;

  await startCamera();

  pc.onicecandidate = e => {
    if (e.candidate) {
      try { answerCandidates.add(e.candidate.toJSON()); } catch (err) {}
    }
  };

  const callSnap = await callDoc.get();
  const callData = callSnap.exists ? callSnap.data() : null;
  if (callData && callData.offer) {
    try { await pc.setRemoteDescription(new RTCSessionDescription(callData.offer)); } catch (e) {}
  }

  try {
    const answer = await pc.createAnswer();
    await pc.setLocalDescription(answer);
    await callDoc.update({ answer });
  } catch (e) {}

  // offerCandidates の監視（保存）
  if (unsubOfferCandidates) { unsubOfferCandidates(); unsubOfferCandidates = null; }
  unsubOfferCandidates = offerCandidates.onSnapshot(snap => {
    snap.docChanges().forEach(c => {
      if (c.type === "added") {
        try { pc.addIceCandidate(new RTCIceCandidate(c.doc.data())); } catch (e) {}
      }
    });
  });

  // カメラ切替後の新しい offer を処理（保存）
  if (unsubCallDoc) { unsubCallDoc(); unsubCallDoc = null; }
  unsubCallDoc = callDoc.onSnapshot(async snap => {
    const data = snap.data();
    if (!data) return;

    if (data.offer && pc.signalingState === "stable") {
      try {
        await pc.setRemoteDescription(new RTCSessionDescription(data.offer));
        const newAnswer = await pc.createAnswer();
        await pc.setLocalDescription(newAnswer);
        await callDoc.update({ answer: newAnswer });
      } catch (e) {}
    }
  });
}

/* クリーンアップ関数 */
async function cleanupAndExit() {
  try {
    if (unsubCallDoc) { unsubCallDoc(); unsubCallDoc = null; }
    if (unsubOfferCandidates) { unsubOfferCandidates(); unsubOfferCandidates = null; }
    if (unsubAnswerCandidates) { unsubAnswerCandidates(); unsubAnswerCandidates = null; }
    if (unsubRemoteMosaic) { unsubRemoteMosaic(); unsubRemoteMosaic = null; }
    if (callDoc) {
      try { await db.collection("calls").doc(callerUid).delete(); } catch(e) {}
      callDoc = null;
    }
  } catch(e) {}
  try { localStorage.removeItem("isCaller"); } catch(e) {}
  try { localStorage.removeItem("targetUid"); } catch(e) {}
}

/* ページ読み込み後 */
window.addEventListener("load", async () => {

  /* デバッグログ（必要ならコメントアウト） */
  try {
    console.log("LOAD video.html", { isCaller, myUid, targetUid, callerUid });
    pc.oniceconnectionstatechange = () => console.log("ICE state:", pc.iceConnectionState);
    pc.onsignalingstatechange = () => console.log("Signaling state:", pc.signalingState);
    pc.onconnectionstatechange = () => console.log("Connection state:", pc.connectionState);
    setInterval(() => {
      console.log("remoteDesc:", !!pc.remoteDescription, "localDesc:", !!pc.localDescription,
                  "senders:", pc.getSenders().map(s => s.track && s.track.kind),
                  "tracks:", localStream ? localStream.getTracks().map(t => t.kind) : []);
    }, 3000);
  } catch (e) {}

  /* モザイクUI */
  const meterBar = document.getElementById("meterBar");
  const meterUp = document.getElementById("meterUp");
  const meterDown = document.getElementById("meterDown");

  for (let i = 0; i < 5; i++) {
    const div = document.createElement("div");
    div.className = "meter-block";
    meterBar.appendChild(div);
  }

  function updateMeterUI() {
    [...meterBar.children].forEach((b, i) => {
      b.classList.toggle("active", i < myMosaicLevel);
    });
  }

  meterUp.onclick = () => {
    if (myMosaicLevel < 5) {
      myMosaicLevel++;
      myMosaicSize = mosaicSizes[myMosaicLevel];
      updateMeterUI();
      saveMyMosaic();
    }
  };

  meterDown.onclick = () => {
    if (myMosaicLevel > 0) {
      myMosaicLevel--;
      myMosaicSize = mosaicSizes[myMosaicLevel];
      updateMeterUI();
      saveMyMosaic();
    }
  };

  updateMeterUI();

  /* パトロール通知 */
  function showPatrolMessage() {
    const el = document.getElementById("patrolMsg");
    el.style.display = "block";
    setTimeout(() => { el.style.display = "none"; }, 3000);
  }
  setInterval(showPatrolMessage, 60000);
  setTimeout(showPatrolMessage, 10000);

  let isEndingMyself = false;

  /* 自分が終了ボタンを押した時 */
  document.getElementById("endBtn").onclick = async () => {
    isEndingMyself = true;
    try { await db.collection("calls").doc(callerUid).set({ ended: true }, { merge: true }); } catch(e) {}
    setTimeout(async () => {
      try { await db.collection("calls").doc(callerUid).delete(); } catch(e) {}
    }, 500);

    // クリーンアップ
    await cleanupAndExit();

    document.getElementById("endPopupBg").style.display = "flex";
  };

  /* 一覧に戻る */
  document.getElementById("backBtn").onclick = () => {
    location.href = "profiles.html";
  };

  /* ブロック */
  document.getElementById("blockBtn").onclick = async () => {
    try {
      await db.collection("users")
        .doc(myUid).collection("blocks")
        .doc(targetUid)
        .set({ blockedAt: Date.now() });
    } catch (e) {}
    alert("ブロックしました。");
    location.href = "profiles.html";
  };

  /* 通報（通報 → 自動ブロック） */
  document.getElementById("reportBtn").onclick = async () => {
    try {
      const already = await db.collection("reports")
        .doc(targetUid).collection("from").doc(myUid).get();

      if (!already.exists) {
        await db.collection("reports")
          .doc(targetUid).collection("from").doc(myUid)
          .set({ reportedAt: Date.now() });

        await db.collection("reports").doc(targetUid)
          .set({ count: firebase.firestore.FieldValue.increment(1) }, { merge: true });
      }

      await db.collection("users")
        .doc(myUid).collection("blocks")
        .doc(targetUid)
        .set({ blockedAt: Date.now() });
    } catch (e) {}

    alert("通報しました。このユーザーは自動的にブロックされました。");
    location.href = "profiles.html";
  };

  /* 相手が終了した時（戻り値を保存して二重登録を防ぐ） */
  if (unsubCallDoc) { unsubCallDoc(); unsubCallDoc = null; }
  unsubCallDoc = db.collection("calls").doc(callerUid).onSnapshot(snap => {
    const d = snap.data();
    if (!d) return;
    if (d.ended && !isEndingMyself) {
      document.getElementById("endPopupBg").style.display = "flex";
    }
  });

  /* remote mosaic listener を targetUid があるときだけ登録 */
  if (targetUid) {
    const remoteMosaicDoc = db.collection("mosaic").doc(targetUid);
    if (unsubRemoteMosaic) { unsubRemoteMosaic(); unsubRemoteMosaic = null; }
    unsubRemoteMosaic = remoteMosaicDoc.onSnapshot(snap => {
      const d = snap.data();
      if (d && typeof d.size === "number") {
        remoteMosaicSize = d.size;
      }
    });
  }

  window.addEventListener("beforeunload", async () => {
    try {
      await cleanupAndExit();
    } catch (err) {}
  });

  /* 役割判定 */
  if (isCaller) {
    callDoc = db.collection("calls").doc(targetUid);
    offerCandidates = callDoc.collection("offerCandidates");
    answerCandidates = callDoc.collection("answerCandidates");
    runCaller(callDoc, offerCandidates, answerCandidates);
    try { localStorage.removeItem("isCaller"); } catch(e) {}
  } else {
    callDoc = db.collection("calls").doc(myUid);
    offerCandidates = callDoc.collection("offerCandidates");
    answerCandidates = callDoc.collection("answerCandidates");
    runCallee(callDoc, offerCandidates, answerCandidates);
  }
});
</script>

<!-- 通話終了ポップアップ -->
<div id="endPopupBg">
  <div id="endPopupBox">
    <p>通話が終了しました。</p>
    <button id="backBtn" class="main-btn">一覧に戻る</button>
    <div class="sub-btns">
      <button id="blockBtn" class="sub-btn">⛔ ブロック</button>
      <button id="reportBtn" class="sub-btn">🚨 通報</button>
    </div>
  </div>
</div>

</body>
</html>
