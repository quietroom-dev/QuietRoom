<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Quiet Room</title>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

<style>
/* ====== UI はあなたの元コードそのまま ====== */
html, body { margin:0; padding:0; overflow:hidden; background:#000; font-family:sans-serif; }
#mainVideo { position:fixed; inset:0; width:100vw; height:100vh; object-fit:contain; background:#000; z-index:1; }
#mainCanvas { position:fixed; inset:0; width:100vw; height:100vh; z-index:2; pointer-events:none; }
#selfVideo { position:fixed; top:16px; right:16px; width:24vw; height:24vh; min-width:180px; min-height:130px;
  object-fit:contain; background:#000; border-radius:12px; z-index:10; box-shadow:0 0 12px rgba(0,0,0,0.5); }
.top-ui { position:fixed; top:16px; left:16px; display:flex; gap:10px; z-index:30; }
.icon-btn { width:52px; height:52px; border:none; border-radius:50%; background:rgba(0,0,0,0.55); color:#fff;
  font-size:22px; backdrop-filter:blur(6px); cursor:pointer; }
.mosaic-meter { position:fixed; right:12px; top:50%; transform:translateY(-50%); display:flex; flex-direction:column;
  align-items:center; z-index:40; color:#fff; }
.meter-bar { width:42px; height:34vh; display:flex; flex-direction:column-reverse; gap:4px; }
.meter-block { flex:1; width:100%; border-radius:8px; border:2px solid rgba(255,255,255,0.7);
  background:rgba(255,255,255,0.2); transition:0.15s; }
.meter-block.active { background:rgba(255,255,255,1); }
.meter-top, .meter-bottom { margin:8px 0; padding:6px 10px; border-radius:8px; background:rgba(0,0,0,0.55);
  cursor:pointer; user-select:none; }
</style>
</head>

<body>

<video id="mainVideo" autoplay playsinline></video>
<canvas id="mainCanvas"></canvas>
<video id="selfVideo" autoplay muted playsinline></video>

<div class="top-ui">
  <button class="icon-btn" id="switchCamera">🔄</button>
  <button class="icon-btn" id="endBtn">✕</button>
</div>

<div class="mosaic-meter">
  <div class="meter-top" id="meterUp">▲モザイク</div>
  <div class="meter-bar" id="meterBar"></div>
  <div class="meter-bottom" id="meterDown">▼クリア</div>
</div>

<script>
/* =========================================
   Firebase
========================================= */
firebase.initializeApp({
  apiKey: "AIzaSyDXSKJaknyhXGtrFQCzYhmA6r7VQR0K_GM",
  authDomain: "roomvideo.firebaseapp.com",
  projectId: "roomvideo",
  storageBucket: "roomvideo.firebasestorage.app",
  messagingSenderId: "1030429439546",
  appId: "1:1030429439546:web:1481670cb78deb35e2a703"
});
const db = firebase.firestore();

/* =========================================
   UID / パラメータ
========================================= */
const myUid = localStorage.getItem("myUid");
const targetUid = new URLSearchParams(location.search).get("target");

alert("video.html 読み込み: myUid=" + myUid + " / target=" + targetUid);

/* =========================================
   WebRTC
========================================= */
let pc = new RTCPeerConnection({
  iceServers: [{ urls: "stun:stun.l.google.com:19302" }]
});

let localStream = null;

/* =========================================
   カメラ開始
========================================= */
async function startCamera() {
  localStream = await navigator.mediaDevices.getUserMedia({
    video: true,
    audio: true
  });
  document.getElementById("selfVideo").srcObject = localStream;
  localStream.getTracks().forEach(t => pc.addTrack(t, localStream));
}

/* =========================================
   相手映像
========================================= */
pc.ontrack = e => {
  document.getElementById("mainVideo").srcObject = e.streams[0];
};
/* =========================================
   発信側フロー
========================================= */
async function runCaller(callDoc, offerCandidates, answerCandidates) {
  pc.onicegatheringstatechange = () => {
    console.log("caller ICE state:", pc.iceGatheringState);
  };
  console.log("v1.4caller: start");

  await startCamera();

  // 自分の ICE
  pc.onicecandidate = e => {
    if (e.candidate) {
      console.log("caller ICE 送信:", e.candidate);
      offerCandidates.add(e.candidate.toJSON());
    }
  };

  const offer = await pc.createOffer();
  await pc.setLocalDescription(offer);

  console.log("caller: offer 書き込み");
  await callDoc.set({ offer, from: myUid });

  // answer を待つ
  callDoc.onSnapshot(async snap => {
    const data = snap.data();
    if (data?.answer && !pc.currentRemoteDescription) {

      console.log("caller側 ANSWER内容:", data.answer);

      try {
        await pc.setRemoteDescription(new RTCSessionDescription(data.answer));
        console.log("caller: setRemoteDescription 成功");
      } catch (e) {
        console.log("caller: setRemoteDescription 失敗 →", e.message);
      }
    }
  });

  // 相手の ICE
  answerCandidates.onSnapshot(snap => {
    snap.docChanges().forEach(c => {
      if (c.type === "added") {
        console.log("caller ICE 受信:", c.doc.data());
        pc.addIceCandidate(new RTCIceCandidate(c.doc.data()));
      }
    });
  });
}

/* =========================================
   受信側フロー
========================================= */
async function runCallee(callDoc, offerCandidates, answerCandidates) {
  pc.onicegatheringstatechange = () => {
    console.log("callee ICE state:", pc.iceGatheringState);
  };
  console.log("callee: start");

  await startCamera();

  // 自分の ICE（createAnswer より前）
  pc.onicecandidate = e => {
    if (e.candidate) {
      console.log("callee ICE 送信:", e.candidate);
      answerCandidates.add(e.candidate.toJSON());
    }
  };

  const callData = (await callDoc.get()).data();
  console.log("callee: offer 受信");

  await pc.setRemoteDescription(new RTCSessionDescription(callData.offer));

  const answer = await pc.createAnswer();
  await pc.setLocalDescription(answer);
  console.log("ANSWER内容:", answer);
  console.log("callee: answer 書き込み");
  await callDoc.update({ answer });

  // 相手の ICE
  offerCandidates.onSnapshot(snap => {
    snap.docChanges().forEach(c => {
      if (c.type === "added") {
        console.log("callee ICE 受信:", c.doc.data());
        pc.addIceCandidate(new RTCIceCandidate(c.doc.data()));
      }
    });
  });
}

  /* =========================================
   ページ読み込み後に役割判定して開始
========================================= */
window.addEventListener("load", async () => {

  let callDoc;
  let offerCandidates;
  let answerCandidates;

  const myCallSnap = await db.collection("calls").doc(myUid).get();

  // 受信側（callee）
  if (myCallSnap.exists && myCallSnap.data().offer) {
    callDoc = db.collection("calls").doc(myUid);
    offerCandidates = callDoc.collection("offerCandidates");
    answerCandidates = callDoc.collection("answerCandidates");
    alert("役割: 受信側 (callee)");
    runCallee(callDoc, offerCandidates, answerCandidates);
    return;
  }

  // 発信側（caller）
  callDoc = db.collection("calls").doc(targetUid);
  offerCandidates = callDoc.collection("offerCandidates");
  answerCandidates = callDoc.collection("answerCandidates");
  alert("役割: 発信側 (caller)");
  runCaller(callDoc, offerCandidates, answerCandidates);
});


</script>

</body>
</html>
