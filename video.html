#selfVideo { position:fixed; top:16px; right:16px; height:24vh; width:auto;

.mosaic-meter { position:fixed; right:12px; top:50%; transform:translateY(-50%); display:flex; flex-direction:column;

  background:rgba(255,255,255,0.2); transition:0.15s; }
.meter-block.active { background:rgba(255,255,255,1); }
.meter-top, .meter-bottom { margin:8px 0; padding:6px 10px; border-radius:8px; background:rgba(0,0,0,0.55);
  cursor:pointer; user-select:none; }

#patrolMsg {
  position:fixed; bottom:20px; left:50%; transform:translateX(-50%);

async function initializeCall() {
  if (myUid === callerUid) { // 発信者
    await startAsCaller();
  }
  else { // 着信者
    await startAsCallee();
  }
}
  
//発信者処理
async function startAsCaller() {
  await startCamera();
  pc.onicecandidate = e => {
    if (e.candidate) offerCandidates.add(e.candidate.toJSON());
  };
  const offer = await pc.createOffer(); 
  await pc.setLocalDescription(offer);
  await callDoc.set({
    offer: offer,
    createdAt: Date.now()
  }, { merge:true });
  const unsubscribe = callDoc.onSnapshot(async s => {
   const d = s.data();
   if (!d?.answer) return;
   unsubscribe();
   if (!pc.currentRemoteDescription) {
    await pc.setRemoteDescription(new RTCSessionDescription(d.answer));
   }
  });
  answerCandidates.onSnapshot(s => {
   s.docChanges().forEach(c => {
    if (c.type === "added") {pc.addIceCandidate(new RTCIceCandidate(c.doc.data()));}
   });
  });
 }

 //着信者処理
 async function startAsCallee() {
  await startCamera();
  const unsubscribe = callDoc.onSnapshot(async snap => {
   const data = snap.data();
   if (!data?.offer) return;
   unsubscribe();
   if (pc.currentRemoteDescription) return;
   pc.onicecandidate = e => {
    if (e.candidate) answerCandidates.add(e.candidate.toJSON());
   };
   await pc.setRemoteDescription(new RTCSessionDescription(data.offer));
   const answer = await pc.createAnswer();
   await pc.setLocalDescription(answer);
   await callDoc.update({ answer });
   offerCandidates.onSnapshot(s => {
    s.docChanges().forEach(c => {
     if (c.type === "added") {
      pc.addIceCandidate(new RTCIceCandidate(c.doc.data()));
     }
    });
   });
  });
 };
