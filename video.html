<!DOCTYPE html>
<html lang="ja">
<head>
  alert("myUid=" + myUid + "\ntargetUid=" + targetUid);
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Quiet Room</title>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

<style>
html, body { margin:0; padding:0; overflow:hidden; background:#000; font-family:sans-serif; }

#mainVideo { position:fixed; inset:0; width:100vw; height:100vh; object-fit:contain; background:#000; z-index:1; }
#mainCanvas { position:fixed; inset:0; width:100vw; height:100vh; z-index:2; pointer-events:none; }

#selfVideo { position:fixed; top:16px; right:16px; height:24vh; width:auto;
  min-width:120px; min-height:120px; object-fit:contain; background:#000;
  border-radius:12px; z-index:10; box-shadow:0 0 12px rgba(0,0,0,0.5); }

#selfCanvas { position:fixed; top:16px; right:16px; height:24vh; width:auto;
  min-width:120px; min-height:120px; z-index:11; pointer-events:none; border-radius:12px; }

.top-ui { position:fixed; top:16px; left:16px; display:flex; gap:10px; z-index:30; }
.icon-btn { width:52px; height:52px; border:none; border-radius:50%; background:rgba(0,0,0,0.55); color:#fff;
  font-size:22px; backdrop-filter:blur(6px); cursor:pointer; }

.mosaic-meter { position:fixed; right:12px; top:50%; transform:translateY(-50%); display:flex; flex-direction:column;
  align-items:center; z-index:40; color:#fff; }
.meter-bar { width:42px; height:28vh; display:flex; flex-direction:column-reverse; gap:4px; }
.meter-block { flex:1; width:100%; border-radius:8px; border:2px solid rgba(255,255,255,0.7);
  background:rgba(255,255,255,0.2); transition:0.15s; }
.meter-block.active { background:rgba(255,255,255,1); }
.meter-top, .meter-bottom { margin:8px 0; padding:6px 10px; border-radius:8px; background:rgba(0,0,0,0.55);
  cursor:pointer; user-select:none; }

#patrolMsg {
  position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
  background:rgba(0,0,0,0.6); color:#fff; padding:10px 16px;
  border-radius:8px; font-size:14px; display:none; z-index:50;
}
</style>
</head>

<body>

<video id="mainVideo" autoplay playsinline></video>
<canvas id="mainCanvas"></canvas>

<video id="selfVideo" autoplay muted playsinline></video>
<canvas id="selfCanvas"></canvas>

<div class="top-ui">
  <button class="icon-btn" id="switchCamera">📷🔄</button>
  <button class="icon-btn" id="endBtn">✕</button>
</div>

<div class="mosaic-meter">
  <div class="meter-top" id="meterUp">▲モザイク</div>
  <div class="meter-bar" id="meterBar"></div>
  <div class="meter-bottom" id="meterDown">▼クリア</div>
</div>

<div id="patrolMsg">v2.0管理人がパトロールすることがあります。安全に使ってね。</div>

<script>
/* =========================================
   Firebase
========================================= */
firebase.initializeApp({
  apiKey: "AIzaSyDXSKJaknyhXGtrFQCzYhmA6r7VQR0K_GM",
  authDomain: "roomvideo.firebaseapp.com",
  projectId: "roomvideo",
  storageBucket: "roomvideo.firebasestorage.app",
  messagingSenderId: "1030429439546",
  appId: "1:1030429439546:web:1481670cb78deb35e2a703"
});
const db = firebase.firestore();

/* =========================================
   UID / パラメータ
========================================= */
const myUid = localStorage.getItem("myUid");
const targetUid = new URLSearchParams(location.search).get("target");

/* =========================================
   モザイク同期 Firestore（6段階）
========================================= */
let myMosaicLevel = 5;          // 初期最大
let myMosaicSize = 22;
let remoteMosaicSize = 22;

const mosaicDoc = db.collection("mosaic").doc(myUid);
const remoteMosaicDoc = db.collection("mosaic").doc(targetUid);

function saveMyMosaic() {
  mosaicDoc.set({ size: myMosaicSize });
}

remoteMosaicDoc.onSnapshot(snap => {
  const d = snap.data();
  if (d && typeof d.size === "number") {
    remoteMosaicSize = d.size;
  }
});

/* =========================================
   WebRTC
========================================= */
let pc = new RTCPeerConnection({
  iceServers: [{ urls: "stun:stun.l.google.com:19302" }]
});

let localStream = null;

/* =========================================
   カメラ開始（音無し）
========================================= */
let currentFacing = "user";

async function startCamera() {
  localStream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: currentFacing },
    audio: false   // ← 音無し
  });
  selfVideo.srcObject = localStream;
  localStream.getTracks().forEach(t => pc.addTrack(t, localStream));
}

/* =========================================
   カメラ切替
========================================= */
async function switchCameraFunc() {
  currentFacing = currentFacing === "user" ? "environment" : "user";

  if (localStream) localStream.getTracks().forEach(t => t.stop());

  localStream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: currentFacing },
    audio: false
  });

  selfVideo.srcObject = localStream;

  const sender = pc.getSenders().find(s => s.track && s.track.kind === "video");
  if (sender) sender.replaceTrack(localStream.getVideoTracks()[0]);
}

document.getElementById("switchCamera").onclick = switchCameraFunc;

/* =========================================
   相手映像
========================================= */
pc.ontrack = e => {
  mainVideo.srcObject = e.streams[0];
};

/* =========================================
   モザイク描画ループ（5段階）
========================================= */
const mainVideo = document.getElementById("mainVideo");
const mainCanvas = document.getElementById("mainCanvas");
const mainCtx = mainCanvas.getContext("2d");

const selfVideo = document.getElementById("selfVideo");
const selfCanvas = document.getElementById("selfCanvas");
const selfCtx = selfCanvas.getContext("2d");

function drawMosaic() {
  /* ---- 相手映像 ---- */
  const w = mainVideo.videoWidth;
  const h = mainVideo.videoHeight;

  if (w && h) {
    mainCanvas.width = w;
    mainCanvas.height = h;
    mainCtx.imageSmoothingEnabled = false;
    mainCtx.drawImage(mainVideo, 0, 0, w / remoteMosaicSize, h / remoteMosaicSize);
    mainCtx.drawImage(mainCanvas, 0, 0, w / remoteMosaicSize, h / remoteMosaicSize, 0, 0, w, h);
  }

  /* ---- 自分映像 ---- */
  const vw = selfVideo.videoWidth;
  const vh = selfVideo.videoHeight;

  if (vw && vh) {
    selfCanvas.width = vw;
    selfCanvas.height = vh;

    const mosaicSizes = [1, 9, 13, 16, 19, 22];  // ← 任意の値をここに並べる
    myMosaicSize = mosaicSizes[myMosaicLevel];

    selfCtx.imageSmoothingEnabled = false;

    selfCtx.drawImage(selfVideo, 0, 0, vw / myMosaicSize, vh / myMosaicSize);
    selfCtx.drawImage(selfCanvas, 0, 0, vw / myMosaicSize, vh / myMosaicSize, 0, 0, vw, vh);
  }

  requestAnimationFrame(drawMosaic);
}
requestAnimationFrame(drawMosaic);

/* =========================================
   発信側
========================================= */
async function runCaller(callDoc, offerCandidates, answerCandidates) {
  await startCamera();

  pc.onicecandidate = e => {
    if (e.candidate) offerCandidates.add(e.candidate.toJSON());
  };

  const offer = await pc.createOffer();
  await pc.setLocalDescription(offer);
  await callDoc.set({ offer, from: myUid });

  /* 相手が拒否したら終了 */
  callDoc.onSnapshot(snap => {
    const d = snap.data();
    if (d?.declined) {
      alert("相手が出ませんでした。");
      location.href = "profiles.html";
    }
  });

  callDoc.onSnapshot(async snap => {
    const data = snap.data();
    if (data?.answer && !pc.currentRemoteDescription) {
      await pc.setRemoteDescription(new RTCSessionDescription(data.answer));
    }
  });

  answerCandidates.onSnapshot(snap => {
    snap.docChanges().forEach(c => {
      if (c.type === "added") pc.addIceCandidate(new RTCIceCandidate(c.doc.data()));
    });
  });
}

/* =========================================
   受信側
========================================= */
async function runCallee(callDoc, offerCandidates, answerCandidates) {
  await startCamera();

  pc.onicecandidate = e => {
    if (e.candidate) answerCandidates.add(e.candidate.toJSON());
  };

  const callData = (await callDoc.get()).data();
  await pc.setRemoteDescription(new RTCSessionDescription(callData.offer));

  const answer = await pc.createAnswer();
  await pc.setLocalDescription(answer);
  await callDoc.update({ answer });

  offerCandidates.onSnapshot(snap => {
    snap.docChanges().forEach(c => {
      if (c.type === "added") pc.addIceCandidate(new RTCIceCandidate(c.doc.data()));
    });
  });
}

/* =========================================
   ページ読み込み後
========================================= */
window.addEventListener("load", async () => {

  /* ---- モザイク UI（6段階） ---- */
  const meterBar = document.getElementById("meterBar");
  const meterUp = document.getElementById("meterUp");
  const meterDown = document.getElementById("meterDown");

  for (let i = 0; i < 5; i++) {
    const div = document.createElement("div");
    div.className = "meter-block";
    meterBar.appendChild(div);
  }

  function updateMeterUI() {
    [...meterBar.children].forEach((b, i) => {
      b.classList.toggle("active", i < myMosaicLevel);
    });
  }

  meterUp.onclick = () => {
    if (myMosaicLevel < 5) {
      myMosaicLevel++;
      updateMeterUI();
      saveMyMosaic();
    }
  };

  meterDown.onclick = () => {
    if (myMosaicLevel > 0) {
      myMosaicLevel--;
      updateMeterUI();
      saveMyMosaic();
    }
  };

  updateMeterUI();

  /* ---- パトロール通知 ---- */
  function showPatrolMessage() {
    const el = document.getElementById("patrolMsg");
    el.style.display = "block";
    setTimeout(() => { el.style.display = "none"; }, 3000);
  }
  setInterval(showPatrolMessage, 60000);
  setTimeout(showPatrolMessage, 10000);

  /* ---- 閉じるボタン（相手も終了） ---- */
  document.getElementById("endBtn").onclick = async () => {
    await db.collection("calls").doc(callerUid).update({ ended: true });
    alert("通話が終了しました。");
    location.href = "profiles.html";
  };

  /* ---- 相手が終了したら自分も終了 ---- */
  db.collection("calls").doc(callerUid).onSnapshot(snap => {
    const d = snap.data();
    if (d?.ended) {
      alert("相手が通話を終了しました。");
      location.href = "profiles.html";
    }
  });

  /* ---- 役割判定 ---- */
  let callDoc;
  let offerCandidates;
  let answerCandidates;
  let callerUid;

  const myCallSnap = await db.collection("calls").doc(myUid).get();

  if (myCallSnap.exists && myCallSnap.data().offer) {
    callDoc = db.collection("calls").doc(myUid);
    offerCandidates = callDoc.collection("offerCandidates");
    answerCandidates = callDoc.collection("answerCandidates");
    callerUid = callDoc.id;
    runCallee(callDoc, offerCandidates, answerCandidates);
    return;
  }

  callDoc = db.collection("calls").doc(targetUid);
  offerCandidates = callDoc.collection("offerCandidates");
  answerCandidates = callDoc.collection("answerCandidates");
  callerUid = callDoc.id;
  runCaller(callDoc, offerCandidates, answerCandidates);
});
</script>

</body>
</html>
