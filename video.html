<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Quiet Room</title>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

<style>
html, body { margin:0; padding:0; overflow:hidden; background:#000; font-family:sans-serif; }

#mainVideo { position:fixed; inset:0; width:100vw; height:100vh; object-fit:contain; background:#000; z-index:1; }
#mainCanvas { position:fixed; inset:0; width:100vw; height:100vh; z-index:2; pointer-events:none; }

#selfVideo { position:fixed; top:16px; right:16px; height:24vh; width:auto;
  min-width:120px; min-height:120px; object-fit:contain; background:#000;
  border-radius:12px; z-index:10; box-shadow:0 0 12px rgba(0,0,0,0.5); }

#selfCanvas { position:fixed; top:16px; right:16px; height:24vh; width:auto;
  min-width:120px; min-height:120px; z-index:11; pointer-events:none; border-radius:12px; }

.top-ui { position:fixed; top:16px; left:16px; display:flex; gap:10px; z-index:30; }
.icon-btn { width:52px; height:52px; border:none; border-radius:50%; background:rgba(0,0,0,0.55); color:#fff;
  font-size:22px; backdrop-filter:blur(6px); cursor:pointer; }

.mosaic-meter { position:fixed; right:12px; top:50%; transform:translateY(-50%); display:flex; flex-direction:column;
  align-items:center; z-index:40; color:#fff; }
.meter-bar { width:42px; height:28vh; display:flex; flex-direction:column-reverse; gap:4px; }
.meter-block { flex:1; width:100%; border-radius:8px; border:2px solid rgba(255,255,255,0.7);
  background:rgba(255,255,255,0.2); transition:0.15s; }
.meter-block.active { background:rgba(255,255,255,1); }
.meter-top, .meter-bottom { margin:8px 0; padding:6px 10px; border-radius:8px; background:rgba(0,0,0,0.55);
  cursor:pointer; user-select:none; }

#patrolMsg {
  position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
  background:rgba(0,0,0,0.6); color:#fff; padding:10px 16px;
  border-radius:8px; font-size:14px; display:none; z-index:50;
}

/* 終了ポップアップ */
#endPopupBg {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.65);
  display: none;
  justify-content: center;
  align-items: center;
  z-index: 9999;
}
#endPopupBox {
  background: #222;
  padding: 20px 26px;
  border-radius: 12px;
  text-align: center;
  color: #fff;
  width: 260px;
  box-shadow: 0 0 12px rgba(0,0,0,0.5);
}
#endPopupBox p {
  margin-bottom: 18px;
  font-size: 16px;
}
.main-btn {
  width: 100%;
  padding: 12px 0;
  background: #4a8cff;
  border: none;
  border-radius: 8px;
  color: #fff;
  font-size: 16px;
  margin-bottom: 14px;
  cursor: pointer;
}
.sub-btns {
  display: flex;
  justify-content: space-between;
}
.sub-btn {
  width: 48%;
  padding: 8px 0;
  background: #444;
  border: none;
  border-radius: 6px;
  color: #fff;
  font-size: 14px;
  cursor: pointer;
}
</style>
</head>

<body>

<video id="mainVideo" autoplay playsinline></video>
<canvas id="mainCanvas"></canvas>

<video id="selfVideo" autoplay muted playsinline></video>
<canvas id="selfCanvas"></canvas>

<div class="top-ui">
  <button class="icon-btn" id="switchCamera">📷🔄</button>
  <button class="icon-btn" id="endBtn">✕</button>
</div>

<div class="mosaic-meter">
  <div class="meter-top" id="meterUp">▲モザイク</div>
  <div class="meter-bar" id="meterBar"></div>
  <div class="meter-bottom" id="meterDown">▼クリア</div>
</div>

<div id="patrolMsg">v3.0管理人がパトロールすることがあります。安全に使ってね。</div>

<script>
/* 役割フラグ */
const isCaller = localStorage.getItem("isCaller") === "1";

/* Firebase */
firebase.initializeApp({
  apiKey: "AIzaSyDXSKJaknyhXGtrFQCzYhmA6r7VQR0K_GM",
  authDomain: "roomvideo.firebaseapp.com",
  projectId: "roomvideo",
  storageBucket: "roomvideo.firebasestorage.app",
  messagingSenderId: "1030429439546",
  appId: "1:1030429439546:web:1481670cb78deb35e2a703"
});
const db = firebase.firestore();

/* UID / パラメータ */
const myUid = localStorage.getItem("myUid");
const targetUid = new URLSearchParams(location.search).get("target");

/* caller / callee / callDoc */
let callerUid = null;
let calleeUid = null;
let callDoc = null;
let offerCandidates = null;
let answerCandidates = null;

/* モザイク同期 */
let myMosaicLevel = 5;
let myMosaicSize = 25;
let remoteMosaicSize = 25;
const mosaicSizes = [1, 10, 13, 16, 19, 25];

const mosaicDoc = db.collection("mosaic").doc(myUid);
const remoteMosaicDoc = db.collection("mosaic").doc(targetUid);

function saveMyMosaic() {
  mosaicDoc.set({ size: myMosaicSize });
}

remoteMosaicDoc.onSnapshot(snap => {
  const d = snap.data();
  if (d && typeof d.size === "number") {
    remoteMosaicSize = d.size;
  }
});

/* WebRTC */
let pc = new RTCPeerConnection({
  iceServers: [{ urls: "stun:stun.l.google.com:19302" }]
});
let localStream = null;

/* カメラ開始 */
let currentFacing = "user";

async function startCamera() {
  localStream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: currentFacing },
    audio: false
  });
  selfVideo.srcObject = localStream;
  localStream.getTracks().forEach(t => pc.addTrack(t, localStream));
}

/* カメラ切替＋再ネゴシエーション */
async function renegotiate() {
  if (!callDoc) return;
  const offer = await pc.createOffer({ iceRestart: false });
  await pc.setLocalDescription(offer);
  await callDoc.update({ offer });
}

async function switchCameraFunc() {
  currentFacing = currentFacing === "user" ? "environment" : "user";

  if (localStream) localStream.getTracks().forEach(t => t.stop());

  selfVideo.style.visibility = "hidden";
  selfCanvas.style.visibility = "hidden";

  localStream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: currentFacing },
    audio: false
  });

  selfVideo.srcObject = localStream;

  selfVideo.onloadedmetadata = () => {
    drawMosaicSelf();
    selfVideo.style.visibility = "visible";
    selfCanvas.style.visibility = "visible";
  };

  const sender = pc.getSenders().find(s => s.track && s.track.kind === "video");
  if (sender) sender.replaceTrack(localStream.getVideoTracks()[0]);

  await renegotiate();
}

document.getElementById("switchCamera").onclick = switchCameraFunc;

/* 相手映像 */
const mainVideo = document.getElementById("mainVideo");
const mainCanvas = document.getElementById("mainCanvas");
const mainCtx = mainCanvas.getContext("2d");

const selfVideo = document.getElementById("selfVideo");
const selfCanvas = document.getElementById("selfCanvas");
const selfCtx = selfCanvas.getContext("2d");

pc.ontrack = e => {
  mainVideo.srcObject = e.streams[0];
};

/* モザイク描画 */
function drawMosaic() {
  const w = mainVideo.videoWidth;
  const h = mainVideo.videoHeight;

  if (w && h) {
    mainCanvas.width = w;
    mainCanvas.height = h;
    mainCtx.imageSmoothingEnabled = false;
    mainCtx.drawImage(mainVideo, 0, 0, w / remoteMosaicSize, h / remoteMosaicSize);
    mainCtx.drawImage(mainCanvas, 0, 0, w / remoteMosaicSize, h / remoteMosaicSize, 0, 0, w, h);
  }

  const vw = selfVideo.videoWidth;
  const vh = selfVideo.videoHeight;

  if (vw && vh) {
    selfCanvas.width = vw;
    selfCanvas.height = vh;

    myMosaicSize = mosaicSizes[myMosaicLevel];

    selfCtx.imageSmoothingEnabled = false;
    selfCtx.drawImage(selfVideo, 0, 0, vw / myMosaicSize, vh / myMosaicSize);
    selfCtx.drawImage(selfCanvas, 0, 0, vw / myMosaicSize, vh / myMosaicSize, 0, 0, vw, vh);
  }

  requestAnimationFrame(drawMosaic);
}
function drawMosaicSelf() {}
requestAnimationFrame(drawMosaic);

/* ① 発信者：最初に Firestore に全データを書き込む */
async function startAsCaller() {
  await startCamera();

  callerUid = myUid;
  calleeUid = targetUid;
  callDoc = db.collection("calls").doc(calleeUid);
  offerCandidates = callDoc.collection("offerCandidates");
  answerCandidates = callDoc.collection("answerCandidates");

  pc.onicecandidate = e => {
    if (e.candidate) offerCandidates.add(e.candidate.toJSON());
  };

  const offer = await pc.createOffer();
  await pc.setLocalDescription(offer);

  await callDoc.set({
    from: callerUid,
    to: calleeUid,
    offer: offer,
    callerUid: callerUid,
    calleeUid: calleeUid,
    createdAt: Date.now()
  });

  localStorage.removeItem("isCaller");
}

/* ② 全員：Firestore から読み取り、役割確定＋シグナリング開始 */
async function setupSignaling() {
  if (!callDoc) {
    // 発信者でなければ、自分のUIDを callee とみなす
    callDoc = db.collection("calls").doc(myUid);
    offerCandidates = callDoc.collection("offerCandidates");
    answerCandidates = callDoc.collection("answerCandidates");
  }

  const snap = await callDoc.get();
  const data = snap.data();
  if (!data) return;

  callerUid = data.callerUid;
  calleeUid = data.calleeUid;

  // 自分が発信者側
  if (callerUid === myUid) {
    // answer を待つ
    callDoc.onSnapshot(async s => {
      const d = s.data();
      if (d?.answer && !pc.currentRemoteDescription) {
        await pc.setRemoteDescription(new RTCSessionDescription(d.answer));
      }
    });

    // 相手の ICE
    answerCandidates.onSnapshot(s => {
      s.docChanges().forEach(c => {
        if (c.type === "added") {
          pc.addIceCandidate(new RTCIceCandidate(c.doc.data()));
        }
      });
    });

  // 自分が着信者側
  } else if (calleeUid === myUid) {
    await startCamera();

    pc.onicecandidate = e => {
      if (e.candidate) answerCandidates.add(e.candidate.toJSON());
    };

    await pc.setRemoteDescription(new RTCSessionDescription(data.offer));

    const answer = await pc.createAnswer();
    await pc.setLocalDescription(answer);
    await callDoc.update({ answer });

    // 発信者の ICE
    offerCandidates.onSnapshot(s => {
      s.docChanges().forEach(c => {
        if (c.type === "added") {
          pc.addIceCandidate(new RTCIceCandidate(c.doc.data()));
        }
      });
    });

    // カメラ切替などで新しい offer が来た場合
    callDoc.onSnapshot(async s => {
      const d = s.data();
      if (!d) return;
      if (d.offer && pc.signalingState === "stable") {
        await pc.setRemoteDescription(new RTCSessionDescription(d.offer));
        const newAnswer = await pc.createAnswer();
        await pc.setLocalDescription(newAnswer);
        await callDoc.update({ answer: newAnswer });
      }
    });
  }
}

/* ページ読み込み後 */
window.addEventListener("load", async () => {
  // ★ 毎回モザイクレベルを最大に初期化
myMosaicLevel = 5;
myMosaicSize = mosaicSizes[myMosaicLevel];
saveMyMosaic();
updateMeterUI();

  /* モザイクUI */
  const meterBar = document.getElementById("meterBar");
  const meterUp = document.getElementById("meterUp");
  const meterDown = document.getElementById("meterDown");

  for (let i = 0; i < 5; i++) {
    const div = document.createElement("div");
    div.className = "meter-block";
    meterBar.appendChild(div);
  }

  function updateMeterUI() {
    [...meterBar.children].forEach((b, i) => {
      b.classList.toggle("active", i < myMosaicLevel);
    });
  }

  meterUp.onclick = () => {
    if (myMosaicLevel < 5) {
      myMosaicLevel++;
      myMosaicSize = mosaicSizes[myMosaicLevel];
      updateMeterUI();
      saveMyMosaic();
    }
  };

  meterDown.onclick = () => {
    if (myMosaicLevel > 0) {
      myMosaicLevel--;
      myMosaicSize = mosaicSizes[myMosaicLevel];
      updateMeterUI();
      saveMyMosaic();
    }
  };

  updateMeterUI();

  /* パトロール通知 */
  function showPatrolMessage() {
    const el = document.getElementById("patrolMsg");
    el.style.display = "block";
    setTimeout(() => { el.style.display = "none"; }, 3000);
  }
  setInterval(showPatrolMessage, 60000);
  setTimeout(showPatrolMessage, 10000);

  let isEndingMyself = false;

  /* 自分が終了ボタンを押した時 */
  document.getElementById("endBtn").onclick = async () => {
    isEndingMyself = true;
    if (callDoc) {
      await callDoc.set({ ended: true }, { merge: true });
      setTimeout(async () => {
        try { await callDoc.delete(); } catch (e) {}
      }, 500);
    }
    localStorage.removeItem("isCaller");
    localStorage.removeItem("targetUid");
    document.getElementById("endPopupBg").style.display = "flex";
  };

  /* 一覧に戻る */
  document.getElementById("backBtn").onclick = () => {
    location.href = "profiles.html";
  };

  /* ブロック */
  document.getElementById("blockBtn").onclick = async () => {
    await db.collection("users")
      .doc(myUid).collection("blocks")
      .doc(targetUid)
      .set({ blockedAt: Date.now() });

    alert("ブロックしました。");
    location.href = "profiles.html";
  };

  /* 通報（通報 → 自動ブロック） */
  document.getElementById("reportBtn").onclick = async () => {
    const already = await db.collection("reports")
      .doc(targetUid).collection("from").doc(myUid).get();

    if (!already.exists) {
      await db.collection("reports")
        .doc(targetUid).collection("from").doc(myUid)
        .set({ reportedAt: Date.now() });

      await db.collection("reports").doc(targetUid)
        .set({ count: firebase.firestore.FieldValue.increment(1) }, { merge: true });
    }

    await db.collection("users")
      .doc(myUid).collection("blocks")
      .doc(targetUid)
      .set({ blockedAt: Date.now() });

    alert("通報しました。このユーザーは自動的にブロックされました。");
    location.href = "profiles.html";
  };

  /* 相手が終了した時 */
  // callDoc は後で確定するので、確定後に監視を開始
  function watchEnd() {
    if (!callDoc) return;
    callDoc.onSnapshot(snap => {
      const d = snap.data();
      if (!d) return;
      if (d.ended && !isEndingMyself) {
        document.getElementById("endPopupBg").style.display = "flex";
      }
    });
  }

  window.addEventListener("beforeunload", async () => {
    try {
      if (callDoc) await callDoc.delete();
    } catch (err) {}
    localStorage.removeItem("isCaller");
    localStorage.removeItem("targetUid");
  });

  /* 役割に応じた初期処理 */
  if (isCaller) {
    await startAsCaller();
  } else {
    // 着信者側はここでは何もしない（setupSignaling 内で startCamera）
  }

  await setupSignaling();
  watchEnd();
});
</script>

<!-- 通話終了ポップアップ -->
<div id="endPopupBg">
  <div id="endPopupBox">
    <p>通話が終了しました。</p>
    <button id="backBtn" class="main-btn">一覧に戻る</button>
    <div class="sub-btns">
      <button id="blockBtn" class="sub-btn">⛔ ブロック</button>
      <button id="reportBtn" class="sub-btn">🚨 通報</button>
    </div>
  </div>
</div>

</body>
</html>
