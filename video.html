<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Quiet Room</title>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

<style>
html, body {
  margin: 0;
  padding: 0;
  overflow: hidden;
  background: #000;
  font-family: sans-serif;
}

/* 相手映像 */
#mainVideo {
  position: fixed;
  inset: 0;
  width: 100vw;
  height: 100vh;
  object-fit: contain;
  background: #000;
  z-index: 1;
}

/* モザイク */
#mainCanvas {
  position: fixed;
  inset: 0;
  width: 100vw;
  height: 100vh;
  z-index: 2;
  pointer-events: none;
}

/* 自分映像 */
#selfVideo {
  position: fixed;
  top: 16px;
  right: 16px;
  width: 24vw;
  height: 24vh;
  min-width: 180px;
  min-height: 130px;
  object-fit: contain;
  background: #000;
  border-radius: 12px;
  z-index: 10;
  box-shadow: 0 0 12px rgba(0,0,0,0.5);
}

/* UI */
.top-ui {
  position: fixed;
  top: 16px;
  left: 16px;
  display: flex;
  gap: 10px;
  z-index: 30;
}
.icon-btn {
  width: 52px;
  height: 52px;
  border: none;
  border-radius: 50%;
  background: rgba(0,0,0,0.55);
  color: #fff;
  font-size: 22px;
  backdrop-filter: blur(6px);
  cursor: pointer;
}

/* モザイクメーター */
.mosaic-meter {
  position: fixed;
  right: 12px;
  top: 50%;
  transform: translateY(-50%);
  display: flex;
  flex-direction: column;
  align-items: center;
  z-index: 40;
  color: #fff;
}
.meter-bar {
  width: 42px;
  height: 34vh;
  display: flex;
  flex-direction: column-reverse;
  gap: 4px;
}
.meter-block {
  flex: 1;
  width: 100%;
  border-radius: 8px;
  border: 2px solid rgba(255,255,255,0.7);
  background: rgba(255,255,255,0.2);
  transition: 0.15s;
}
.meter-block.active {
  background: rgba(255,255,255,1);
}
.meter-top,
.meter-bottom {
  margin: 8px 0;
  padding: 6px 10px;
  border-radius: 8px;
  background: rgba(0,0,0,0.55);
  cursor: pointer;
  user-select: none;
}
</style>
</head>

<body>

<!-- 相手映像 -->
<video id="mainVideo" autoplay playsinline></video>

<!-- モザイク -->
<canvas id="mainCanvas"></canvas>

<!-- 自分映像 -->
<video id="selfVideo" autoplay muted playsinline></video>

<!-- 左上UI -->
<div class="top-ui">
  <button class="icon-btn" id="switchCamera">🔄</button>
  <button class="icon-btn" id="endBtn">✕</button>
</div>

<!-- メーター -->
<div class="mosaic-meter">
  <div class="meter-top" id="meterUp">▲モザイク</div>
  <div class="meter-bar" id="meterBar"></div>
  <div class="meter-bottom" id="meterDown">▼クリア</div>
</div>

<script>
/* =========================================
   Firebase 初期化
========================================= */
const firebaseConfig = {
  apiKey: "AIzaSyDXSKJaknyhXGtrFQCzYhmA6r7VQR0K_GM",
  authDomain: "roomvideo.firebaseapp.com",
  projectId: "roomvideo",
  storageBucket: "roomvideo.firebasestorage.app",
  messagingSenderId: "1030429439546",
  appId: "1:1030429439546:web:1481670cb78deb35e2a703"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

/* =========================================
   UID
========================================= */
const myUid = localStorage.getItem("myUid");
const params = new URLSearchParams(window.location.search);
const targetUid = params.get("target");

alert("video.html 読み込まれた / myUid=" + myUid + " / target=" + targetUid);

/* =========================================
   WebRTC
========================================= */
let pc = new RTCPeerConnection({
  iceServers: [{ urls: "stun:stun.l.google.com:19302" }]
});

let localStream = null;
let currentCamera = "user";
let myMosaicLevel = 5;
let remoteMosaicLevel = 5;
const mosaicSizes = [0,1,4,8,12,16,20,28,36,48];

/* =========================================
   要素
========================================= */
const selfVideo = document.getElementById("selfVideo");
const mainVideo = document.getElementById("mainVideo");
const mainCanvas = document.getElementById("mainCanvas");
const mainCtx = mainCanvas.getContext("2d");
const meterBar = document.getElementById("meterBar");

/* =========================================
   カメラ開始
========================================= */
async function startCamera() {
  try {
    localStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: currentCamera },
      audio: false
    });

    selfVideo.srcObject = localStream;

    localStream.getTracks().forEach(track => {
      pc.addTrack(track, localStream);
    });

    setTimeout(resizeCanvas, 200);

  } catch (err) {
    console.error(err);
  }
}

/* =========================================
   相手映像
========================================= */
pc.ontrack = (event) => {
  mainVideo.srcObject = event.streams[0];
};

/* =========================================
   Firestore
========================================= */
const callDoc = db.collection("calls").doc(targetUid);
const offerCandidates = callDoc.collection("offerCandidates");
const answerCandidates = callDoc.collection("answerCandidates");

pc.onicecandidate = (event) => {
  if (event.candidate) {
    offerCandidates.add(event.candidate.toJSON());
  }
};

/* =========================================
   startCall（グローバル）
========================================= */
async function startCall() {
  alert("startCall が呼ばれた");

  await startCamera();

  const offer = await pc.createOffer();
  await pc.setLocalDescription(offer);

  alert("Firestore に書き込むよ target=" + targetUid);

  await callDoc.set({
    offer: offer,
    from: myUid
  });

  alert("Firestore に書き込んだよ");

  callDoc.onSnapshot(async (snap) => {
    const data = snap.data();
    if (!pc.currentRemoteDescription && data?.answer) {
      await pc.setRemoteDescription(new RTCSessionDescription(data.answer));
    }
  });

  answerCandidates.onSnapshot(snapshot => {
    snapshot.docChanges().forEach(change => {
      if (change.type === "added") {
        const candidate = new RTCIceCandidate(change.doc.data());
        pc.addIceCandidate(candidate);
      }
    });
  });
}

/* =========================================
   ページ読み込み後に自動で startCall 実行
========================================= */
window.addEventListener("load", () => {
  startCall();
});
</script>

</body>
</html>
