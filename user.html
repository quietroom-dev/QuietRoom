<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Quiet Room - User</title>

<style>
/* 画面いっぱいの縦長映像にする */
#mainVideo, #selfVideo, #canvas, .admin-video {
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  object-fit: cover;
  z-index: 1;
}

/* UIボタンを映像の上に重ねる */
.ui-layer {
  position: fixed;
  bottom: 20px;
  width: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
  z-index: 2;
}

/* ボタンをアプリ風に */
button {
  width: 90vw;
  max-width: 480px;
  padding: 14px;
  font-size: 18px;
  border: none;
  border-radius: 14px;
  background: rgba(0,0,0,0.6);
  color: #fff;
  backdrop-filter: blur(6px);
}

/* 相手の映像（全画面） */
#mainVideo {
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  object-fit: cover;
  z-index: 1;
}

/* 自分の映像（右下の小窓） */
#selfVideo {
  position: fixed;
  bottom: 20px;
  right: 20px;
  width: 10vw;
  height: 10vh;
  object-fit: cover;
  border-radius: 8px;
  z-index: 2;
  box-shadow: 0 0 8px rgba(0,0,0,0.4);
}

/* メーター（積み上げ型） */
.mosaic-meter {
  position: fixed;
  right: 10px;
  top: 50%;
  transform: translateY(-50%);
  display: flex;
  flex-direction: column;
  align-items: center;
  z-index: 10;
  color: #fff;
  font-size: 14px;
}

.meter-bar {
  width: 26px;
  height: 30vh;
  display: flex;
  flex-direction: column-reverse;
  gap: 2px;
}

.meter-block {
  width: 100%;
  height: 10%;
  background: rgba(255,255,255,0.3);
  border-radius: 4px;
  transition: background 0.2s;
}

.meter-block.active {
  background: rgba(255,255,255,0.9);
}

.meter-top, .meter-bottom {
  padding: 6px 4px;
  background: rgba(0,0,0,0.5);
  border-radius: 6px;
  margin: 6px 0;
  user-select: none;
}


</style>
</head>

<body>
<!-- 相手の映像（大画面） -->
<video id="mainVideo" autoplay playsinline></video>

<!-- 自分の映像（小窓） -->
<video id="selfVideo" autoplay muted playsinline></video>

<!-- メーター -->
<div class="mosaic-meter">
  <div class="meter-top" onclick="changeMosaic(-1)">▲ クリア</div>
  <div class="meter-bar">
    <div id="meterFill"></div>
  </div>
  <div class="meter-bottom" onclick="changeMosaic(1)">▼ モザイク</div>
</div>

<!-- UIボタン -->
<div class="ui-layer">
  <button id="switchCamera">カメラ切替</button>
  <button onclick="start()">Start</button>
  <button onclick="stop()">Stop</button>
</div>

<div id="safeMessage">管理者がパトロールすることがあります。安全に使ってね。</div>

<!-- 映像 -->
<video id="mainVideo" autoplay playsinline></video>
<video id="selfVideo" autoplay muted playsinline></video>

<script type="module">
/* Firebase */
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyDXSKJaknyhXGtrFQCzYhmA6r7VQR0K_GM",
  authDomain: "roomvideo.firebaseapp.com",
  databaseURL: "https://roomvideo-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "roomvideo",
  storageBucket: "roomvideo.firebasestorage.app",
  messagingSenderId: "1030429439546",
  appId: "1:1030429439546:web:1481670cb78deb35e2a703"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

/* カメラ起動 */
let localStream;
let currentCamera = "user";

async function startCamera() {
  localStream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: currentCamera },
    audio: false
  });
  document.getElementById("selfVideo").srcObject = localStream;
}
startCamera();

/* カメラ切替 */
document.getElementById("switchCamera")?.addEventListener("click", async () => {
  currentCamera = currentCamera === "user" ? "environment" : "user";
  localStream.getTracks().forEach(t => t.stop());
  startCamera();
});

/* ▼▼▼ モザイク処理 ▼▼▼ */
let mosaicLevel = 5;
const mosaicSizes = [1, 4, 8, 16, 24, 32, 40, 48, 56, 64];

const selfVideo = document.getElementById("selfVideo");
const canvas = document.createElement("canvas");
const ctx = canvas.getContext("2d");
canvas.width = 120;
canvas.height = 90;
selfVideo.parentNode.insertBefore(canvas, selfVideo);
selfVideo.style.display = "none";

/* メーター生成 */
const meterBar = document.querySelector(".meter-bar");
for (let i = 0; i < 10; i++) {
  const block = document.createElement("div");
  block.className = "meter-block";
  meterBar.appendChild(block);
}

/* メーター更新 */
function updateMeter() {
  const blocks = document.querySelectorAll(".meter-block");
  blocks.forEach((b, i) => {
    b.classList.toggle("active", i < mosaicLevel);
  });
}

/* メーター操作 */
function changeMosaic(delta) {
  mosaicLevel += delta;
  if (mosaicLevel < 1) mosaicLevel = 1;
  if (mosaicLevel > 10) mosaicLevel = 10;
  updateMeter();
}

/* モザイク処理 */
function drawMosaic() {
  if (!localStream) return;
  const videoTrack = localStream.getVideoTracks()[0];
  const imageCapture = new ImageCapture(videoTrack);
  imageCapture.grabFrame().then(bitmap => {
    ctx.imageSmoothingEnabled = false;
    const size = mosaicSizes[mosaicLevel - 1];
    ctx.drawImage(bitmap, 0, 0, size, size);
    ctx.drawImage(canvas, 0, 0, size, size, 0, 0, canvas.width, canvas.height);
  });
}
setInterval(drawMosaic, 200);
updateMeter();

/* カメラ切替 */
let currentCamera = "user";
document.getElementById("switchCamera").onclick = async () => {
  currentCamera = currentCamera === "user" ? "environment" : "user";
  localStream.getTracks().forEach(t => t.stop());
  startCamera();
};


/* 安全メッセージ */
setInterval(() => {
  const msg = document.getElementById("safeMessage");
  msg.style.display = "block";
  setTimeout(() => msg.style.display = "none", 3000);
}, 60000);

</script>

<div id="version" style="margin-top: 20px; font-size: 12px; color: #888; text-align: center;">
  v1.0.9
</div>

</body>
</html>
