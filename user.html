<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Quiet Room - User</title>

<style>

/* =========================
   相手映像（全画面）
========================= */
#mainVideo {
  position: fixed;
  inset: 0;
  width: 100vw;
  height: 100vh;
  object-fit: cover;
  z-index: 1;
  background: #000;
}

/* =========================
   自分映像（右下）
========================= */
#selfVideo {
  position: fixed;
  bottom: 20px;
  right: 20px;
  width: 20vw;
  height: 20vh;
  min-width: 140px;
  min-height: 100px;
  object-fit: cover;
  border-radius: 12px;
  z-index: 3;
  background: #000;
  box-shadow: 0 0 10px rgba(0,0,0,0.45);
}

/* モザイクCanvas */
#selfCanvas {
  position: fixed;
  bottom: 20px;
  right: 20px;
  width: 20vw;
  height: 20vh;
  min-width: 140px;
  min-height: 100px;
  border-radius: 12px;
  z-index: 4;
  pointer-events: none;
}

/* =========================
   UIボタン
========================= */
.ui-layer {
  position: fixed;
  left: 50%;
  bottom: 20px;
  transform: translateX(-50%);
  display: flex;
  flex-direction: column;
  gap: 12px;
  align-items: center;
  z-index: 10;
  width: 100%;
}

button {
  width: 90vw;
  max-width: 480px;

  padding: 14px;
  border: none;
  border-radius: 14px;

  font-size: 18px;
  color: #fff;

  background: rgba(0,0,0,0.6);
  backdrop-filter: blur(6px);

  cursor: pointer;
}

button:disabled {
  opacity: 0.45;
  cursor: not-allowed;
}

/* =========================
   モザイクメーター
========================= */
.mosaic-meter {
  position: fixed;
  right: 12px;
  top: 50%;
  transform: translateY(-50%);

  display: flex;
  flex-direction: column;
  align-items: center;

  z-index: 20;
  color: #fff;
  user-select: none;
}

/* バー本体 */
.meter-bar {
  width: 42px;
  height: 34vh;

  display: flex;
  flex-direction: column-reverse;

  gap: 4px;
}

/* 各ブロック */
.meter-block {
  flex: 1;

  width: 100%;

  background: rgba(255,255,255,0.22);

  border: 2px solid rgba(255,255,255,0.7);

  border-radius: 8px;

  transition:
    background 0.12s ease,
    transform 0.12s ease;
}

/* 点灯 */
.meter-block.active {
  background: rgba(255,255,255,1);
}

/* 上下ボタン */
.meter-top,
.meter-bottom {
  margin: 8px 0;
  padding: 6px 10px;

  background: rgba(0,0,0,0.55);

  border-radius: 8px;

  font-size: 14px;

  cursor: pointer;
}

</style>
</head>

<body>

<!-- 相手映像 -->
<video id="mainVideo" autoplay playsinline></video>

<!-- 自分映像 -->
<video id="selfVideo" autoplay muted playsinline></video>

<!-- モザイク描画 -->
<canvas id="selfCanvas"></canvas>

<!-- メーター -->
<div class="mosaic-meter">

  <div class="meter-top" id="meterUp">
    ▲ クリア
  </div>

  <div
    class="meter-bar"
    id="meterBar"
    role="list"
    aria-label="Mosaic Level"
  ></div>

  <div class="meter-bottom" id="meterDown">
    ▼ モザイク
  </div>

</div>

<!-- UI -->
<div class="ui-layer">

  <button id="switchCamera">
    カメラ切替
  </button>

  <button id="startBtn">
    Start
  </button>

  <button id="stopBtn" disabled>
    Stop
  </button>

</div>

<script type="module">

/* =========================================
   状態
========================================= */

let localStream = null;
let currentCamera = "user";

/* モザイクレベル 1〜10 */
let mosaicLevel = 5;

/* モザイク粒度 */
const mosaicSizes = [
  1,
  4,
  8,
  12,
  16,
  20,
  28,
  36,
  48,
  64
];

/* =========================================
   要素取得
========================================= */

const selfVideo = document.getElementById("selfVideo");
const mainVideo = document.getElementById("mainVideo");

const canvas = document.getElementById("selfCanvas");
const ctx = canvas.getContext("2d");

const meterBar = document.getElementById("meterBar");

const startBtn = document.getElementById("startBtn");
const stopBtn = document.getElementById("stopBtn");

/* =========================================
   Offscreen Canvas（毎回生成しない）
========================================= */

const offCanvas = document.createElement("canvas");
const offCtx = offCanvas.getContext("2d");

/* =========================================
   カメラ開始
========================================= */

async function startCamera() {

  try {

    localStream =
      await navigator.mediaDevices.getUserMedia({
        video: {
          facingMode: currentCamera
        },
        audio: false
      });

    selfVideo.srcObject = localStream;

    /* デモ用:
       mainVideoにも同じ映像 */
    mainVideo.srcObject = localStream;

    setTimeout(resizeCanvas, 200);

  } catch (err) {

    console.error("カメラ起動エラー:", err);

  }
}

/* =========================================
   カメラ停止
========================================= */

function stopCamera() {

  if (!localStream) return;

  localStream.getTracks().forEach(track => {
    track.stop();
  });

  localStream = null;
}

/* =========================================
   カメラ切替
========================================= */

document
  .getElementById("switchCamera")
  .addEventListener("click", async () => {

    stopCamera();

    currentCamera =
      currentCamera === "user"
        ? "environment"
        : "user";

    await startCamera();

  });

/* =========================================
   Start / Stop
========================================= */

function startApp() {

  startBtn.disabled = true;
  stopBtn.disabled = false;

  startCamera();
}

function stopApp() {

  startBtn.disabled = false;
  stopBtn.disabled = true;

  stopCamera();

  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );
}

startBtn.addEventListener("click", startApp);
stopBtn.addEventListener("click", stopApp);

/* =========================================
   Canvas サイズ調整
========================================= */

function resizeCanvas() {

  const rect =
    selfVideo.getBoundingClientRect();

  const dpr =
    window.devicePixelRatio || 1;

  canvas.style.width = rect.width + "px";
  canvas.style.height = rect.height + "px";

  canvas.width =
    Math.max(1, Math.floor(rect.width * dpr));

  canvas.height =
    Math.max(1, Math.floor(rect.height * dpr));

  ctx.setTransform(
    dpr,
    0,
    0,
    dpr,
    0,
    0
  );
}

window.addEventListener(
  "resize",
  resizeCanvas
);

/* =========================================
   モザイク描画
========================================= */

function drawMosaic() {

  if (
    !selfVideo ||
    selfVideo.readyState < 2
  ) {
    return;
  }

  const displayW = canvas.clientWidth;
  const displayH = canvas.clientHeight;

  const size =
    mosaicSizes[
      Math.max(
        0,
        Math.min(9, mosaicLevel - 1)
      )
    ];

  /* Offscreen サイズ */
  offCanvas.width = size;

  offCanvas.height =
    Math.max(
      1,
      Math.round(size * (displayH / displayW))
    );

  offCtx.imageSmoothingEnabled = false;

  /* 小さく描画 */
  offCtx.clearRect(
    0,
    0,
    offCanvas.width,
    offCanvas.height
  );

  offCtx.drawImage(
    selfVideo,
    0,
    0,
    offCanvas.width,
    offCanvas.height
  );

  /* 拡大描画 */
  ctx.imageSmoothingEnabled = false;

  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );

  ctx.drawImage(
    offCanvas,
    0,
    0,
    offCanvas.width,
    offCanvas.height,
    0,
    0,
    canvas.width,
    canvas.height
  );
}

/* 描画ループ */
setInterval(drawMosaic, 120);

/* =========================================
   メーター初期化
========================================= */

function initMeter() {

  meterBar.innerHTML = "";

  for (let i = 0; i < 10; i++) {

    const block =
      document.createElement("div");

    block.className = "meter-block";

    block.setAttribute(
      "role",
      "listitem"
    );

    meterBar.appendChild(block);
  }

  updateMeter();
}

/* =========================================
   メーター更新
========================================= */

function updateMeter() {

  const blocks =
    document.querySelectorAll(
      ".meter-block"
    );

  blocks.forEach((block, index) => {

    block.classList.toggle(
      "active",
      index < mosaicLevel
    );

  });
}

/* =========================================
   モザイク変更
========================================= */

function changeMosaic(delta) {

  mosaicLevel += delta;

  if (mosaicLevel < 1) {
    mosaicLevel = 1;
  }

  if (mosaicLevel > 10) {
    mosaicLevel = 10;
  }

  updateMeter();
}

/* =========================================
   メーターボタン
========================================= */

document
  .getElementById("meterUp")
  .addEventListener("click", () => {

    /* クリア方向 */
    changeMosaic(-1);

  });

document
  .getElementById("meterDown")
  .addEventListener("click", () => {

    /* モザイク強化 */
    changeMosaic(1);

  });

/* =========================================
   初期化
========================================= */

initMeter();

setTimeout(
  resizeCanvas,
  300
);

startCamera();

</script>

</body>
</html>
