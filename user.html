<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Quiet Room - User</title>

<style>
/* 相手の映像（全画面） */
#mainVideo {
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  object-fit: cover;
  z-index: 1;
}

/* 自分の映像（右下の小窓） */
#selfVideo {
  position: fixed;
  bottom: 20px;
  right: 20px;
  width: 20vw;
  height: 20vh;
  object-fit: cover;
  border-radius: 8px;
  z-index: 3;
  box-shadow: 0 0 8px rgba(0,0,0,0.4);
  background: #000;
}

/* モザイク用 canvas（自分の映像の上に重ねる） */
#selfCanvas {
  position: fixed;
  bottom: 20px;
  right: 20px;
  width: 20vw;
  height: 20vh;
  z-index: 4;
  border-radius: 8px;
  pointer-events: none; /* 小窓の操作を邪魔しない */
}

/* UIボタン */
.ui-layer {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  width: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
  z-index: 5;
}

button {
  width: 90vw;
  max-width: 480px;
  padding: 14px;
  font-size: 18px;
  border: none;
  border-radius: 14px;
  background: rgba(0,0,0,0.6);
  color: #fff;
  backdrop-filter: blur(6px);
}

/* メーター（積み上げ型） */
.mosaic-meter {
  position: fixed;
  right: 10px;
  top: 50%;
  transform: translateY(-50%);
  display: flex;
  flex-direction: column;
  align-items: center;
  z-index: 20;
  color: #fff;
  font-size: 14px;
}

.meter-bar {
  width: 40px;              /* 横長にする */
  height: 30vh;
  display: flex;
  flex-direction: column-reverse;
  gap: 4px;
}

.meter-block {
  width: 100%;
  height: 12%;              /* 縦1：横2 の比率に近づける */
  background: rgba(255,255,255,0.25);
  border: 2px solid rgba(255,255,255,0.6);  /* 縁取り */
  border-radius: 8px;       /* 角丸 */
  transition: background 0.15s;
}

.meter-block.active {
  background: rgba(255,255,255,1);   /* 塗りつぶし */
}

.meter-top, .meter-bottom {
  padding: 6px 8px;
  background: rgba(0,0,0,0.5);
  border-radius: 6px;
  margin: 6px 0;
  user-select: none;
  cursor: pointer;
}
</style>
</head>

<body>

<!-- 相手の映像（大画面） -->
<video id="mainVideo" autoplay playsinline></video>

<!-- 自分の映像（小窓） -->
<video id="selfVideo" autoplay muted playsinline></video>
<canvas id="selfCanvas"></canvas>

<!-- メーター -->
<div class="mosaic-meter" aria-hidden="false">
  <div class="meter-top" id="meterUp">▲ クリア</div>
  <div class="meter-bar" id="meterBar" role="list"></div>
  <div class="meter-bottom" id="meterDown">▼ モザイク</div>
</div>

<!-- UIボタン -->
<div class="ui-layer">
  <button id="switchCamera">カメラ切替</button>
  <button id="startBtn">Start</button>
  <button id="stopBtn">Stop</button>
</div>

<script type="module">
/* --- 初期設定 --- */
let localStream = null;
let currentCamera = "user";

/* カメラ起動 */
async function startCamera() {
  try {
    localStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: currentCamera },
      audio: false
    });
    const selfVideo = document.getElementById("selfVideo");
    selfVideo.srcObject = localStream;
    // canvas サイズを合わせる（少し遅延して要素サイズが確定してから）
    setTimeout(resizeCanvas, 200);
  } catch (err) {
    console.error("カメラ起動エラー:", err);
  }
}
startCamera();

/* カメラ切替 */
document.getElementById("switchCamera").addEventListener("click", async () => {
  if (localStream) {
    localStream.getTracks().forEach(t => t.stop());
  }
  currentCamera = currentCamera === "user" ? "environment" : "user";
  await startCamera();
});

/* Start / Stop（ダミー。必要なら実装を差し替えて） */
window.start = function() {
  document.getElementById("startBtn").disabled = true;
  document.getElementById("stopBtn").disabled = false;
};
window.stop = function() {
  document.getElementById("startBtn").disabled = false;
  document.getElementById("stopBtn").disabled = true;
};

/* --- モザイク処理 --- */
let mosaicLevel = 5; // 1..10
const mosaicSizes = [1,4,8,12,16,20,28,36,48,64];

const selfVideo = document.getElementById("selfVideo");
const canvas = document.getElementById("selfCanvas");
const ctx = canvas.getContext("2d");

/* canvas を小窓サイズに合わせる（ピクセル比を考慮） */
function resizeCanvas() {
  const rect = selfVideo.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  canvas.style.width = rect.width + "px";
  canvas.style.height = rect.height + "px";
  canvas.width = Math.max(1, Math.floor(rect.width * dpr));
  canvas.height = Math.max(1, Math.floor(rect.height * dpr));
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0); // スケーリングを合わせる
}
window.addEventListener("resize", resizeCanvas);

/* モザイク描画（video要素から直接描画） */
function drawMosaic() {
  if (!selfVideo || selfVideo.readyState < 2) return;
  // canvas の表示サイズ（CSSピクセル）
  const displayW = canvas.clientWidth;
  const displayH = canvas.clientHeight;
  const size = mosaicSizes[Math.max(0, Math.min(9, mosaicLevel - 1))];

  // 1) 小さく描いて 2) 拡大してピクセル化
  // 一時的に描画先を canvas（上書き）で行う
  // drawImage(video, sx, sy, sWidth, sHeight, dx, dy, dWidth, dHeight)
  // まず小さく描く（左上に）
  ctx.imageSmoothingEnabled = false;
  // 描画先を小サイズで一旦描く（0,0,size,size）
  // To preserve aspect, draw scaled small then scale up to canvas
  // We'll draw video into a tiny area then scale up
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  // draw small into a temporary offscreen canvas would be ideal, but we can draw directly:
  // draw video scaled down to (size x size) at 0,0 then scale that to full canvas
  // Use an offscreen canvas to avoid flicker
  const off = document.createElement("canvas");
  off.width = size;
  off.height = Math.max(1, Math.round(size * (displayH / displayW)));
  const offCtx = off.getContext("2d");
  offCtx.imageSmoothingEnabled = false;
  // draw video into offscreen with fit
  offCtx.drawImage(selfVideo, 0, 0, off.width, off.height);
  // then draw the offscreen scaled to visible canvas
  ctx.drawImage(off, 0, 0, off.width, off.height, 0, 0, canvas.width, canvas.height);
}

/* 描画ループ */
setInterval(drawMosaic, 120);

/* --- メーター（積み上げ型） --- */
function initMeter() {
  const meterBar = document.getElementById("meterBar");
  if (!meterBar) return;
  // 既にブロックがある場合はクリア
  meterBar.innerHTML = "";
  for (let i = 0; i < 10; i++) {
    const block = document.createElement("div");
    block.className = "meter-block";
    block.setAttribute("role", "listitem");
    meterBar.appendChild(block);
  }
  updateMeter();
}

/* メーター更新 */
function updateMeter() {
  const blocks = document.querySelectorAll(".meter-block");
  blocks.forEach((b, i) => {
    // i: 0 が下（column-reverse のため視覚的に下に来る）
    b.classList.toggle("active", i < mosaicLevel);
  });
}

/* メーター操作（グローバルに公開） */
window.changeMosaic = function(delta) {
  // delta は +1 で「モザイク強く」、-1 で「クリア」
  mosaicLevel += delta;

  if (mosaicLevel < 1) mosaicLevel = 1;
  if (mosaicLevel > 10) mosaicLevel = 10;

  updateMeter();
};


/* ▲/▼ クリックイベント（アクセシビリティ向上） */
document.getElementById("meterUp").addEventListener("click", () => window.changeMosaic(1));   // 上＝モザイク強く
document.getElementById("meterDown").addEventListener("click", () => window.changeMosaic(-1)); // 下＝クリア


/* 初期化は DOMContentLoaded 後に確実に実行 */
window.addEventListener("DOMContentLoaded", () => {
  initMeter();
  // canvas サイズ合わせ（video がまだ来ていない場合もあるので少し遅延）
  setTimeout(resizeCanvas, 300);
});

/* バージョン表示（任意） */
<div id="version" style="
  position: fixed;
  bottom: 5px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 12px;
  color: #ccc;
  z-index: 20;
">
  v1.0.1
</div>
</script>

</body>
</html>
