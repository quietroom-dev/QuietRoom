<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Quiet Room - User</title>
<style>
/* 画面いっぱいの縦長映像にする */
#video, #canvas, .admin-video {
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  object-fit: cover;
  z-index: 1;
}

/* UIボタンを映像の上に重ねる */
.ui-layer {
  position: fixed;
  bottom: 20px;
  width: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
  z-index: 2;
}

/* ボタンをアプリ風に */
button {
  width: 90vw;
  max-width: 480px;
  padding: 14px;
  font-size: 18px;
  border: none;
  border-radius: 14px;
  background: rgba(0,0,0,0.6);
  color: #fff;
  backdrop-filter: blur(6px);
}
.mosaic-control {
  width: 90vw;
  max-width: 480px;
  color: #fff;
  font-size: 14px;
  display: flex;
  flex-direction: column;
  gap: 4px;
}

#mosaicRange {
  width: 100%;
}

#mosaicValue {
  font-size: 12px;
  color: #ccc;
  text-align: right;
}

</style>

</head>
<body>
　<div class="ui-layer">
  <div class="mosaic-control">
    <label for="mosaicRange">Mosaic</label>
    <input id="mosaicRange" type="range" min="1" max="10" value="5" oninput="onMosaicChange(this.value)">
    <span id="mosaicValue">5 / 10</span>
  </div>

  <button onclick="start()">Start</button>
  <button onclick="stop()">Stop</button>
</div>

  <div id="safeMessage">管理者がパトロールすることがあります。安全に使ってね。</div>

  <video id="mainVideo" autoplay playsinline></video>
  <video id="selfVideo" autoplay muted playsinline></video>

  <div id="controls">
    <button id="mosaicMinus">モザイク弱く</button>
    <button id="mosaicPlus">モザイク強く</button>
    <button id="switchCamera">カメラ切替</button>
    <button id="reportUser">通報</button>
    <button id="blockUser">ブロック</button>
    <button id="awayMode">不在</button>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getDatabase, ref, set, update } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDXSKJaknyhXGtrFQCzYhmA6r7VQR0K_GM",
      authDomain: "roomvideo.firebaseapp.com",
      databaseURL: "https://roomvideo-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "roomvideo",
      storageBucket: "roomvideo.firebasestorage.app",
      messagingSenderId: "1030429439546",
      appId: "1:1030429439546:web:1481670cb78deb35e2a703"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // 🎥 カメラ起動
    let localStream;
    let currentCamera = "user";
    async function startCamera() {
      localStream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: currentCamera },
        audio: false
      });
      document.getElementById("selfVideo").srcObject = localStream;
    }
    startCamera();

    // 🔄 カメラ切替
    document.getElementById("switchCamera").onclick = async () => {
      currentCamera = currentCamera === "user" ? "environment" : "user";
      localStream.getTracks().forEach(t => t.stop());
      startCamera();
    };

    // 🎨 モザイク処理
    let mosaicLevel = 5;
    const mosaicSizes = [1, 4, 8, 16, 32, 48];
    const selfVideo = document.getElementById("selfVideo");
    const canvas = document.createElement("canvas");
    const ctx = canvas.getContext("2d");
    canvas.width = 120;
    canvas.height = 90;
    selfVideo.parentNode.insertBefore(canvas, selfVideo);
    selfVideo.style.display = "none";

    function drawMosaic() {
      if (!localStream) return;
      const videoTrack = localStream.getVideoTracks()[0];
      const imageCapture = new ImageCapture(videoTrack);
      imageCapture.grabFrame().then(bitmap => {
        ctx.imageSmoothingEnabled = false;
        const size = mosaicSizes[mosaicLevel];
        ctx.drawImage(bitmap, 0, 0, size, size);
        ctx.drawImage(canvas, 0, 0, size, size, 0, 0, canvas.width, canvas.height);
      });
    }
    setInterval(drawMosaic, 200);

    document.getElementById("mosaicMinus").onclick = () => {
      if (mosaicLevel > 0) mosaicLevel--;
    };
    document.getElementById("mosaicPlus").onclick = () => {
      if (mosaicLevel < 5) mosaicLevel++;
    };

    // 🚨 通報・ブロック・不在
    document.getElementById("reportUser").onclick = () => {
      alert("通報しました。相手は自動的にブロックされます。");
    };
    document.getElementById("blockUser").onclick = () => {
      alert("このユーザーをブロックしました。");
    };
    document.getElementById("awayMode").onclick = () => {
      alert("不在モードに設定しました。誰からも通話を受けません。");
    };

    // 🔔 安全メッセージ
    setInterval(() => {
      const msg = document.getElementById("safeMessage");
      msg.style.display = "block";
      setTimeout(() => msg.style.display = "none", 3000);
    }, 60000);
    let mosaicLevel = 5; // 1〜10

function onMosaicChange(v) {
  mosaicLevel = Number(v);
  document.getElementById('mosaicValue').textContent = `${v} / 10`;
  // ここで実際のモザイク用の変数に反映する
  // 例: pixelSize = 5 * mosaicLevel;
}

  </script>
<div id="version" style="
  margin-top: 20px;
  font-size: 12px;
  color: #888;
  text-align: center;
">
  v1.0.4
</div>

</body>
</html>
