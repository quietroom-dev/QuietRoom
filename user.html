<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Quiet Room</title>

<style>
v1.1.1
/* =========================
   全体
========================= */
html,
body {
  margin: 0;
  padding: 0;
  overflow: hidden;
  background: #000;
  font-family: sans-serif;
}

/* =========================
   相手映像（全画面）
========================= */
#mainVideo {
  position: fixed;
  inset: 0;

  width: 100vw;
  height: 100vh;

  /* 全体を見せる */
  object-fit: contain;

  background: #000;

  z-index: 1;
}

/* 相手映像モザイク */
#mainCanvas {
  position: fixed;
  inset: 0;

  width: 100vw;
  height: 100vh;

  z-index: 2;

  pointer-events: none;
}

/* =========================
   自分映像（右下）
========================= */
#selfVideo {
  position: fixed;

  right: 20px;
  bottom: 20px;

  width: 24vw;
  height: 24vh;

  min-width: 180px;
  min-height: 130px;

  /* 全体表示 */
  object-fit: contain;

  background: #000;

  border-radius: 12px;

  z-index: 5;

  box-shadow: 0 0 12px rgba(0,0,0,0.5);
}

/* =========================
   UI
========================= */
.ui-layer {
  position: fixed;

  left: 50%;
  bottom: 20px;

  transform: translateX(-50%);

  display: flex;
  flex-direction: column;

  gap: 12px;

  align-items: center;

  z-index: 20;

  width: 100%;
}

button {
  width: 90vw;
  max-width: 480px;

  padding: 14px;

  border: none;
  border-radius: 14px;

  font-size: 18px;

  color: #fff;

  background: rgba(0,0,0,0.6);

  backdrop-filter: blur(6px);

  cursor: pointer;
}

button:disabled {
  opacity: 0.45;
}

/* =========================
   メーター
========================= */
.mosaic-meter {
  position: fixed;

  right: 12px;
  top: 50%;

  transform: translateY(-50%);

  display: flex;
  flex-direction: column;
  align-items: center;

  z-index: 30;

  color: #fff;
}

.meter-bar {
  width: 42px;
  height: 34vh;

  display: flex;
  flex-direction: column-reverse;

  gap: 4px;
}

.meter-block {
  flex: 1;

  width: 100%;

  border-radius: 8px;

  border: 2px solid rgba(255,255,255,0.7);

  background: rgba(255,255,255,0.2);

  transition: 0.15s;
}

.meter-block.active {
  background: rgba(255,255,255,1);
}

.meter-top,
.meter-bottom {
  margin: 8px 0;

  padding: 6px 10px;

  border-radius: 8px;

  background: rgba(0,0,0,0.55);

  cursor: pointer;

  user-select: none;
}

</style>
</head>

<body>

<!-- 相手映像 -->
<video
  id="mainVideo"
  autoplay
  playsinline
></video>

<!-- 相手映像モザイク -->
<canvas id="mainCanvas"></canvas>

<!-- 自分映像 -->
<video
  id="selfVideo"
  autoplay
  muted
  playsinline
></video>

<!-- メーター -->
<div class="mosaic-meter">

  <div
    class="meter-top"
    id="meterUp"
  >
    ▲ クリア
  </div>

  <div
    class="meter-bar"
    id="meterBar"
  ></div>

  <div
    class="meter-bottom"
    id="meterDown"
  >
    ▼ モザイク
  </div>

</div>

<!-- UI -->
<div class="ui-layer">

  <button id="switchCamera">
    カメラ切替
  </button>

  <button id="startBtn">
    Start
  </button>

  <button
    id="stopBtn"
    disabled
  >
    Stop
  </button>

</div>

<script type="module">

/* =========================================
   状態
========================================= */

let localStream = null;
let currentCamera = "user";

/*
  相手が選んだモザイク強度
  1〜10
*/
let remoteMosaicLevel = 5;

/* モザイク粒度 */
const mosaicSizes = [
  1,
  4,
  8,
  12,
  16,
  20,
  28,
  36,
  48,
  64
];

/* =========================================
   要素
========================================= */

const selfVideo =
  document.getElementById("selfVideo");

const mainVideo =
  document.getElementById("mainVideo");

const mainCanvas =
  document.getElementById("mainCanvas");

const mainCtx =
  mainCanvas.getContext("2d");

const meterBar =
  document.getElementById("meterBar");

/* =========================================
   Offscreen
========================================= */

const offCanvas =
  document.createElement("canvas");

const offCtx =
  offCanvas.getContext("2d");

/* =========================================
   カメラ開始
========================================= */

async function startCamera() {

  try {

    localStream =
      await navigator.mediaDevices.getUserMedia({
        video: {
          facingMode: currentCamera
        },
        audio: false
      });

    /*
      自分映像
    */
    selfVideo.srcObject = localStream;

    /*
      今はデモとして
      相手映像にも同じ映像を入れる

      実運用では
      remoteStream を入れる
    */
    mainVideo.srcObject = localStream;

    setTimeout(resizeCanvas, 200);

  } catch (err) {

    console.error(err);

  }
}

/* =========================================
   カメラ停止
========================================= */

function stopCamera() {

  if (!localStream) return;

  localStream.getTracks().forEach(track => {
    track.stop();
  });

  localStream = null;
}

/* =========================================
   カメラ切替
========================================= */

document
  .getElementById("switchCamera")
  .addEventListener("click", async () => {

    stopCamera();

    currentCamera =
      currentCamera === "user"
        ? "environment"
        : "user";

    await startCamera();

  });

/* =========================================
   Start / Stop
========================================= */

document
  .getElementById("startBtn")
  .addEventListener("click", () => {

    document.getElementById(
      "startBtn"
    ).disabled = true;

    document.getElementById(
      "stopBtn"
    ).disabled = false;

    startCamera();

  });

document
  .getElementById("stopBtn")
  .addEventListener("click", () => {

    document.getElementById(
      "startBtn"
    ).disabled = false;

    document.getElementById(
      "stopBtn"
    ).disabled = true;

    stopCamera();

  });

/* =========================================
   Canvasサイズ
========================================= */

function resizeCanvas() {

  const dpr =
    window.devicePixelRatio || 1;

  mainCanvas.width =
    window.innerWidth * dpr;

  mainCanvas.height =
    window.innerHeight * dpr;

  mainCanvas.style.width =
    window.innerWidth + "px";

  mainCanvas.style.height =
    window.innerHeight + "px";

  mainCtx.setTransform(
    dpr,
    0,
    0,
    dpr,
    0,
    0
  );
}

window.addEventListener(
  "resize",
  resizeCanvas
);

/* =========================================
   相手映像モザイク描画
========================================= */

function drawRemoteMosaic() {

  if (
    mainVideo.readyState < 2
  ) {
    return;
  }

  const w =
    mainCanvas.clientWidth;

  const h =
    mainCanvas.clientHeight;

  const size =
    mosaicSizes[
      Math.max(
        0,
        Math.min(
          9,
          remoteMosaicLevel - 1
        )
      )
    ];

  /*
    小さく描画
  */
  offCanvas.width = size;

  offCanvas.height =
    Math.max(
      1,
      Math.round(size * (h / w))
    );

  offCtx.imageSmoothingEnabled = false;

  offCtx.clearRect(
    0,
    0,
    offCanvas.width,
    offCanvas.height
  );

  offCtx.drawImage(
    mainVideo,
    0,
    0,
    offCanvas.width,
    offCanvas.height
  );

  /*
    拡大描画
  */
  mainCtx.imageSmoothingEnabled = false;

  mainCtx.clearRect(
    0,
    0,
    mainCanvas.width,
    mainCanvas.height
  );

  mainCtx.drawImage(
    offCanvas,
    0,
    0,
    offCanvas.width,
    offCanvas.height,
    0,
    0,
    mainCanvas.width,
    mainCanvas.height
  );
}

/* 描画ループ */
setInterval(
  drawRemoteMosaic,
  120
);

/* =========================================
   メーター初期化
========================================= */

function initMeter() {

  meterBar.innerHTML = "";

  for (let i = 0; i < 10; i++) {

    const block =
      document.createElement("div");

    block.className =
      "meter-block";

    meterBar.appendChild(block);
  }

  updateMeter();
}

/* =========================================
   メーター更新
========================================= */

function updateMeter() {

  const blocks =
    document.querySelectorAll(
      ".meter-block"
    );

  blocks.forEach((block, index) => {

    block.classList.toggle(
      "active",
      index < remoteMosaicLevel
    );

  });
}

/* =========================================
   モザイク変更
========================================= */

function changeMosaic(delta) {

  remoteMosaicLevel += delta;

  if (remoteMosaicLevel < 1) {
    remoteMosaicLevel = 1;
  }

  if (remoteMosaicLevel > 10) {
    remoteMosaicLevel = 10;
  }

  /*
    本来ここで
    相手へ送信する

    socket.send(...)
  */

  updateMeter();
}

/* =========================================
   メーター操作
========================================= */

document
  .getElementById("meterUp")
  .addEventListener("click", () => {

    /*
      クリア方向
    */
    changeMosaic(-1);

  });

document
  .getElementById("meterDown")
  .addEventListener("click", () => {

    /*
      モザイク強化
    */
    changeMosaic(1);

  });

/* =========================================
   初期化
========================================= */

initMeter();

resizeCanvas();

startCamera();

</script>

</body>
</html>
