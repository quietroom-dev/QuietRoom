<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Quiet Room - User</title>

<style>
/* 相手の映像（全画面） */
#mainVideo {
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  object-fit: cover;
  z-index: 1;
}

/* 自分の映像（右下の小窓） */
#selfVideo {
  position: fixed;
  bottom: 20px;
  right: 20px;
  width: 20vw;
  height: 20vh;
  object-fit: cover;
  border-radius: 8px;
  z-index: 3;
  box-shadow: 0 0 8px rgba(0,0,0,0.4);
}

/* モザイク用 canvas（自分の映像の上に重ねる） */
#selfCanvas {
  position: fixed;
  bottom: 20px;
  right: 20px;
  width: 20vw;
  height: 20vh;
  z-index: 4;
  border-radius: 8px;
}

/* UIボタン */
.ui-layer {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  width: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
  z-index: 5;
}

button {
  width: 90vw;
  max-width: 480px;
  padding: 14px;
  font-size: 18px;
  border: none;
  border-radius: 14px;
  background: rgba(0,0,0,0.6);
  color: #fff;
  backdrop-filter: blur(6px);
}

/* メーター（積み上げ型） */
.mosaic-meter {
  position: fixed;
  right: 10px;
  top: 50%;
  transform: translateY(-50%);
  display: flex;
  flex-direction: column;
  align-items: center;
  z-index: 10;
  color: #fff;
  font-size: 14px;
}

.meter-bar {
  width: 26px;
  height: 30vh;
  display: flex;
  flex-direction: column-reverse;
  gap: 2px;
}

.meter-block {
  width: 100%;
  height: 10%;
  background: rgba(255,255,255,0.3);
  border-radius: 4px;
  transition: background 0.2s;
}

.meter-block.active {
  background: rgba(255,255,255,0.9);
}

.meter-top, .meter-bottom {
  padding: 6px 4px;
  background: rgba(0,0,0,0.5);
  border-radius: 6px;
  margin: 6px 0;
  user-select: none;
}
</style>
</head>

<body>

<!-- 相手の映像（大画面） -->
<video id="mainVideo" autoplay playsinline></video>

<!-- 自分の映像（小窓） -->
<video id="selfVideo" autoplay muted playsinline></video>
<canvas id="selfCanvas"></canvas>

<!-- メーター -->
<div class="mosaic-meter">
  <div class="meter-top" onclick="changeMosaic(-1)">▲ クリア</div>
  <div class="meter-bar" id="meterBar"></div>
  <div class="meter-bottom" onclick="changeMosaic(1)">▼ モザイク</div>
</div>

<!-- UIボタン -->
<div class="ui-layer">
  <button id="switchCamera">カメラ切替</button>
  <button onclick="start()">Start</button>
  <button onclick="stop()">Stop</button>
</div>

<script type="module">
/* Firebase */
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyDXSKJaknyhXGtrFQCzYhmA6r7VQR0K_GM",
  authDomain: "roomvideo.firebaseapp.com",
  databaseURL: "https://roomvideo-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "roomvideo",
  storageBucket: "roomvideo.firebasestorage.app",
  messagingSenderId: "1030429439546",
  appId: "1:1030429439546:web:1481670cb78deb35e2a703"
};

initializeApp(firebaseConfig);

/* カメラ起動 */
let localStream;
let currentCamera = "user";

async function startCamera() {
  localStream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: currentCamera },
    audio: false
  });
  document.getElementById("selfVideo").srcObject = localStream;
}
startCamera();

/* カメラ切替 */
document.getElementById("switchCamera").onclick = async () => {
  currentCamera = currentCamera === "user" ? "environment" : "user";
  localStream.getTracks().forEach(t => t.stop());
  startCamera();
};

/* ▼▼▼ モザイク処理 ▼▼▼ */
let mosaicLevel = 5;
const mosaicSizes = [1, 4, 8, 16, 24, 32, 40, 48, 56, 64];

const selfVideo = document.getElementById("selfVideo");
const canvas = document.getElementById("selfCanvas");
const ctx = canvas.getContext("2d");

/* canvas を小窓サイズに合わせる */
function resizeCanvas() {
  canvas.width = selfVideo.clientWidth;
  canvas.height = selfVideo.clientHeight;
}
window.addEventListener("resize", resizeCanvas);
setTimeout(resizeCanvas, 500);

/* モザイク描画 */
function drawMosaic() {
  if (!localStream) return;

  const videoTrack = localStream.getVideoTracks()[0];
  const imageCapture = new ImageCapture(videoTrack);

  imageCapture.grabFrame().then(bitmap => {
    ctx.imageSmoothingEnabled = false;
    const size = mosaicSizes[mosaicLevel - 1];

    ctx.drawImage(bitmap, 0, 0, size, size);
    ctx.drawImage(canvas, 0, 0, size, size, 0, 0, canvas.width, canvas.height);
  });
}
setInterval(drawMosaic, 200);

/* ▼▼▼ メーター（積み上げ型） ▼▼▼ */
const meterBar = document.getElementById("meterBar");

/* ブロック生成 */
for (let i = 0; i < 10; i++) {
  const block = document.createElement("div");
  block.className = "meter-block";
  meterBar.appendChild(block);
}

/* メーター更新 */
function updateMeter() {
  const blocks = document.querySelectorAll(".meter-block");
  blocks.forEach((b, i) => {
    b.classList.toggle("active", i < mosaicLevel);
  });
}

/* メーター操作 */
function changeMosaic(delta) {
  mosaicLevel += delta;
  if (mosaicLevel < 1) mosaicLevel = 1;
  if (mosaicLevel > 10) mosaicLevel = 10;
  updateMeter();
}

updateMeter(); // 初期反映
</script>

</body>
</html>
