<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QuietRoom 管理者</title>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

<style>
body { margin:0; padding:12px; background:#000; color:#4aff4a; font-family:monospace; }
#loginBox { text-align:center; margin-top:40px; }
#gridView {
  display:none;
  grid-template-columns:repeat(4, 1fr);
  gap:8px;
  width:100%;
  height:calc(100vh - 20px);
  overflow:hidden;
  touch-action:pan-y;
}
.videoBox {
  background:#0a0a0a;
  border-radius:8px;
  padding:4px;
  border:1px solid #1f1f1f;
}
.videoBox video {
  width:100%;
  aspect-ratio:4/3;
  background:#000;
  border-radius:4px;
}
.profileBox {
  font-size:11px;
  color:#4aff4a;
  margin-top:4px;
  line-height:1.3;
}
#fullscreenView {
  position:fixed; inset:0; background:#000;
  display:none; flex-direction:column; align-items:center; justify-content:center;
}
#fullscreenVideo { width:100%; max-width:900px; max-height:80vh; background:#000; }
#fsControls { position:fixed; bottom:16px; left:0; right:0; display:flex; justify-content:center; gap:16px; }
.fs-btn { padding:8px 16px; border-radius:20px; border:none; background:#0f0f0f; color:#4aff4a; font-size:14px; }
.fs-btn:active { background:#1f1f1f; }
</style>
</head>

<body>

<!-- ▼▼▼ ログイン画面 ▼▼▼ -->
<div id="loginBox">
  <h3 style="color:#4aff4a; font-weight:normal;">
    ── Security Operation Console ──
  </h3>

  <div style="color:#4aff4a; font-size:13px; margin-top:20px; line-height:1.6;">
    [INFO] 通信監視モジュール起動中だぜ…<br>
    [INFO] アクセス元IPを解析しています…<br>
    [WARN] 不審な接続パターンを検出…<br>
    [INFO] 追加検証プロトコルを要求します…<br>
    [SYS] セッション維持のため検証コードを入力してください
  </div>

  <input id="pass" type="password"
    placeholder="検証コード"
    style="padding:10px; width:240px; border-radius:4px; border:1px solid #4aff4a;
           background:#000; color:#4aff4a; margin-top:25px; font-family:monospace;">

  <button onclick="login()"
    style="margin-top:12px; padding:8px 18px; border:none; border-radius:4px;
           background:#0f0f0f; color:#4aff4a; font-size:12px; font-family:monospace;">
    監査ログを更新
  </button>

  <p id="err" style="color:#ff4444; display:none; margin-top:10px;">
    [ERROR] 検証失敗：再試行してください
  </p>
</div>
<!-- ▲▲▲ ログイン画面 ▲▲▲ -->

<div id="gridView"></div>

<div id="fullscreenView">
  <video id="fullscreenVideo" autoplay playsinline></video>
  <div id="fsControls">
    <button id="audioToggle" class="fs-btn">🔇</button>
    <button id="backToList" class="fs-btn">一覧へ戻る</button>
  </div>
</div>

<script>
/* Firebase */
firebase.initializeApp({
  apiKey: "AIzaSyDXSKJaknyhXGtrFQCzYhmA6r7VQR0K_GM",
  authDomain: "roomvideo.firebaseapp.com",
  projectId: "roomvideo",
  storageBucket: "roomvideo.firebasestorage.app",
  messagingSenderId: "1030429439546",
  appId: "1:1030429439546:web:1481670cb78deb35e2a703"
});
const auth = firebase.auth();
const db = firebase.firestore();
let myUid;

alert("v1.0.0");

auth.onAuthStateChanged(async user => {
  if (!user) return;
  myUid = user.uid;
}

/* ▼▼▼ 管理者ログイン（password 方式） ▼▼▼ */
async function login() {
  const adminDoc = db.collection("admins").doc("password");   // ← passwordドキュメント
  const snap = await adminDoc.get();                          // ← ドキュメント取得
  const pw = snap.data().password;                          // ← passwordフィールドを変数pwへ
  const input = document.getElementById("pass").value;
  alert(pw+","+input);
  if (input === pw) {
    loginBox.style.display = "none";
    gridView.style.display = "grid";
  }
  else {
    err.style.display = "block";
  }
}
/* ▲▲▲ 管理者ログイン ▲▲▲ */

/* ▼▼▼ プロフィールキャッシュ ▼▼▼ */
const profileCache = new Map);

async function getProfile(uid) {
  if (!uid) return null;
  if (profileCache.has(uid)) return profileCache.get(uid);

  const snap = await db.collection("user").doc(uid).get();
  const data = snap.exists ? snap.data() : null;
  profileCache.set(uid, data);
  return data;
}
/* ▲▲▲ プロフィールキャッシュ ▲▲▲ */


/* ▼▼▼ 一覧（8映像 × 横スワイプ） ▼▼▼ */
let latestCallDocs = [];
let page = 0;
const pageSize = 8;
let allVideoItems = [];
function renderPagedGrid() {
  const wrap = document.getElementById("gridView");
  wrap.innerHTML = "";
  const start = page * pageSize;
  const end = start + pageSize;
  const items = allVideoItems.slice(start, end);
  items.forEach(item => wrap.appendChild(item.videoBox));
}
async function rebuildVideoList() {
  allVideoItems = [];
  for (const doc of latestCallDocs) {
    const userUid = doc.id;
    const [prof, rep] = await Promise.all([
      getProfile(userUid),
      getReportCount(userUid)
    ]);
    const box = document.createElement("div");
    box.className = "videoBox";
    const v = document.createElement("video");
    v.autoplay = true;
    v.playsInline = true;
    v.muted = true;
    const profDiv = document.createElement("div");
    profDiv.className = "profileBox";
    if (prof) {
      profDiv.innerHTML = `
        <b>${prof.nickname}</b><br>
        性別：${prof.gender}<br>
        年齢：${prof.age}<br>
        都道府県：${prof.prefecture}<br>
        ひとこと：${prof.comment}<br>
        通報数：${rep}<br>
        <span style="opacity:0.6;">${userUid}</span>
      `;
    } else {
      profDiv.innerHTML = `
        プロフィールなし<br>
        <span style="opacity:0.6;">${userUid}</span>
      `;
    }
    box.appendChild(v);
    box.appendChild(profDiv);
    allVideoItems.push({
      userUid,
      videoBox: box,
      videoEl: v
    });
    // 接続がまだ無い時だけ作成
    if (!pcMap.has(userUid)) {
      createAdminPC(userUid, v);
    } else {
  const pc = pcMap.get(userUid);
  pc.videoElement = v;
  if (pc.getReceivers().length > 0) {
    const streams = pc.getReceivers()
      .map(r => r.track)
      .filter(t => t)
      .map(t => new MediaStream([t]));
    if (streams.length > 0) {
      v.srcObject = streams[0];
    }
  }
}
    box.onclick = () => openFullscreen(userUid);
  }
  const maxPage =
    allVideoItems.length > 0
      ? Math.floor((allVideoItems.length - 1) / pageSize)
      : 0;
  if (page > maxPage) page = maxPage;
  renderPagedGrid();
}

/* 横スワイプ */
let touchStartX = 0;
document.addEventListener("touchstart", e => {
  touchStartX = e.touches[0].clientX;
});
document.addEventListener("touchend", e => {
  const dx = e.changedTouches[0].clientX - touchStartX;
  if (dx < -50) {
    page++;
    const maxPage = allVideoItems.length > 0 ? Math.floor((allVideoItems.length - 1) / pageSize) : 0;
    page = Math.min(page, maxPage);
    renderPagedGrid();
  }
  if (dx > 50) {
    page = Math.max(0, page - 1);
    renderPagedGrid();
  }
});
/* ▲▲▲ 一覧 ▲▲▲ */

/* ▼▼▼ WebRTC（管理者用：adminCalls）▼▼▼ */
function createAdminPC(userUid, videoEl) {
  // 既に作成済みなら何もしない
  if (pcMap.has(userUid)) return;
  const pc = new RTCPeerConnection({
    iceServers: [
      { urls: "stun:stun.l.google.com:19302" }
    ]
  });
  pc.onconnectionstatechange = async () => {

  if (
    pc.connectionState === "closed" ||
    pc.connectionState === "failed" ||
    pc.connectionState === "disconnected"
  ) {

    try {

      const offer = await offerCandidates.get();
      for (const d of offer.docs) {
        await d.ref.delete();
      }

      const answer = await answerCandidates.get();
      for (const d of answer.docs) {
        await d.ref.delete();
      }

      await callDoc.delete();

    } catch(e) {
      console.log(e);
    }
  }
};
  pc.addTransceiver("video", { direction: "recvonly" });
  pc.ontrack = e => {
    videoEl.srcObject = e.streams[0];
  };
  const callDoc = db.collection("adminCalls").doc(userUid);
  const offerCandidates = callDoc.collection("offerCandidates");
  const answerCandidates = callDoc.collection("answerCandidates");
  pc.onicecandidate = e => {
    if (!e.candidate) return;
    answerCandidates.add(
      e.candidate.toJSON()
    );
  };
  const unsubscribeCall = callDoc.onSnapshot(async snap => {
    const d = snap.data();
    if (!d) return;
    if (d.ended) {
      const watcher = watcherMap.get(userUid);
      if (watcher) {
        try {
          watcher.unsubscribeCall();
        } catch (e) {}
        try {
          watcher.unsubscribeOffer();
        } catch (e) {}
        try {
          watcher.pc.close();
        } catch (e) {}
        watcherMap.delete(userUid);
      }
      pcMap.delete(userUid);
      return;
    }
    if (!d.offer) return;
    if (!pc.currentRemoteDescription) {
      await pc.setRemoteDescription(
        new RTCSessionDescription(d.offer)
      );
      const answer = await pc.createAnswer();
      await pc.setLocalDescription(answer);
      await callDoc.update({
        answer
      });
    }
  });
  const unsubscribeOffer = offerCandidates.onSnapshot(snap => {
    snap.docChanges().forEach(c => {
      if (c.type !== "added") return;
      pc.addIceCandidate(
        new RTCIceCandidate(c.doc.data())
      );
    });
  });
  pcMap.set(userUid, pc);
  watcherMap.set(userUid, {
    pc,
    unsubscribeCall,
    unsubscribeOffer
  });
}
/* ▲▲▲ WebRTC ▲▲▲ */

/* ▼▼▼ 全画面 ▼▼▼ */
let fullscreenUid = null;
function openFullscreen(userUid) {
  fullscreenUid = userUid;
  const item = allVideoItems.find(v => v.userUid === userUid);
  if (!item) return;
  const listVideo = item.videoEl;
  const fsVideo = document.getElementById("fullscreenVideo");
  // 一覧で受信しているStreamをそのまま使う
  fsVideo.srcObject = listVideo.srcObject;
  fsVideo.muted = true;
  document.getElementById("backToList").onclick = () => {
  const fsVideo = document.getElementById("fullscreenVideo");
  fsVideo.pause();
  fsVideo.srcObject = null;

  fullscreenUid = null;

  document.getElementById("fullscreenView").style.display = "none";
  document.getElementById("gridView").style.display = "grid";
};
document.getElementById("audioToggle").onclick = () => {
  const v = document.getElementById("fullscreenVideo");
  v.muted = !v.muted;
  document.getElementById("audioToggle").textContent =
    v.muted ? "🔇" : "🔈";
};
document.getElementById("backToList").onclick = () => {
  const fsVideo = document.getElementById("fullscreenVideo");
  fsVideo.pause();
  fsVideo.srcObject = null;
  fullscreenUid = null;
  document.getElementById("fullscreenView").style.display = "none";
  document.getElementById("gridView").style.display = "grid";
};
/* ▲▲▲ 全画面 ▲▲▲ */

/* ▼▼▼ adminCalls監視 ▼▼▼ */
const watcherMap = new Map();
const pcMap = new Map();
db.collection("adminCalls").onSnapshot(snap => {

  const aliveUsers = new Set();
  const docs = [];

  snap.forEach(doc => {

    const d = doc.data();

    if (!d) return;
    if (!d.offer) return;
    if (d.ended) return;

    aliveUsers.add(doc.id);
    docs.push(doc);

  });

  // 消えたユーザーの PeerConnection を閉じる
  for (const [uid, watcher] of watcherMap.entries()) {

    if (aliveUsers.has(uid)) continue;

    try {
      watcher.unsubscribeCall();
    } catch (e) {}

    try {
      watcher.unsubscribeOffer();
    } catch (e) {}

    try {
      watcher.pc.close();
    } catch (e) {}

    watcherMap.delete(uid);
    pcMap.delete(uid);

  }

  latestCallDocs = docs;
  rebuildVideoList();

});
    // -----------------------------
    // 通話終了
    // -----------------------------
    if (change.type === "removed" || data.ended) {
      const index = allVideoItems.findIndex(v => v.userUid === userUid);
      if (index >= 0) {
        allVideoItems.splice(index, 1);
      }
      const watcher = watcherMap.get(userUid);
    if (watcher) {
      try {
        watcher.stopCallWatcher();
      } catch(e){}
      try {
        watcher.stopOfferWatcher();
      } catch(e){}
      try {
        watcher.pc.close();
      } catch(e){}
    watcherMap.delete(userUid);
    }
    pcMap.delete(userUid);
    renderPagedGrid();
    }
  }
});
/* ▲▲▲ adminCalls監視 ▲▲▲ */

async function deleteCollection(collectionRef) {
  const snapshot = await collectionRef.get();
  const promises = [];
  snapshot.forEach(doc => {
    promises.push(doc.ref.delete());
  });
  await Promise.all(promises);
}
window.addEventListener("beforeunload", async () => {

  // 一覧の監視を終了
  for (const watcher of watcherMap.values()) {

    try {
      watcher.unsubscribeCall();
    } catch(e){}

    try {
      watcher.unsubscribeOffer();
    } catch(e){}

    try {
      watcher.pc.close();
    } catch(e){}
  }

  watcherMap.clear();
  pcMap.clear();

  // 全画面を閉じる
  if (fsPC) {
    try {
      fsPC.close();
    } catch(e){}
    fsPC = null;
  }

});
</script>
</body>
</html>
