<!DOCTYPE html>
<html lang="ja">
<head>
  v1.0.0
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QuietRoom 管理者</title>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

<style>
body { margin:0; padding:20px; background:#111; color:#fff; font-family:sans-serif; }
.call-box { border:1px solid #444; padding:10px; margin-bottom:20px; border-radius:8px; }
video { width:100%; max-height:240px; background:#000; }
</style>
</head>

<body>

<h2>QuietRoom 管理者ページ</h2>
<div id="calls"></div>

<script>
firebase.initializeApp({
  apiKey: "AIzaSyDXSKJaknyhXGtrFQCzYhmA6r7VQR0K_GM",
  authDomain: "roomvideo.firebaseapp.com",
  projectId: "roomvideo",
  storageBucket: "roomvideo.firebasestorage.app",
  messagingSenderId: "1030429439546",
  appId: "1:1030429439546:web:1481670cb78deb35e2a703"
});
const db = firebase.firestore();

function connectToCall(callerUid, box) {
  const pc = new RTCPeerConnection({
    iceServers: [{ urls: "stun:stun.l.google.com:19302" }]
  });

  pc.addTransceiver("video", { direction: "recvonly" });

  const video = box.querySelector("video");
  pc.ontrack = e => {
    video.srcObject = e.streams[0];
  };

  const callDoc = db.collection("calls").doc(callerUid);

  callDoc.onSnapshot(async snap => {
    const d = snap.data();
    if (!d) return;

    if (d.offer && !pc.remoteDescription) {
      await pc.setRemoteDescription(new RTCSessionDescription(d.offer));
      const answer = await pc.createAnswer();
      await pc.setLocalDescription(answer);
      await callDoc.update({ answer });
    }
  });

  callDoc.collection("offerCandidates").onSnapshot(snap => {
    snap.docChanges().forEach(c => {
      if (c.type === "added") {
        pc.addIceCandidate(new RTCIceCandidate(c.doc.data()));
      }
    });
  });
}

db.collection("calls").onSnapshot(snap => {
  const wrap = document.getElementById("calls");
  wrap.innerHTML = "";

  snap.forEach(doc => {
    const d = doc.data();
    if (!d.offer || d.ended) return;

    const box = document.createElement("div");
    box.className = "call-box";
    box.innerHTML = `
      <div>通話：${d.from} → ${d.target}</div>
      <video autoplay playsinline></video>
    `;
    wrap.appendChild(box);

    connectToCall(doc.id, box);
  });
});
</script>

</body>
</html>
