<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QuietRoom 管理者</title>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

<style>
body { margin:0; padding:12px; background:#000; color:#4aff4a; font-family:monospace; }

/* ログイン画面 */
#loginBox { text-align:center; margin-top:40px; }

/* 一覧（8映像 × 横スワイプ） */
#gridView {
  display:grid;
  grid-template-columns:repeat(4, 1fr);
  gap:8px;
  width:100%;
  height:calc(100vh - 20px);
  overflow:hidden;
  touch-action:pan-y;
}

.videoBox {
  background:#0a0a0a;
  border-radius:8px;
  padding:4px;
  border:1px solid #1f1f1f;
}
.videoBox video {
  width:100%;
  aspect-ratio:4/3;
  background:#000;
  border-radius:4px;
}
.profileBox {
  font-size:11px;
  color:#4aff4a;
  margin-top:4px;
  line-height:1.3;
}

/* 全画面 */
#fullscreenView {
  position:fixed; inset:0; background:#000;
  display:none; flex-direction:column; align-items:center; justify-content:center;
}
#fullscreenVideo { width:100%; max-width:900px; max-height:80vh; background:#000; }
#fsControls { position:fixed; bottom:16px; left:0; right:0; display:flex; justify-content:center; gap:16px; }
.fs-btn { padding:8px 16px; border-radius:20px; border:none; background:#0f0f0f; color:#4aff4a; font-size:14px; }
.fs-btn:active { background:#1f1f1f; }
</style>
</head>

<body>

<!-- ▼▼▼ ログイン画面 ▼▼▼ -->
<div id="loginBox">
  <h3 style="color:#4aff4a; font-weight:normal;">
    ── Security Operation Console ──
  </h3>

  <div style="color:#4aff4a; font-size:13px; margin-top:20px; line-height:1.6;">
    [INFO] 通信監視モジュール起動中…<br>
    [INFO] アクセス元IPを解析しています…<br>
    [WARN] 不審な接続パターンを検出…<br>
    [INFO] 追加検証プロトコルを要求します…<br>
    [SYS] セッション維持のため検証コードを入力してください
  </div>

  <input id="pass" type="password"
    placeholder="検証コード"
    style="padding:10px; width:240px; border-radius:4px; border:1px solid #4aff4a;
           background:#000; color:#4aff4a; margin-top:25px; font-family:monospace;">

  <button onclick="login()"
    style="margin-top:12px; padding:8px 18px; border:none; border-radius:4px;
           background:#0f0f0f; color:#4aff4a; font-size:12px; font-family:monospace;">
    監査ログを更新
  </button>

  <p id="err" style="color:#ff4444; display:none; margin-top:10px;">
    [ERROR] 検証失敗：再試行してください
  </p>
</div>
<!-- ▲▲▲ ログイン画面 ▲▲▲ -->

<!-- 一覧 -->
<div id="gridView"></div>

<!-- 全画面 -->
<div id="fullscreenView">
  <video id="fullscreenVideo" autoplay playsinline></video>
  <div id="fsControls">
    <button id="audioToggle" class="fs-btn">🔇</button>
    <button id="backToList" class="fs-btn">一覧へ戻る</button>
  </div>
</div>

<script>
/* Firebase */
firebase.initializeApp({
  apiKey: "AIzaSyDXSKJaknyhXGtrFQCzYhmA6r7VQR0K_GM",
  authDomain: "roomvideo.firebaseapp.com",
  projectId: "roomvideo",
  storageBucket: "roomvideo.firebasestorage.app",
  messagingSenderId: "1030429439546",
  appId: "1:1030429439546:web:1481670cb78deb35e2a703"
});
const db = firebase.firestore();

/* ▼▼▼ ログイン ▼▼▼ */
async function login() {
  const input = document.getElementById("pass").value;
  const snaps = await db.collection("admins").get();
  let ok = false;
  for (const doc of snaps.docs) {
    if (input === doc.data().password) { ok = true; break; }
  }
  if (ok) {
    document.getElementById("loginBox").style.display = "none";
    document.getElementById("gridView").style.display = "grid";
  } else {
    document.getElementById("err").style.display = "block";
  }
}
/* ▲▲▲ ログイン ▲▲▲ */


/* ▼▼▼ 一覧（8映像 × 横スワイプ） ▼▼▼ */
let latestCallDocs = [];
let page = 0;
const pageSize = 8;
let allVideoItems = []; // { docId, type, videoBox, videoEl }

function renderPagedGrid() {
  const wrap = document.getElementById("gridView");
  wrap.innerHTML = "";

  const start = page * pageSize;
  const end = start + pageSize;
  const items = allVideoItems.slice(start, end);

  items.forEach(item => wrap.appendChild(item.videoBox));
}

async function rebuildVideoList() {
  allVideoItems = [];

  for (const doc of latestCallDocs) {
    const d = doc.data();
    const docId = doc.id;

    const fromUid = d.from || d.callerUid;
    const toUid   = d.to   || d.calleeUid;

    // ▼ Firestore からプロフィール取得
    const fromProf = fromUid ? (await db.collection("user").doc(fromUid).get()).data() : null;
    const toProf   = toUid   ? (await db.collection("user").doc(toUid).get()).data()   : null;

    // ▼ 通報数
    const fromRepSnap = fromUid ? await db.collection("reports").doc(fromUid).get() : null;
    const toRepSnap   = toUid   ? await db.collection("reports").doc(toUid).get()   : null;

    const fromRep = fromRepSnap?.exists ? fromRepSnap.data().count || 0 : 0;
    const toRep   = toRepSnap?.exists   ? toRepSnap.data().count   || 0 : 0;

    /* ▼ caller 映像 */
    {
      const box = document.createElement("div");
      box.className = "videoBox";

      const v = document.createElement("video");
      v.autoplay = true;
      v.playsInline = true;
      v.muted = true;

      const prof = document.createElement("div");
      prof.className = "profileBox";

      if (fromProf) {
        prof.innerHTML = `
          <b>${fromProf.nickname}</b><br>
          性別：${fromProf.gender}<br>
          年齢：${fromProf.age}<br>
          都道府県：${fromProf.prefecture}<br>
          ひとこと：${fromProf.comment}<br>
          通報数：${fromRep}<br>
          <span style="opacity:0.6;">caller</span>
        `;
      } else {
        prof.textContent = "caller: プロフィールなし";
      }

      box.appendChild(v);
      box.appendChild(prof);

      allVideoItems.push({ docId, type:"caller", videoBox:box, videoEl:v });
      createDualPC(docId, "caller", v);

      box.onclick = () => openFullscreen(docId, "caller");
    }

    /* ▼ callee 映像 */
    {
      const box = document.createElement("div");
      box.className = "videoBox";

      const v = document.createElement("video");
      v.autoplay = true;
      v.playsInline = true;
      v.muted = true;

      const prof = document.createElement("div");
      prof.className = "profileBox";

      if (toProf) {
        prof.innerHTML = `
          <b>${toProf.nickname}</b><br>
          性別：${toProf.gender}<br>
          年齢：${toProf.age}<br>
          都道府県：${toProf.prefecture}<br>
          ひとこと：${toProf.comment}<br>
          通報数：${toRep}<br>
          <span style="opacity:0.6;">callee</span>
        `;
      } else {
        prof.textContent = "callee: プロフィールなし";
      }

      box.appendChild(v);
      box.appendChild(prof);

      allVideoItems.push({ docId, type:"callee", videoBox:box, videoEl:v });
      createDualPC(docId, "callee", v);

      box.onclick = () => openFullscreen(docId, "callee");
    }
  }

  renderPagedGrid();
}

/* 横スワイプ */
let touchStartX = 0;
document.addEventListener("touchstart", e => {
  touchStartX = e.touches[0].clientX;
});
document.addEventListener("touchend", e => {
  const dx = e.changedTouches[0].clientX - touchStartX;
  if (dx < -50) { page++; renderPagedGrid(); }
  if (dx > 50) { page = Math.max(0, page - 1); renderPagedGrid(); }
});
/* ▲▲▲ 一覧 ▲▲▲ */


/* ▼▼▼ WebRTC（caller / callee 2映像） ▼▼▼ */
function createDualPC(docId, type, videoEl) {
  const pc = new RTCPeerConnection({ iceServers:[{urls:"stun:stun.l.google.com:19302"}] });
  pc.addTransceiver("video", { direction:"recvonly" });
  pc.ontrack = e => videoEl.srcObject = e.streams[0];

  const callDoc = db.collection("calls").doc(docId);
  const offerCandidates = callDoc.collection("offerCandidates");
  const answerCandidates = callDoc.collection("answerCandidates");

  pc.onicecandidate = e => {
    if (!e.candidate) return;
    if (type === "caller") {
      answerCandidates.add(e.candidate.toJSON());
    } else {
      offerCandidates.add(e.candidate.toJSON());
    }
  };

  callDoc.onSnapshot(async snap => {
    const d = snap.data();
    if (!d || !d.offer || d.ended) return;

    if (pc.signalingState === "stable") {
      await pc.setRemoteDescription(new RTCSessionDescription(d.offer));
      const answer = await pc.createAnswer();
      await pc.setLocalDescription(answer);
      await callDoc.update({ answer });
    }
  });

  offerCandidates.onSnapshot(snap => {
    snap.docChanges().forEach(c => {
      if (c.type === "added" && type === "caller") {
        pc.addIceCandidate(new RTCIceCandidate(c.doc.data()));
      }
    });
  });

  answerCandidates.onSnapshot(snap => {
    snap.docChanges().forEach(c => {
      if (c.type === "added" && type === "callee") {
        pc.addIceCandidate(new RTCIceCandidate(c.doc.data()));
      }
    });
  });
}
/* ▲▲▲ WebRTC ▲▲▲ */


/* ▼▼▼ 全画面 ▼▼▼ */
let fsPC = null;

async function openFullscreen(docId, type) {
  if (fsPC) fsPC.close();

  const videoEl = document.getElementById("fullscreenVideo");
  videoEl.srcObject = null;

  const pc = new RTCPeerConnection({ iceServers:[{urls:"stun:stun.l.google.com:19302"}] });
  pc.addTransceiver("video", { direction:"recvonly" });
  pc.addTransceiver("audio", { direction:"recvonly" });
  pc.ontrack = e => videoEl.srcObject = e.streams[0];

  const callDoc = db.collection("calls").doc(docId);
  const offerCandidates = callDoc.collection("offerCandidates");
  const answerCandidates = callDoc.collection("answerCandidates");

  pc.onicecandidate = e => {
    if (!e.candidate) return;
    if (type === "caller") {
      answerCandidates.add(e.candidate.toJSON());
    } else {
      offerCandidates.add(e.candidate.toJSON());
    }
  };

  callDoc.onSnapshot(async snap => {
    const d = snap.data();
    if (!d || !d.offer || d.ended) return;

    if (pc.signalingState === "stable") {
      await pc.setRemoteDescription(new RTCSessionDescription(d.offer));
      const answer = await pc.createAnswer();
      await pc.setLocalDescription(answer);
      await callDoc.update({ answer });
    }
  });

  offerCandidates.onSnapshot(snap => {
    snap.docChanges().forEach(c => {
      if (c.type === "added" && type === "caller") {
        pc.addIceCandidate(new RTCIceCandidate(c.doc.data()));
      }
    });
  });

  answerCandidates.onSnapshot(snap => {
    snap.docChanges().forEach(c => {
      if (c.type === "added" && type === "callee") {
        pc.addIceCandidate(new RTCIceCandidate(c.doc.data()));
      }
    });
  });

  fsPC = pc;

  videoEl.muted = true;
  document.getElementById("audioToggle").textContent = "🔇";

  document.getElementById("gridView").style.display = "none";
  document.getElementById("fullscreenView").style.display = "flex";
}

document.getElementById("audioToggle").onclick = () => {
  const v = document.getElementById("fullscreenVideo");
  v.muted = !v.muted;
  document.getElementById("audioToggle").textContent = v.muted ? "🔇" : "🔈";
};

document.getElementById("backToList").onclick = () => {
  if (fsPC) fsPC.close();
  fsPC = null;
  document.getElementById("fullscreenView").style.display = "none";
  document.getElementById("gridView").style.display = "grid";
};
/* ▲▲▲ 全画面 ▲▲▲ */


/* ▼▼▼ calls 監視 ▼▼▼ */
db.collection("calls").onSnapshot(snap => {
  const docs = [];
  snap.forEach(doc => {
    const d = doc.data();
    if (!d) return;
    if (!d.offer) return;
    if (d.ended) return;
    docs.push(doc);
  });
  latestCallDocs = docs;
  rebuildVideoList();
});
/* ▲▲▲ calls 監視 ▲▲▲ */

</script>
</body>
</html>
