<!DOCTYPE html>
<html lang="ja">
<head>
  v1.0.0
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>QuietRoom Monitor</title>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

<style>
body {
  margin: 0;
  background: #000;
  color: #fff;
  font-family: sans-serif;
}

.section {
  padding: 12px;
  border-bottom: 1px solid #333;
}

.row {
  display: flex;
  gap: 8px;
}

.small-box {
  width: 50%;
  position: relative;
  background: #111;
  border-radius: 8px;
  overflow: hidden;
}

video, canvas {
  width: 100%;
  height: 100%;
  object-fit: contain;
  background: #000;
}

.btn-row {
  margin-top: 8px;
  display: flex;
  gap: 12px;
}

.btn {
  padding: 10px 16px;
  background: rgba(255,255,255,0.1);
  border: 1px solid rgba(255,255,255,0.3);
  border-radius: 6px;
  cursor: pointer;
}

#bigViewWrapper {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.9);
  display: none;
  justify-content: center;
  align-items: center;
  z-index: 100;
}

#bigView {
  width: 90vw;
  height: 90vh;
  object-fit: contain;
  background: #000;
}

#closeBig {
  position: fixed;
  top: 20px;
  right: 20px;
  font-size: 32px;
  cursor: pointer;
}
</style>
</head>

<body>

<!-- 大画面表示 -->
<div id="bigViewWrapper">
  <div id="closeBig">✖️</div>
  <canvas id="bigView"></canvas>
</div>

<!-- A -->
<div class="section">
  <h3>A さん</h3>

  <div class="row">
    <div class="small-box">
      <video id="aRaw" autoplay playsinline></video>
    </div>
    <div class="small-box">
      <canvas id="aMosaic"></canvas>
    </div>
  </div>

  <div class="btn-row">
    <button class="btn" id="aAudio">音声 ON/OFF</button>
    <button class="btn" id="aBan">BAN</button>
  </div>
</div>

<!-- B -->
<div class="section">
  <h3>B さん</h3>

  <div class="row">
    <div class="small-box">
      <video id="bRaw" autoplay playsinline></video>
    </div>
    <div class="small-box">
      <canvas id="bMosaic"></canvas>
    </div>
  </div>

  <div class="btn-row">
    <button class="btn" id="bAudio">音声 ON/OFF</button>
    <button class="btn" id="bBan">BAN</button>
  </div>
</div>

<script>
/* ============================
   Firebase 初期化
============================ */
const firebaseConfig = {
  apiKey: "AIzaSyDXSKJaknyhXGtrFQCzYhmA6r7VQR0K_GM",
  authDomain: "roomvideo.firebaseapp.com",
  projectId: "roomvideo",
  storageBucket: "roomvideo.firebasestorage.app",
  messagingSenderId: "1030429439546",
  appId: "1:1030429439546:web:1481670cb78deb35e2a703"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

/* ============================
   モザイク粒度
============================ */
const mosaicSizes = [1,4,8,12,16,20,28,36,48,64];

/* ============================
   A / B のモザイク強度
============================ */
let aLevel = 5;
let bLevel = 5;

db.collection("calls").doc("A").onSnapshot(doc=>{
  if(doc.data()?.mosaic) aLevel = doc.data().mosaic;
});

db.collection("calls").doc("B").onSnapshot(doc=>{
  if(doc.data()?.mosaic) bLevel = doc.data().mosaic;
});

/* ============================
   映像要素
============================ */
const aRaw = document.getElementById("aRaw");
const bRaw = document.getElementById("bRaw");

const aMosaic = document.getElementById("aMosaic");
const bMosaic = document.getElementById("bMosaic");

const aCtx = aMosaic.getContext("2d");
const bCtx = bMosaic.getContext("2d");

const off = document.createElement("canvas");
const offCtx = off.getContext("2d");

/* ============================
   モザイク描画
============================ */
function drawMosaic(video, canvas, ctx, level) {
  if (video.readyState < 2) return;

  const w = canvas.clientWidth;
  const h = canvas.clientHeight;

  const size = mosaicSizes[level - 1];

  off.width = size;
  off.height = Math.max(1, Math.round(size * (h / w)));

  offCtx.imageSmoothingEnabled = false;
  offCtx.clearRect(0,0,off.width,off.height);
  offCtx.drawImage(video,0,0,off.width,off.height);

  canvas.width = w;
  canvas.height = h;

  ctx.imageSmoothingEnabled = false;
  ctx.clearRect(0,0,w,h);
  ctx.drawImage(off,0,0,off.width,off.height,0,0,w,h);
}

/* ============================
   描画ループ
============================ */
setInterval(()=>{
  drawMosaic(aRaw, aMosaic, aCtx, aLevel);
  drawMosaic(bRaw, bMosaic, bCtx, bLevel);
},120);

/* ============================
   WebRTC 受信
============================ */
function connectToUser(uid, videoElement) {
  const pc = new RTCPeerConnection({
    iceServers: [{urls:"stun:stun.l.google.com:19302"}]
  });

  pc.ontrack = e => {
    videoElement.srcObject = e.streams[0];
  };

  const callDoc = db.collection("calls").doc(uid);

  callDoc.onSnapshot(async snap=>{
    const data = snap.data();
    if(data?.offer){
      await pc.setRemoteDescription(new RTCSessionDescription(data.offer));
      const answer = await pc.createAnswer();
      await pc.setLocalDescription(answer);
      await callDoc.update({adminAnswer: answer});
    }
  });

  callDoc.collection("offerCandidates").onSnapshot(snap=>{
    snap.docChanges().forEach(change=>{
      if(change.type==="added"){
        pc.addIceCandidate(new RTCIceCandidate(change.doc.data()));
      }
    });
  });
}

connectToUser("A", aRaw);
connectToUser("B", bRaw);

/* ============================
   大画面表示
============================ */
const bigWrap = document.getElementById("bigViewWrapper");
const bigCanvas = document.getElementById("bigView");
const bigCtx = bigCanvas.getContext("2d");

function showBig(video, level) {
  bigWrap.style.display = "flex";

  function draw() {
    if (video.readyState >= 2) {
      const w = bigCanvas.clientWidth;
      const h = bigCanvas.clientHeight;

      const size = mosaicSizes[level - 1];

      off.width = size;
      off.height = Math.max(1, Math.round(size * (h / w)));

      offCtx.imageSmoothingEnabled = false;
      offCtx.clearRect(0,0,off.width,off.height);
      offCtx.drawImage(video,0,0,off.width,off.height);

      bigCanvas.width = w;
      bigCanvas.height = h;

      bigCtx.imageSmoothingEnabled = false;
      bigCtx.clearRect(0,0,w,h);
      bigCtx.drawImage(off,0,0,off.width,off.height,0,0,w,h);
    }
    requestAnimationFrame(draw);
  }
  draw();
}

document.getElementById("closeBig").onclick = ()=>{
  bigWrap.style.display = "none";
};

/* タップで大画面 */
aRaw.onclick = ()=> showBig(aRaw, 1);
aMosaic.onclick = ()=> showBig(aRaw, aLevel);

bRaw.onclick = ()=> showBig(bRaw, 1);
bMosaic.onclick = ()=> showBig(bRaw, bLevel);

</script>
</body>
</html>
