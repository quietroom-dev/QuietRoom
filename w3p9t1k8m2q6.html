は<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QuietRoom 管理者</title>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

<style>
body { margin:0; padding:12px; background:#000; color:#4aff4a; font-family:monospace; }
#loginBox { text-align:center; margin-top:40px; }
#gridView {
  display:none;
  grid-template-columns:repeat(4, 1fr);
  gap:8px;
  width:100%;
  height:calc(100vh - 20px);
  overflow:hidden;
  touch-action:pan-y;
}
.videoBox {
  background:#0a0a0a;
  border-radius:8px;
  padding:4px;
  border:1px solid #1f1f1f;
}
.videoBox video {
  width:100%;
  aspect-ratio:4/3;
  background:#000;
  border-radius:4px;
}
.profileBox {
  font-size:11px;
  color:#4aff4a;
  margin-top:4px;
  line-height:1.3;
}
#fullscreenView {
  position:fixed; inset:0; background:#000;
  display:none; flex-direction:column; align-items:center; justify-content:center;
}
#fullscreenVideo { width:100%; max-width:900px; max-height:80vh; background:#000; }
#fsControls { position:fixed; bottom:16px; left:0; right:0; display:flex; justify-content:center; gap:16px; }
.fs-btn { padding:8px 16px; border-radius:20px; border:none; background:#0f0f0f; color:#4aff4a; font-size:14px; }
.fs-btn:active { background:#1f1f1f; }
</style>
</head>

<body>

<!-- ▼▼▼ ログイン画面 ▼▼▼ -->
<div id="loginBox">
  <h3 style="color:#4aff4a; font-weight:normal;">
    ── Security Operation Console ──
  </h3>

  <div style="color:#4aff4a; font-size:13px; margin-top:20px; line-height:1.6;">
    [INFO] 通信監視モジュール起動中…<br>
    [INFO] アクセス元IPを解析しています…<br>
    [WARN] 不審な接続パターンを検出…<br>
    [INFO] 追加検証プロトコルを要求します…<br>
    [SYS] セッション維持のため検証コードを入力してください
  </div>

  <input id="pass" type="password"
    placeholder="検証コード"
    style="padding:10px; width:240px; border-radius:4px; border:1px solid #4aff4a;
           background:#000; color:#4aff4a; margin-top:25px; font-family:monospace;">

  <button onclick="login()"
    style="margin-top:12px; padding:8px 18px; border:none; border-radius:4px;
           background:#0f0f0f; color:#4aff4a; font-size:12px; font-family:monospace;">
    監査ログを更新
  </button>

  <p id="err" style="color:#ff4444; display:none; margin-top:10px;">
    [ERROR] 検証失敗：再試行してください
  </p>
</div>
<!-- ▲▲▲ ログイン画面 ▲▲▲ -->

<div id="gridView"></div>

<div id="fullscreenView">
  <video id="fullscreenVideo" autoplay playsinline></video>
  <div id="fsControls">
    <button id="audioToggle" class="fs-btn">🔇</button>
    <button id="backToList" class="fs-btn">一覧へ戻る</button>
  </div>
</div>

<script>
/* Firebase */
firebase.initializeApp({
  apiKey: "AIzaSyDXSKJaknyhXGtrFQCzYhmA6r7VQR0K_GM",
  authDomain: "roomvideo.firebaseapp.com",
  projectId: "roomvideo",
  storageBucket: "roomvideo.firebasestorage.app",
  messagingSenderId: "1030429439546",
  appId: "1:1030429439546:web:1481670cb78deb35e2a703"
});
const auth = firebase.auth();
const db = firebase.firestore();

/* ▼▼▼ 管理者ログイン（password 方式） ▼▼▼ */
async function login() {
  const input = document.getElementById("pass").value;

  // admins から password を探す
  const snaps = await db.collection("admins").get();
  let ok = false;

  for (const doc of snaps.docs) {
    const d = doc.data();
    if (input === d.password) {
      ok = true;
      break;
    }
  }

  if (!ok) {
    err.style.display = "block";
    return;
  }

  try {
    // 匿名ログイン（uid を得る）
    await auth.signInAnonymously();

    // 匿名 uid を admins に登録（管理者化）
    await db.collection("admins").doc(auth.currentUser.uid).set({
      password: input
    });

    loginBox.style.display = "none";
    gridView.style.display = "grid";

  } catch (e) {
    console.error("管理者ログイン失敗:", e);
    err.style.display = "block";
  }
}
/* ▲▲▲ 管理者ログイン ▲▲▲ */


/* ▼▼▼ プロフィールキャッシュ ▼▼▼ */
const profileCache = new Map();
const reportCache  = new Map();

async function getProfile(uid) {
  if (!uid) return null;
  if (profileCache.has(uid)) return profileCache.get(uid);

  const snap = await db.collection("user").doc(uid).get();
  const data = snap.exists ? snap.data() : null;
  profileCache.set(uid, data);
  return data;
}

async function getReportCount(uid) {
  if (!uid) return 0;
  if (reportCache.has(uid)) return reportCache.get(uid);

  const snap = await db.collection("reports").doc(uid).get();
  const count = snap.exists ? (snap.data().count || 0) : 0;
  reportCache.set(uid, count);
  return count;
}
/* ▲▲▲ プロフィールキャッシュ ▲▲▲ */


/* ▼▼▼ 一覧（8映像 × 横スワイプ） ▼▼▼ */
let latestCallDocs = [];
let page = 0;
const pageSize = 8;
let allVideoItems = [];
function renderPagedGrid() {
  const wrap = document.getElementById("gridView");
  wrap.innerHTML = "";
  const start = page * pageSize;
  const end = start + pageSize;
  const items = allVideoItems.slice(start, end);
  items.forEach(item => wrap.appendChild(item.videoBox));
}
async function rebuildVideoList() {
  allVideoItems = [];
  for (const doc of latestCallDocs) {
    const userUid = doc.id;
    const [prof, rep] = await Promise.all([
      getProfile(userUid),
      getReportCount(userUid)
    ]);
    const box = document.createElement("div");
    box.className = "videoBox";
    const v = document.createElement("video");
    v.autoplay = true;
    v.playsInline = true;
    v.muted = true;
    const profDiv = document.createElement("div");
    profDiv.className = "profileBox";
    if (prof) {
      profDiv.innerHTML = `
        <b>${prof.nickname}</b><br>
        性別：${prof.gender}<br>
        年齢：${prof.age}<br>
        都道府県：${prof.prefecture}<br>
        ひとこと：${prof.comment}<br>
        通報数：${rep}<br>
        <span style="opacity:0.6;">${userUid}</span>
      `;
    } else {
      profDiv.innerHTML = `
        プロフィールなし<br>
        <span style="opacity:0.6;">${userUid}</span>
      `;
    }
    box.appendChild(v);
    box.appendChild(profDiv);
    allVideoItems.push({
      userUid,
      videoBox: box,
      videoEl: v
    });
    // 接続がまだ無い時だけ作成
    if (!pcMap.has(userUid)) {
      createAdminPC(userUid, v);
    } else {
  const pc = pcMap.get(userUid);
  pc.videoElement = v;
  if (pc.getReceivers().length > 0) {
    const streams = pc.getReceivers()
      .map(r => r.track)
      .filter(t => t)
      .map(t => new MediaStream([t]));
    if (streams.length > 0) {
      v.srcObject = streams[0];
    }
  }
}
    box.onclick = () => openFullscreen(userUid);
  }
  const maxPage =
    allVideoItems.length > 0
      ? Math.floor((allVideoItems.length - 1) / pageSize)
      : 0;
  if (page > maxPage) page = maxPage;
  renderPagedGrid();
}

/* 横スワイプ */
let touchStartX = 0;
document.addEventListener("touchstart", e => {
  touchStartX = e.touches[0].clientX;
});
document.addEventListener("touchend", e => {
  const dx = e.changedTouches[0].clientX - touchStartX;
  if (dx < -50) {
    page++;
    const maxPage = allVideoItems.length > 0 ? Math.floor((allVideoItems.length - 1) / pageSize) : 0;
    page = Math.min(page, maxPage);
    renderPagedGrid();
  }
  if (dx > 50) {
    page = Math.max(0, page - 1);
    renderPagedGrid();
  }
});
/* ▲▲▲ 一覧 ▲▲▲ */

/* ▼▼▼ WebRTC（管理者用：adminCalls）▼▼▼ */
const pcMap = new Map();
function createAdminPC(userUid, videoEl) {
  // 既に接続済みなら何もしない
  if (pcMap.has(userUid)) {
    return;
  }
  const pc = new RTCPeerConnection({
    iceServers: [
      { urls: "stun:stun.l.google.com:19302" }
    ]
  });
  pcMap.set(userUid, pc);
  pc.onconnectionstatechange = () => {
  console.log(userUid, pc.connectionState);
  if (
    pc.connectionState === "closed" ||
    pc.connectionState === "failed" ||
    pc.connectionState === "disconnected"
  ) {
    pc.close();
    pcMap.delete(userUid);
  }
};
  pc.addTransceiver("video", {
    direction: "recvonly"
  });
  pc.addTransceiver("audio", {
    direction: "recvonly"
  });
  pc.videoElement = videoEl;
  pc.ontrack = e => {
   if (pc.videoElement) {
    pc.videoElement.srcObject = e.streams[0];
   }
  };
  const callDoc = db.collection("adminCalls").doc(userUid);
  const offerCandidates =
    callDoc.collection("offerCandidates");
  const answerCandidates =
    callDoc.collection("answerCandidates");
  pc.onicecandidate = e => {
    if (!e.candidate) return;
    answerCandidates.add(
      e.candidate.toJSON()
    );
  };
callDoc.onSnapshot(async snap => {
    if (!snap.exists) {
        pc.close();
        return;
    }
    const d = snap.data();
    if (d.ended) {
        await deleteCollection(offerCandidates);
        await deleteCollection(answerCandidates);
        try {
            await callDoc.delete();
        } catch(e){}
        pc.close();
        return;
    }
    if (!d.offer) return;
    if (!pc.currentRemoteDescription) {
        await pc.setRemoteDescription(new RTCSessionDescription(d.offer));
        const answer = await pc.createAnswer();
        await pc.setLocalDescription(answer);
        await callDoc.update({
            answer: pc.localDescription.toJSON()
        });
    }
});
  offerCandidates.onSnapshot(snap => {
    snap.docChanges().forEach(change => {
      if (change.type !== "added") return;
      pc.addIceCandidate(
        new RTCIceCandidate(change.doc.data())
      );
    });
  });
}
/* ▲▲▲ WebRTC ▲▲▲ */

/* ▼▼▼ 全画面 ▼▼▼ */
let fullscreenUid = null;
function openFullscreen(userUid) {
  fullscreenUid = userUid;
  const item = allVideoItems.find(v => v.userUid === userUid);
  if (!item) return;
  const listVideo = item.videoEl;
  const fsVideo = document.getElementById("fullscreenVideo");
  // 一覧で受信しているStreamをそのまま使う
  fsVideo.srcObject = listVideo.srcObject;
  fsVideo.muted = true;
  document.getElementById("audioToggle").textContent = "🔇";
  document.getElementById("gridView").style.display = "none";
  document.getElementById("fullscreenView").style.display = "flex";
}
document.getElementById("audioToggle").onclick = () => {
  const v = document.getElementById("fullscreenVideo");
  v.muted = !v.muted;
  document.getElementById("audioToggle").textContent =
    v.muted ? "🔇" : "🔈";
};
document.getElementById("backToList").onclick = () => {
  const fsVideo = document.getElementById("fullscreenVideo");
  fsVideo.pause();
  fsVideo.srcObject = null;
  fullscreenUid = null;
  document.getElementById("fullscreenView").style.display = "none";
  document.getElementById("gridView").style.display = "grid";
};
/* ▲▲▲ 全画面 ▲▲▲ */

/* ▼▼▼ adminCalls監視 ▼▼▼ */
const pcMap = new Map();
db.collection("adminCalls").onSnapshot(async snapshot => {
  for (const change of snapshot.docChanges()) {
    const userUid = change.doc.id;
    const data = change.doc.data();
    // -----------------------------
    // 通話開始
    // -----------------------------
    if (change.type === "added") {
      if (!data.offer || data.ended) continue;
      if (pcMap.has(userUid)) continue;
      const [prof, rep] = await Promise.all([
        getProfile(userUid),
        getReportCount(userUid)
      ]);
      const box = document.createElement("div");
      box.className = "videoBox";
      const video = document.createElement("video");
      video.autoplay = true;
      video.playsInline = true;
      video.muted = true;
      const profile = document.createElement("div");
      profile.className = "profileBox";
      if (prof) {
        profile.innerHTML = `
          <b>${prof.nickname}</b><br>
          性別：${prof.gender}<br>
          年齢：${prof.age}<br>
          都道府県：${prof.prefecture}<br>
          ひとこと：${prof.comment}<br>
          通報数：${rep}
        `;
      } else {
        profile.textContent = "プロフィールなし";
      }
      box.appendChild(video);
      box.appendChild(profile);
      allVideoItems.push({
        userUid,
        videoBox: box,
        videoEl: video
      });
      createAdminPC(userUid, video);
      box.onclick = () => openFullscreen(userUid);
      pcMap.set(userUid, true);
      renderPagedGrid();
    }
    // -----------------------------
    // 通話終了
    // -----------------------------
    if (change.type === "removed" || data.ended) {
      const index = allVideoItems.findIndex(v => v.userUid === userUid);
      if (index >= 0) {
        allVideoItems.splice(index, 1);
      }
      pcMap.delete(userUid);
      renderPagedGrid();
    }
  }
});
/* ▲▲▲ adminCalls監視 ▲▲▲ */

async function deleteCollection(collectionRef) {
  const snapshot = await collectionRef.get();
  const promises = [];
  snapshot.forEach(doc => {
    promises.push(doc.ref.delete());
  });
  await Promise.all(promises);
}
  
</script>
</body>
</html>
