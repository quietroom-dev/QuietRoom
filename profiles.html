<!DOCTYPE html>
<html lang="ja">
<head>
  v1.0.3
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QuietRoom プロフィール一覧</title>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

<style>
body {
  background-color: #111;
  color: #eee;
  font-family: sans-serif;
  padding: 20px;
}
.user-card {
  background: #222;
  padding: 15px;
  margin-bottom: 15px;
  border-radius: 8px;
}
.user-card h3 {
  margin: 0 0 5px 0;
}

/* ▼ 着信UI ▼ */
#incomingCall {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.85);
  color: #fff;
  display: none;
  justify-content: center;
  align-items: center;
  flex-direction: column;
  z-index: 999;
  text-align: center;
  padding: 20px;
}
#incomingCall button {
  margin-top: 12px;
  padding: 10px 20px;
  background: #333;
  border: 1px solid #666;
  color: #fff;
  border-radius: 6px;
  cursor: pointer;
}
</style>
</head>

<body>

<button onclick="location.reload()">🔄 更新</button>
<button onclick="location.href='profile-edit.html'">✏️ プロフィール編集</button>

<h2>プロフィール一覧</h2>
<div id="userList"></div>

<!-- ▼ 着信UI ▼ -->
<div id="incomingCall">
  <h2>📞 着信があります</h2>
  <div id="callerProfile"></div>
  <button onclick="acceptCall()">出る</button>
  <button onclick="declineCall()">出ない</button>
</div>

<script>
/* alert("受信側 myUid = " + localStorage.getItem("myUid"));
*/
/* =========================================
   Firebase
========================================= */
const firebaseConfig = {
  apiKey: "AIzaSyDXSKJaknyhXGtrFQCzYhmA6r7VQR0K_GM",
  authDomain: "roomvideo.firebaseapp.com",
  projectId: "roomvideo",
  storageBucket: "roomvideo.firebasestorage.app",
  messagingSenderId: "1030429439546",
  appId: "1:1030429439546:web:1481670cb78deb35e2a703"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

/* =========================================
   UID チェック
========================================= */
const myUid = localStorage.getItem("myUid");
if (!myUid) {
  alert("エラー：UID がありません。再ログインしてください。");
  location.href = "index.html";
}

/* =========================================
   自分をオンラインにする
========================================= */
db.collection("user").doc(myUid).update({ online: true });

/* =========================================
   一覧表示
========================================= */
const userList = document.getElementById("userList");

db.collection("user")
  .orderBy("online", "desc")
  .get()
  .then(snapshot => {
    snapshot.forEach(doc => {
      const d = doc.data();
      const statusIcon = d.online ? "💡" : "💤";

      const card = document.createElement("div");
      card.className = "user-card";

      card.innerHTML = `
        <h3>${statusIcon} ${d.nickname}</h3>
        <p>性別：${d.gender}</p>
        <p>年齢：${d.age}</p>
        <p>都道府県：${d.prefecture}</p>
        <p>ひとこと：${d.comment}</p>
        <button onclick="startCall('${doc.id}')">📞 通話する</button>
      `;

      userList.appendChild(card);
    });
  });

/* =========================================
   通話開始
========================================= */
  function startCall(targetUid) {
  // ★ 発信者フラグを立てる（必須）
  localStorage.setItem("isCaller", "1");
  // ★ 相手のUIDを保存（video.htmlで使う）
  localStorage.setItem("targetUid", targetUid);
  // ★ video.htmlへ遷移
  window.location.href = `video.html?target=${targetUid}`;
}

/* =========================================
   ページ離脱でオフライン
========================================= */
window.addEventListener("beforeunload", () => {
  db.collection("user").doc(myUid).update({ online: false });
});

/* =========================================
   自動更新
========================================= */
setInterval(() => location.reload(), 60000);

/* =========================================
   ▼▼ 着信リスナー ▼▼
========================================= */
/*  alert("着信リスナーを設定したよ myUid=" + myUid);
  */
db.collection("calls").doc(myUid).onSnapshot(async (snap) => {
/*  alert("onSnapshot 発火！ data=" + JSON.stringify(snap.data()));
*/
  const data = snap.data();
  if (!data) return;

  if (data.offer && data.from) {
    showIncomingCall(data.from);
  }
});

/* =========================================
   着信UI
========================================= */
async function showIncomingCall(fromUid) {
  const prof = await db.collection("user").doc(fromUid).get();
  const d = prof.data();

  callerProfile.innerHTML = `
    <p>名前：${d.nickname}</p>
    <p>性別：${d.gender}</p>
    <p>都道府県：${d.prefecture}</p>
    <p>ひとこと：${d.comment}</p>
  `;

  window._incomingFrom = fromUid;
  incomingCall.style.display = "flex";
}

function acceptCall() {
  window.location.href = `video.html?target=${window._incomingFrom}`;
}

function declineCall() {
  db.collection("calls").doc(myUid).delete();
  incomingCall.style.display = "none";
}
</script>

</body>
</html>
