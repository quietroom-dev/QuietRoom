<!DOCTYPE html>
<html lang="ja">
<head>
  v1.1.4
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>誰かわからん通話 プロフィール一覧</title>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

<style>
body {
  background-color: #111;
  color: #eee;
  font-family: sans-serif;
  padding: 20px;
}
.user-card {
  background: #222;
  padding: 15px;
  margin-bottom: 15px;
  border-radius: 8px;
}
.user-card h3 {
  margin: 0 0 5px 0;
}
#incomingCall {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.85);
  color: #fff;
  display: none;
  justify-content: center;
  align-items: center;
  flex-direction: column;
  z-index: 999;
  text-align: center;
  padding: 20px;
}
#incomingCall button {
  margin-top: 12px;
  padding: 10px 20px;
  background: #333;
  border: 1px solid #666;
  color: #fff;
  border-radius: 6px;
  cursor: pointer;
}
</style>
</head>

<body>

<button onclick="location.reload()">🔄 更新</button>
<button onclick="location.href='profile-edit.html'">✏️ プロフィール編集</button>

<h2>プロフィール一覧</h2>
<div id="userList"></div>

<div id="incomingCall">
  <h2>通話きとるで。誰か知らんけど。<br>無音・モザイクで安全や。</h2>
  <div id="callerProfile"></div>
  <button onclick="acceptCall()">出る</button>
  <button onclick="declineCall()">出ない</button>
</div>

<script>
firebase.initializeApp({
  apiKey: "AIzaSyDXSKJaknyhXGtrFQCzYhmA6r7VQR0K_GM",
  authDomain: "roomvideo.firebaseapp.com",
  projectId: "roomvideo",
  storageBucket: "roomvideo.firebasestorage.app",
  messagingSenderId: "1030429439546",
  appId: "1:1030429439546:web:1481670cb78deb35e2a703"
});
const auth = firebase.auth();
const db = firebase.firestore();
let myUid = null;
auth.signInAnonymously();

auth.onAuthStateChanged(async user => {
  if (!user) return;
  myUid = user.uid;
  alert(myUid);
  if (!myUid) {
    alert("プロフィール作成からやり直してな。");
    location.href = "index.html";
    return;
  }

  db.collection("user").doc(myUid).update({ online: true });

  db.collection("user").orderBy("online", "desc").get().then(async snap => {
    for (const doc of snap.docs) {
      const d = doc.data();
      const repSnap = await db.collection("reports").doc(doc.id).get();
      const rep = repSnap.exists ? repSnap.data().count || 0 : 0;

      const card = document.createElement("div");
      card.className = "user-card";

      card.innerHTML = `
        <h3>${d.online ? "💡" : "💤"} ${d.nickname}</h3>
        <p>性別：${d.gender}</p>
        <p>年齢：${d.age}</p>
        <p>都道府県：${d.prefecture}</p>
        <p>ひとこと：${d.comment}</p>
        <p>通報数：${rep}</p>
        <button onclick="startCall('${doc.id}')">📞 通話する</button>
        <button onclick="reportUser('${doc.id}')">🚨 通報</button>
        <button onclick="blockUser('${doc.id}')">⛔ ブロック</button>
      `;

      userList.appendChild(card);
    }
  });

  window.unsubIncoming = db.collection("calls").doc(myUid).onSnapshot(snap => {
    const d = snap.data();
    if (!d) return;
    if (d.from === myUid) return;
    if (d.from) showIncomingCall(d.from);
  });
});

async function isBlocked(targetUid) {
  const doc = await db.collection("user").doc(myUid)
  .collection("blocks").doc(targetUid).get();
  return doc.exists;
}
async function isBlockedBy(targetUid) {
    alert("blockedBy入った");
  alert(myUid);
  alert(targetUid);
  
  const doc = await db.collection("user").doc(targetUid)
  .collection("blocks").doc(myUid).get();
    alert("blockedby出る")
  return doc.exists;
}

  
async function blockUser(targetUid) {
  await db.collection("user").doc(myUid)
    .collection("blocks").doc(targetUid)
    .set({ blockedAt: Date.now() });
  alert("ブロックしたで。");
}

async function reportUser(targetUid) {
  const already = await db.collection("reports")
    .doc(targetUid).collection("from").doc(myUid).get();

  if (already.exists) {
    alert("通報済みや。どんだけ嫌いやねん。");
    return;
  }

  await db.collection("reports")
    .doc(targetUid).collection("from").doc(myUid)
    .set({ reportedAt: Date.now() });

  await db.collection("reports").doc(targetUid)
    .set(
      { count: firebase.firestore.FieldValue.increment(1) },
      { merge: true }
    );

  await db.collection("user").doc(myUid)
    .collection("blocks").doc(targetUid)
    .set({ blockedAt: Date.now() });

  alert("通報したで。");
}

  async function startCall(targetUid) {
      alert("スタートコール開始");
      alert(targetUid);
if (await isBlocked(targetUid)) {
  alert("ブロックしとる相手や。");
  return;
}
  alert("ブロックしている確認通過");
if (await isBlockedBy(targetUid)) {
  alert("ブロックされとるで。");
  return;
}
  alert("ブロックされてる確認通過");
  // ▼ calls/{targetUid} に発信情報を書き込む（これが必須）
  await db.collection("calls").doc(targetUid).set({
    from: myUid,
    offer: null,
    answer: null,
    ended: false
  });
  alert("from作成通過");
  location.href = `video.html?target=${targetUid}`;
}


async function showIncomingCall(fromUid) {
  const snap = await db.collection("user").doc(fromUid).get();
  const d = snap.data();

  callerProfile.innerHTML = `
    <p>名前：${d.nickname}</p>
    <p>性別：${d.gender}</p>
    <p>都道府県：${d.prefecture}</p>
    <p>ひとこと：${d.comment}</p>
  `;

  window._incomingFrom = fromUid;
  incomingCall.style.display = "flex";
}

function acceptCall() {
  if (window.unsubIncoming) window.unsubIncoming();
  incomingCall.style.display = "none";
  location.href = `video.html?target=${window._incomingFrom}`;
}

function declineCall() {
  if (window.unsubIncoming) window.unsubIncoming();
  db.collection("calls").doc(myUid).delete();
  incomingCall.style.display = "none";
}
</script>

</body>
</html>
