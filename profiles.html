<!DOCTYPE html>
<html lang="ja">
<head>
  v.1.1.0
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuietRoom プロフィール一覧</title>

  <!-- Firebase（compat版） -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

  <style>
    body {
      background-color: #111;
      color: #eee;
      font-family: sans-serif;
      padding: 20px;
    }
    .user-card {
      background: #222;
      padding: 15px;
      margin-bottom: 15px;
      border-radius: 8px;
    }
    .user-card h3 {
      margin: 0 0 5px 0;
    }

    /* ▼ 着信UI ▼ */
    #incomingCall {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      color: #fff;
      display: none;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      z-index: 999;
      text-align: center;
      padding: 20px;
    }
    #incomingCall button {
      margin-top: 12px;
      padding: 10px 20px;
      background: #333;
      border: 1px solid #666;
      color: #fff;
      border-radius: 6px;
      cursor: pointer;
    }
  </style>
</head>

<body>
  <button onclick="location.reload()">🔄 更新</button>
  <h2>プロフィール一覧</h2>

  <div id="userList"></div>

  <!-- ▼ 着信UI（相手のプロフィール表示） ▼ -->
  <div id="incomingCall">
    <h2>📞 着信があります</h2>
    <div id="callerProfile"></div>
    <button onclick="acceptCall()">出る</button>
    <button onclick="declineCall()">出ない</button>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDXSKJaknyhXGtrFQCzYhmA6r7VQR0K_GM",
      authDomain: "roomvideo.firebaseapp.com",
      databaseURL: "https://roomvideo-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "roomvideo",
      storageBucket: "roomvideo.firebasestorage.app",
      messagingSenderId: "1030429439546",
      appId: "1:1030429439546:web:1481670cb78deb35e2a703"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const userList = document.getElementById("userList");

    // 自分のUID
    const myUid = localStorage.getItem("myUid");

    // 自分をオンラインにする
    if (myUid) {
      db.collection("user").doc(myUid).update({ online: true });
    }

    // user コレクションを読み込む
    db.collection("user")
      .orderBy("online", "desc")
      .get()
      .then(snapshot => {
        snapshot.forEach(doc => {
          const data = doc.data();
          const statusIcon = data.online ? "💡" : "💤";

          const card = document.createElement("div");
          card.className = "user-card";

          card.innerHTML = `
            <h3>${statusIcon} ${data.nickname}</h3>
            <p>性別：${data.gender}</p>
            <p>年齢：${data.age}</p>
            <p>都道府県：${data.prefecture}</p>
            <p>ひとこと：${data.comment}</p>
            <button onclick="startCall('${doc.id}')">📞 通話する</button>
          `;

          userList.appendChild(card);
        });
      });

    // ページ離脱でオフライン
    window.addEventListener("beforeunload", () => {
      if (myUid) {
        db.collection("user").doc(myUid).update({ online: false });
      }
    });

    // 1分ごとにページを自動更新
    setInterval(() => {
      location.reload();
    }, 60000);

    // 通話開始
    function startCall(targetUid) {
      window.location.href = `video.html?target=${targetUid}`;
    }

    /* =========================================
       ▼▼ 着信リスナー（profiles.html 専用） ▼▼
    ========================================= */
    if (myUid) {
      db.collection("calls").doc(myUid).onSnapshot(async (snap) => {
        const data = snap.data();
        if (!data) return;

        // 着信（offer）
        if (data.offer && data.from) {
          showIncomingCall(data.from);
        }
      });
    }

    /* =========================================
       ▼▼ 着信UIを表示 ▼▼
    ========================================= */
    async function showIncomingCall(fromUid) {
      const prof = await db.collection("user").doc(fromUid).get();
      const data = prof.data();

      document.getElementById("callerProfile").innerHTML = `
        <p>名前：${data.nickname}</p>
        <p>性別：${data.gender}</p>
        <p>都道府県：${data.prefecture}</p>
        <p>ひとこと：${data.comment}</p>
      `;

      window._incomingFrom = fromUid;
      document.getElementById("incomingCall").style.display = "flex";
    }

    /* =========================================
       ▼▼ 出る ▼▼
    ========================================= */
    function acceptCall() {
      const from = window._incomingFrom;
      window.location.href = `video.html?target=${from}`;
    }

    /* =========================================
       ▼▼ 出ない ▼▼
    ========================================= */
    function declineCall() {
      db.collection("calls").doc(myUid).delete();
      document.getElementById("incomingCall").style.display = "none";
    }

  </script>
</body>
</html>
