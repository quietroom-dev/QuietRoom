<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>誰かわからん通話 プロフィール登録</title>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

  <style>
    body {
      background-color: #111;
      color: #eee;
      font-family: sans-serif;
      padding: 20px;
      text-align: center;
    }
    input, select, textarea {
      width: 80%;
      padding: 10px;
      margin: 10px 0;
      border-radius: 5px;
      border: none;
    }
    button {
      width: 80%;
      padding: 12px;
      background-color: #4caf50;
      border: none;
      color: white;
      border-radius: 5px;
      font-size: 16px;
    }
    .desc {
      line-height: 1.6;
      margin-bottom: 25px;
      font-size: 16px;
    }
  </style>
</head>

<body>

  <div class="desc">
    <h2>誰かわからん通話やで。</h2>
    相手が誰か分からんまま、ゆるくつながる通話アプリや。<br>
    顔はモザイク、声は無音。安全に使えるで。<br>
    完全無料で広告もなしやから、気軽に使ってな。<br>
    <br>
    使い方<br>
    1.プロフィールを登録する。<br>
    2.気になった相手にかける。<br>
    以上！<br>
    URL開いとる時しか繋がらんから、ちょこちょこ開いといてな。<br>
  </div>

  <h2>プロフィール登録</h2>

  <input id="nickname" placeholder="ニックネーム">
  <select id="gender">
    <option value="">性別</option>
    <option value="男性">男性</option>
    <option value="女性">女性</option>
    <option value="その他">その他</option>
  </select>
  <input id="age" type="number" placeholder="年齢">
  <input id="prefecture" placeholder="都道府県">
  <textarea id="comment" placeholder="ひとこと"></textarea>

  <button onclick="saveProfile()">登録</button>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDXSKJaknyhXGtrFQCzYhmA6r7VQR0K_GM",
      authDomain: "roomvideo.firebaseapp.com",
      databaseURL: "https://roomvideo-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "roomvideo",
      storageBucket: "roomvideo.firebasestorage.app",
      messagingSenderId: "1030429439546",
      appId: "1:1030429439546:web:1481670cb78deb35e2a703"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    // ▼ 匿名ログイン
    auth.signInAnonymously().catch(err => {
      console.error("匿名ログイン失敗:", err);
    });

    // ▼ ★ここが重要：ログイン完了後に myUid を保存
    auth.onAuthStateChanged(user => {
      if (user) {
        localStorage.setItem("myUid", user.uid);
      }
    });

    // ▼ プロフィール保存
    function saveProfile() {
      const user = auth.currentUser;
      if (!user) {
        alert("ログイン待ちやで。ちょっと待ってな。");
        return;
      }

      const uid = user.uid;

      const data = {
        nickname: document.getElementById("nickname").value,
        gender: document.getElementById("gender").value,
        age: Number(document.getElementById("age").value),
        prefecture: document.getElementById("prefecture").value,
        comment: document.getElementById("comment").value,
        reportCount: 0,
        blockedUsers: [],
        friends: [],
        createdAt: new Date(),
        online: false
      };

      db.collection("user").doc(uid).set(data).then(() => {
        // 念のため二重保存
        localStorage.setItem("myUid", uid);
        window.location.href = "profiles.html";
      });
    }
  </script>

</body>
</html>
